", "name": "PHANTOM FOOT ORGASM", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The crack-split prow. From a sit start off a flat-top jug under the roof make a tricky move out, before an easy top out.", "printed_number": "27", "grade_note": null, "photo": null}, {"id": 354, "page": 97, "area": "Echoes Block", "boulder": null, "name": "POCKET ACES", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The great pocketed prow just off the walking track. Starts on obvious pockets either side of the arete. Climb the arete.", "printed_number": "19", "grade_note": null, "photo": "photos/097-2.jpg"}, {"id": 510, "page": 148, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "PREMIUM PORT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on the crescent dihedral and climb up and left using monos to the ledge and mantle.", "printed_number": "22", "grade_note": null, "photo": "photos/148-3.jpg"}, {"id": 608, "page": 174, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "RAILROAD", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Nice warm up for When We Were Kings. Sit start on a low rail 1m left of the overhang. Move to the break and follow the crackline right, topping out above the jugs on the lip.", "printed_number": "1", "grade_note": null, "photo": "photos/171-2.jpg"}, {"id": 1194, "page": 312, "area": "Tower Proper", "boulder": "Archer Tower", "name": "RAVEN MAD", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Low corner in middle of face. Drop off at jug.", "printed_number": "22", "grade_note": null, "photo": null}, {"id": 198, "page": 66, "area": "Andersens / Lower Clicke", "boulder": "Bonnie Boulder", "name": "RECKLESS PURSUIT", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Start just right of the west arete on good flakes and climb the face to meet the arete high up.", "printed_number": "17", "grade_note": null, "photo": null}, {"id": 789, "page": 217, "area": "The Bleachers", "boulder": "Moon Boulder", "name": "RED SATURN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "From inside the cave climb left along the break to finish as for Moon Walker. Chook Betts", "printed_number": null, "grade_note": null, "photo": "photos/217-1.jpg"}, {"id": 836, "page": 224, "area": "The Bleachers", "boulder": "All Betts Are Off Boulder", "name": "REVERSAL OF FORTUNE", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "High and scary with a shit landing. Climb the hanging prow on the right side of the downhill face. Downclimb - the reversal - to get off. Simon Weill", "printed_number": "95", "grade_note": null, "photo": null}, {"id": 82, "page": 45, "area": "Andersens / Left Main", "boulder": "Shotgun Boulder (inferred)", "name": "ROUNDS", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "A right-to-left traverse on jugs starting just right of the arete and finishing up Snap Dragon.", "printed_number": null, "grade_note": null, "photo": "photos/044-1.jpg"}, {"id": 837, "page": 224, "area": "The Bleachers", "boulder": "Crooked Moon Boulder", "name": "RUNNEL TROUBLE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "On the right side of the track face is a low vertical seam. From a crouch start climb left across the concave face, topping out on the left side of the face. Kade Wilson", "printed_number": "96", "grade_note": null, "photo": "photos/224-1.jpg"}, {"id": 984, "page": 254, "area": "HALLS GAP", "boulder": "TSUNAMI BOULDER", "name": "RUNNING COMMENTARY DIRECT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start with chalked-up LH pocket and RH gaston. Move up and left.", "printed_number": "34", "grade_note": null, "photo": "photos/254-2.jpg"}, {"id": 607, "page": 171, "area": "Mt Stapylton", "boulder": "Wildsides", "name": "SANDY CANDY", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start and climb the flake system to finish on", "printed_number": "5", "grade_note": null, "photo": "photos/094-389.jpg"}, {"id": 428, "page": 119, "area": "Sunset Arete Boulder", "boulder": null, "name": "SANS CIGARETTE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "From the same start as Sunset Arete follow flake line up and slightly right. Riccardo Toto Monetta", "printed_number": "26", "grade_note": null, "photo": "photos/119-1.jpg"}, {"id": 1083, "page": 282, "area": "Buandik / Got Lost", "boulder": "Sasquatch Boulder", "name": "SASS QUEEN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "(ELIMINATE) A competitive title. Start as for Sassy Pants, instead heading left and up to a crimp then make a big move to large jug out right (avoid using left arete).", "printed_number": "11", "grade_note": null, "photo": "photos/282-2.jpg"}, {"id": 634, "page": 179, "area": "Mt Stapylton", "boulder": "Ammagamma Boulder", "name": "SAUSAGE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start under roof on the large flat ledge and climb left and around onto face and up leaning crack line. Traverse right to hueco at half height.", "printed_number": "4", "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 1075, "page": 279, "area": "VICTORIA RANGE", "boulder": "MONSTER BOULDER", "name": "SCARY MONSTER", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on jugs on arête and climb directly up.", "printed_number": "3", "grade_note": null, "photo": "photos/104-436.jpg"}, {"id": 455, "page": 130, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "SESAME SUPERHIGHWAY", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on the juggy rail and make some big moves between good horizontal edges to an easy top out.", "printed_number": null, "grade_note": null, "photo": "photos/129-1.jpg"}, {"id": 1007, "page": 265, "area": "BUANDIK / MADE IT", "boulder": "SHIT CARTER BOULDER", "name": "SHIT CARTER", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on low break and climb through roof.", "printed_number": "9", "grade_note": null, "photo": "photos/265-1.jpg"}, {"id": 976, "page": 251, "area": "VENUS BATHS", "boulder": null, "name": "SLABTASTIC", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "The slab on the back (just right of the arête) may need a bit of a clean before you wobble up it. Simon Weill", "printed_number": "26", "grade_note": null, "photo": null}, {"id": 665, "page": 190, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "SMOG", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start at the left side of the cave with good holds and climb straight up to the juggy rail and exit left to top out.", "printed_number": "1", "grade_note": null, "photo": "photos/190-1.jpg"}, {"id": 768, "page": 214, "area": "The Bleachers", "boulder": "Nicholas Cage Memorial Face", "name": "SNAKE EYES", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Climb the narrow snake's body column from a sit start on the right. Up on slopers past double-knee bars and crux top-out. Chook Betts", "printed_number": "27", "grade_note": null, "photo": "photos/214-1.jpg"}, {"id": 80, "page": 44, "area": "Andersens / Left Main", "boulder": "Shotgun Boulder", "name": "SNAP DRAGON", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Start as for the Cleaver, but traverse right on slopers and top out via the razor jug.", "printed_number": null, "grade_note": null, "photo": "photos/044-1.jpg"}, {"id": 755, "page": 212, "area": "The Bleachers", "boulder": "Dovai Ray (hidden chamber)", "name": "SOAP BOX", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on slopers left of right arete. Climb left across face on yet more slopey edges to finish just right of Penny Royal Tea. Chook Betts", "printed_number": "14", "grade_note": null, "photo": "photos/212-1.jpg"}, {"id": 491, "page": 146, "area": "Trackside", "boulder": "Simon Says Boulder", "name": "SOME DAYS YOU'RE A WHORE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Rarely. Sit start on the slot 2m right of the arete. Move up to the break and traverse left and into Some Days You Bore.", "printed_number": "3", "grade_note": null, "photo": "photos/146-3.jpg"}, {"id": 890, "page": 236, "area": "Valley of the Giants", "boulder": "Weill Deal Boulder", "name": "SOMETHING NEW", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Start stand on the boulder in the middle of the face, climb the face above on thin but positive crimps. You can finish either left or right.", "printed_number": "52", "grade_note": null, "photo": "photos/236-1.jpg"}, {"id": 958, "page": 247, "area": "VENUS BATHS", "boulder": null, "name": "SPINAL TAP", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Stand start above a covered hole at the right end of the face. Climb the short face above. Oliver Miller", "printed_number": "8", "grade_note": null, "photo": "photos/247-2.jpg"}, {"id": 29, "page": 37, "area": "Andersens / Left Main", "boulder": "SPONGE BOB BOULDER", "name": "SPONGE BOB", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start at the arete on crimpy holds and climb left across the face to top out.", "printed_number": "7", "grade_note": null, "photo": "photos/025-028.jpg"}, {"id": 311, "page": 89, "area": "Legoland", "boulder": null, "name": "SPUTNIK", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Climb the tall featured line at the left side of the high face (3m right of arete) to top out just right of the hanging block.", "printed_number": "18", "grade_note": null, "photo": "photos/089-2.jpg"}, {"id": 323, "page": 91, "area": "Legoland", "boulder": null, "name": "ST DAVID", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Apparently named after Dave Pearson, the patron saint of guidebooks. Sit start matched on the lowest right-facing flake. Climb straight up.", "printed_number": "30", "grade_note": null, "photo": "photos/091-1.jpg"}, {"id": 231, "page": 69, "area": "Andersens / Lower Clicke", "boulder": "The Scab", "name": "STREAMLINE", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Sit start at the hueco under the arete. Climb up left and around to funky moves on the face.", "printed_number": "50", "grade_note": null, "photo": "photos/071-2.jpg"}, {"id": 682, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "SUPER DELUXE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on slot and edge and head straight up to a juggy top out.", "printed_number": "1", "grade_note": null, "photo": "photos/198-1.jpg"}, {"id": 512, "page": 148, "area": "Trackside", "boulder": "Website Boulder", "name": "SURFING WITHOUT A MOUSE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Climb the high central line of the face past a pocket undercling near the top.", "printed_number": "24", "grade_note": null, "photo": "photos/148-2.jpg"}, {"id": 726, "page": 206, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "TALL TALES", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start with the low incut holds just right of the arete. Move up and left on pockets and edges to meet the lip at the crack of Billy Zane.", "printed_number": "6", "grade_note": null, "photo": "photos/204-1.jpg"}, {"id": 275, "page": 80, "area": "Andersens / Clicke", "boulder": "3 Star Buttress", "name": "THE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Start 1m right of Friction Point at the letterbox slot under the roof. Reach out to good holds on the lip and continue up the face.", "printed_number": null, "grade_note": null, "photo": "photos/080-1.jpg"}, {"id": 1079, "page": 279, "area": "VICTORIA RANGE", "boulder": "SPACE PIRATE SHIP", "name": "THE BOTANIST", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Roughly 5m right of Matt Damon, on the left side of an overhang. Sit start on left side-pull and right crimp, make a few delicate moves to gain jugs on lip and top out. Zoe Redmond", "printed_number": "7", "grade_note": null, "photo": "photos/279-1.jpg"}, {"id": 521, "page": 149, "area": "Trackside", "boulder": "Colossus Boulder", "name": "THE COLOSSUS", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Start at the right side of the tall orange face with incut holds in the rail. Climb to the first ledge on edges and then top out over the high second bulge.", "printed_number": "31", "grade_note": null, "photo": "photos/085-340.jpg"}, {"id": 302, "page": 88, "area": "Legoland", "boulder": null, "name": "THE CONDUCTOR", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Stand start at the arete on crimps and move up right to top out. Tim Fahey", "printed_number": "9", "grade_note": null, "photo": "photos/087-1.jpg"}, {"id": 511, "page": 148, "area": "Trackside", "boulder": "Website Boulder", "name": "THE MASTURGATOR", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Scary. high slab climbing. Climb the line up the left arete and face.", "printed_number": "23", "grade_note": null, "photo": "photos/148-2.jpg"}, {"id": 1094, "page": 285, "area": "Buandik / Got Lost", "boulder": "Potato Boulder", "name": "THE POTATO BOULDER", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "On the left side of the face is a blunt hanging prow. Climb it from a sit. Miriam Perschmann", "printed_number": "22", "grade_note": null, "photo": "photos/285-3.jpg"}, {"id": 142, "page": 55, "area": "Andersens / Right Main", "boulder": "Seduction Wall", "name": "THE SEDUCTION LINE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Hidden away, but excellent. Just around the corner from Selective Ethics, sit start on edges in the seam. Climb the featured line of worn holds above. Julian Saunders", "printed_number": "27", "grade_note": null, "photo": "photos/056-2.jpg"}, {"id": 1196, "page": 313, "area": "Tower Proper", "boulder": "The Stool", "name": "THE STOOL", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "From a stand 1m left of the front of the buttress, climb the left face on small holds. Ross Taylor", "printed_number": "2", "grade_note": null, "photo": "photos/312-2.jpg"}, {"id": 1296, "page": 332, "area": "Windowlicker Area", "boulder": "Sun Arete Boulder", "name": "THE SUN ARETE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The left arete of the cracked face is superb and very gorgeous in the afternoon light. Watch out for the spicy finish. Simon Weill", "printed_number": "40", "grade_note": null, "photo": "photos/332-1.jpg"}, {"id": 55, "page": 41, "area": "Andersens / Left Main", "boulder": "Tim Tam Boulder (inferred)", "name": "THE TRAVELLER", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Named after a certain kind of erection. Stand start on small crimps in the thin crack 3m left of the nose of the boulder where Tim Tam Traverse starts. Up the slab. Ross Taylor", "printed_number": "33", "grade_note": null, "photo": null}, {"id": 2, "page": 31, "area": "Andersens / Amnesty", "boulder": "METROSEXUAL BOULDER (inferred)", "name": "THUMBS UP", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on the low flake just right of the arete and make delicate moves up to a tricky mantle. Julian Saunders", "printed_number": "2", "grade_note": null, "photo": "photos/031-2.jpg"}, {"id": 98, "page": 47, "area": "Andersens / Left Main", "boulder": "Gobsmacker Corner (inferred)", "name": "TICKITY BOO", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The little triangle of rock at the entrance to the cave behind Epinephrine. Sit start with LH on good sloper and RH on the arete, mantle past the chockstone. Kade Wilson", "printed_number": "76", "grade_note": null, "photo": "photos/047-1.jpg"}, {"id": 1213, "page": 317, "area": "Tower Proper", "boulder": "Unnamed quartz-seamed boulder below Mojo", "name": "TIJUANA BRASS BAND", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "On the opposite side of the boulder from Ribbed for Her Pleasure (right on the track) is a little face. Grab side-pulls and make a move or two up. Julian Saunders", "printed_number": "19", "grade_note": null, "photo": null}, {"id": 1021, "page": 268, "area": "BUANDIK / MADE IT", "boulder": "DEAF LEOPARD BOULDER", "name": "TINY DYNAMIC", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Orange face of north-facing wall. Mantle jug, pop for the hueco, drop off. Axel Perschmann", "printed_number": "23", "grade_note": null, "photo": "photos/268-4.jpg"}, {"id": 137, "page": 54, "area": "Andersens / Right Main", "boulder": "Button Boulder", "name": "TOY SOLDIER", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Start as for Joey, but traverse right to a tricky move to the higher jugs and top out.", "printed_number": "22", "grade_note": null, "photo": "photos/054-1.jpg"}, {"id": 553, "page": 156, "area": "Trackside", "boulder": "Upper Boulder", "name": "UPPERCUT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on the bulge just left of the arete and climb the steep wall on good holds.", "printed_number": "65", "grade_note": null, "photo": "photos/156-1.jpg"}, {"id": 180, "page": 62, "area": "Andersens / Right Main (inferred)", "boulder": "Vapid Boulder", "name": "VAPID", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start at the low blocky jug in the middle of the wall and make a big move left to edges. finish up scoop", "printed_number": "1", "grade_note": null, "photo": "photos/064-1.jpg"}, {"id": 739, "page": 207, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "WARM UP LEFT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start with a jug letterbox slot and move up past a small edge in the roof to the lip. Mantle into glory.", "printed_number": "19", "grade_note": null, "photo": "photos/206-1.jpg"}, {"id": 1215, "page": 317, "area": "Tower Proper", "boulder": "Mojo Boulder (east face)", "name": "WHITE RHINO", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "From the same start, climb the right side of the cracked face, again, trying not to fall off onto the boulder below. Julian Saunders", "printed_number": "21", "grade_note": null, "photo": null}, {"id": 495, "page": 146, "area": "Trackside", "boulder": "Simon Says Boulder", "name": "WIGGLY BOY", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Getting your arse off the ground is the crux. Sit start matched on the big, flat undercling. Move up to the slope, slap for the ledge and mantle.", "printed_number": "7", "grade_note": null, "photo": "photos/146-2.jpg"}, {"id": 249, "page": 75, "area": "Andersens / Clicke", "boulder": "Coppertone Boulder (inferred)", "name": "WINGED PRAYER", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Thin slab climbing. Stand start just right of the arete and climb the slab on shallow pockets to breaks and then top out", "printed_number": "9", "grade_note": null, "photo": "photos/075-1.jpg"}, {"id": 441, "page": 128, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "WINNER TAKES ALL", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Bouldering development mantra. Sit start 5m left of Innocence at the large flake. Climb up on good holds in the feature to top out over the short headwall onto the ledge.", "printed_number": "5", "grade_note": null, "photo": null}, {"id": 36, "page": 38, "area": "Andersens / Left Main", "boulder": "B2 BOULDER (inferred)", "name": "X2", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Start as for Buck Deluxe and climb up right on edges and pockets to top out over the high face.", "printed_number": null, "grade_note": null, "photo": "photos/038-1.jpg"}, {"id": 840, "page": 226, "area": "Valley of the Giants", "boulder": "Valley of Wads Boulder", "name": "ZINEDINE ZIDANE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Never runs straight. The stepped leftwards leaning crack is climbed from a stand start.", "printed_number": "2", "grade_note": null, "photo": null}, {"id": 841, "page": 226, "area": "Valley of the Giants", "boulder": "Valley of Wads Boulder", "name": "ZIZOU", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "From a stand start off small holds, make a tricky move or two up to cracks and easier climbing.", "printed_number": "3", "grade_note": null, "photo": null}, {"id": 162, "page": 58, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "4:45", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on the low flake and climb straight up to top out.", "printed_number": null, "grade_note": null, "photo": "photos/059-2.jpg"}, {"id": 464, "page": 133, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "A HORSE IS A HORSE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Undeniable logic in the name and a popular warm up/project. Sit start low on underclings. Move out to the left-trending line of pockets and make a big move to the rail. Finish on the left-hand end. Gordon Poultney", "printed_number": "28", "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 588, "page": 167, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "AIR TRAVERSE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start as for Waiting in the Air. Move to the lip and traverse right following the lip the entire way to finish on the same jug as the finish of Waiting In the Air.", "printed_number": "8", "grade_note": null, "photo": "photos/167-2.jpg"}, {"id": 997, "page": 256, "area": "HALLS GAP", "boulder": "STOPLIGHT ARETE", "name": "AND THEN THERE WAS RED", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Classic. Stand start on small crimp edges, move left into the corner and make a committing few moves up to large holds and top out.", "printed_number": "47", "grade_note": null, "photo": "photos/256-3.jpg"}, {"id": 954, "page": 244, "area": "VENUS BATHS", "boulder": "THE BEANSTALK BOULDER", "name": "ANT MAN", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Just right of the corridor (in front of a tree) are some vertical seams dropping down from the top of the boulder. Climb them from a stand start. Oliver Miller", "printed_number": "4", "grade_note": null, "photo": "photos/247-2.jpg"}, {"id": 210, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "ARM AND A LEG", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Nice climbing up the beautiful face. Sit start on the blocky horizontal at the edge of the roof. Move up on good holds and veer left on good edges on the face to finish up #28.", "printed_number": null, "grade_note": null, "photo": "photos/067-1.jpg"}, {"id": 848, "page": 230, "area": "Valley of the Giants", "boulder": "Wall of Arses Boulder", "name": "ARSE FACE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Unattractive end. Sit start above the flake of rock on the overhanging face's left end. Climb up a move or two, finish left through greenery above less-than-ideal landing. Simon Weill", "printed_number": "10", "grade_note": null, "photo": "photos/230-3.jpg"}, {"id": 779, "page": 216, "area": "The Bleachers", "boulder": "Buttress left of Korean Jesus", "name": "ART OF ELSEWHERE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The stunning arete. Start from an obvious two-finger pocket and climb the south face on slopey crimps before moving to the arete proper for the delicate and spicy final moves. Ignore the name, be present. Simon Weill", "printed_number": "38", "grade_note": null, "photo": "photos/216-3.jpg"}, {"id": 1005, "page": 264, "area": "BUANDIK / MADE IT", "boulder": "TRACK CRACK", "name": "BACK, SACK & CRACK", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start under roof on the opposite end of the boulder (just right of tree). Up and left.", "printed_number": "7", "grade_note": null, "photo": "photos/264-2.jpg"}, {"id": 720, "page": 203, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "BEAM ME UP", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Where are you Scotty? Start on the good hold in the middle of the roof then head through the scoop and up the rail.", "printed_number": null, "grade_note": null, "photo": "photos/203-2.jpg"}, {"id": 108, "page": 51, "area": "Andersens / Right Main", "boulder": null, "name": "BEAVER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start on the low end of the horizontal flake at the far right of the wall. Climb the rail up to a tricky mantle.", "printed_number": "86", "grade_note": null, "photo": "photos/048-2.jpg"}, {"id": 1099, "page": 285, "area": "Buandik / Got Lost", "boulder": "Still Here Boulder", "name": "BELLA AUSTRALIA", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on left side of cave and finish as for Holerun. M Eckstein", "printed_number": "27", "grade_note": null, "photo": null}, {"id": 725, "page": 205, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "BILLY ZANE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start as for Far Left Zane. Follow the thin diagonal crack all the way to the lip. Gordon Poultney", "printed_number": "5", "grade_note": null, "photo": "photos/204-1.jpg"}, {"id": 1024, "page": 268, "area": "BUANDIK / MADE IT", "boulder": "DEAF LEOPARD BOULDER (uncertain)", "name": "BIRD NEST", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "From a stand start climb the diagonal weakness right, then up. Yannick Godfrin", "printed_number": "26", "grade_note": null, "photo": "photos/268-1.jpg"}, {"id": 1139, "page": 295, "area": "Buandik / Far Out", "boulder": "Bloc View Area", "name": "BLOC VIEW", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A short boulder on the left side of the corridor. From sit start move left to mantle.", "printed_number": "3", "grade_note": null, "photo": "photos/295-2.jpg"}, {"id": 213, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "BOLD AND OLD", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The two are almost certainly incompatible. Climb Golden Oldie to the jugs on the arete and keep traversing right on good holds to a juggier exit.", "printed_number": "32", "grade_note": null, "photo": "photos/067-1.jpg"}, {"id": 576, "page": 163, "area": "Mt Stapylton", "boulder": "Spurt & Afterglow Walls", "name": "BOSSANOVA LEFT", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "Sit start under the roof at the furthest back holds and climb out the low roof on crack lines to an early exit out left to mantle the block.", "printed_number": "10", "grade_note": null, "photo": null}, {"id": 935, "page": 241, "area": "VALLEY OF THE GIANTS", "boulder": "HOBO BOULDER", "name": "BRANNIGAN'S LAW", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "Sit start on good holds 1m right of arête up via punchy moves to finish yarding over the bulge.", "printed_number": "97", "grade_note": null, "photo": null}, {"id": 1126, "page": 292, "area": "Buandik / Got Lost", "boulder": "Brushing For boulder", "name": "BRUSHING FOR", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Climb the obvious arete from a stand start. Jochen Perschmann", "printed_number": null, "grade_note": null, "photo": "photos/291-1.jpg"}, {"id": 1157, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "CAN'T KEEP A...", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on underclings 2m right of Man Down. Using heels and hands out to the big fin, slap left to pinch and grapple upwards.", "printed_number": null, "grade_note": null, "photo": "photos/301-2.jpg"}, {"id": 60, "page": 42, "area": "Andersens / Left Main", "boulder": null, "name": "CARELESS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Stand start on the bottom of the half-moon feature. Climb the feature to top out. (caution: the bottom of the feature may be loose).", "printed_number": "40", "grade_note": null, "photo": "photos/042-2.jpg"}, {"id": 346, "page": 96, "area": "Echoes Block", "boulder": null, "name": "CARLTON COLDIES", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Never as good as you hope. Start as for Fallen Cow and make a long move to good holds in the diagonal seams. Traverse right to finish on the jug of Fallen Cow.", "printed_number": "11", "grade_note": null, "photo": "photos/096-2.jpg"}, {"id": 609, "page": 174, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "CARPET CRAWLER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Climb Railroad to where the crackline angles upwards. Move out right under the roof to finish up Cinema Show.", "printed_number": "2", "grade_note": null, "photo": "photos/171-2.jpg"}, {"id": 619, "page": 176, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "CHAS REMAINS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Who is Chas and why does he remain? Start on the rail, climbing up and slightly left to the lip of the roof.", "printed_number": "12", "grade_note": null, "photo": "photos/175-1.jpg"}, {"id": 612, "page": 174, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "CINEMA SHOW", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start at Slot Machine and make two moves right onto good holds. Make a big move to a juggy flakeline and then go straight over the lip to mantle.", "printed_number": "5", "grade_note": null, "photo": "photos/174-1.jpg"}, {"id": 647, "page": 184, "area": "Mt Stapylton", "boulder": "Cock Toe Boulder", "name": "COCK TOE ARETE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sean visited Oz when he was 19 and climbed this as well as onsight soloed the massive face behind. Stand start on a big jug just right of the arete and climb up to a high top out over the peak. Sean Villanueva-O'Driscoll", "printed_number": "17", "grade_note": null, "photo": null}, {"id": 248, "page": 75, "area": "Andersens / Clicke", "boulder": "Coppertone Boulder", "name": "COPPERTONE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A beautiful line of pockets. Sit start just left of the arete and climb the orange streak. Dave Jones", "printed_number": "8", "grade_note": null, "photo": "photos/059-223.jpg"}, {"id": 34, "page": 38, "area": "Andersens / Left Main", "boulder": "B2 BOULDER (inferred)", "name": "COTTON CAMEL", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start at the arching seam of slopers on the lip of the rooflet. Traverse right and up into the crack.", "printed_number": "12", "grade_note": null, "photo": "photos/038-1.jpg"}, {"id": 449, "page": 129, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "CUT AND WASTE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A left-to-right traverse of the wall above and to the right of the Innocence Wall. Sit start and head right on a collection of pockets, slopers and edges.", "printed_number": "13", "grade_note": null, "photo": "photos/129-2.jpg"}, {"id": 887, "page": 236, "area": "Valley of the Giants", "boulder": "Unidentified boulder (see notes)", "name": "DARK ARTS", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "On the back side of the boulder is a cave. Sit start on pockets, finishing up prow. Oliver Miller", "printed_number": "49", "grade_note": null, "photo": null}, {"id": 992, "page": 256, "area": "HALLS GAP", "boulder": "IMMERSION BOULDER", "name": "DEATH BY DROWNING", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "Or by cratering into the ground. High and dangerous. On the back side is a short slab that leads to a sickle crack. Oliver Miller", "printed_number": "42", "grade_note": null, "photo": null}, {"id": 1128, "page": 292, "area": "Buandik / Got Lost", "boulder": "Mini Rigs", "name": "DEATH OF A POTATO", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "Not as memorable as the passing of a salesman. Sit start under the low featured roof and climb left. Miriam Perschmann", "printed_number": "55", "grade_note": null, "photo": null}, {"id": 990, "page": 255, "area": "HALLS GAP", "boulder": "IMMERSION BOULDER", "name": "DIVERSION", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Techy bridging that follows seams up the groove to the left of Immersion. Oliver Miller", "printed_number": "40", "grade_note": null, "photo": "photos/255-1.jpg"}, {"id": 1017, "page": 267, "area": "BUANDIK / MADE IT", "boulder": "DONKEY KONG CORRIDOR", "name": "DONKEY KONG", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "Climb the lower arête of the boulder that forms the left wall of the corridor via a big first move followed by a high top out on good holds. Stephen Waring", "printed_number": "19", "grade_note": null, "photo": null}, {"id": 485, "page": 141, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "DOWNUNDER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Is the arse end of the universe? Sit start on the same slots as Lullaby. Climb up, trending left, then right to finish on the good jug.", "printed_number": "10", "grade_note": null, "photo": "photos/139-2.jpg"}, {"id": 369, "page": 103, "area": "Hollow Mountain Cave", "boulder": null, "name": "EASY DOES IT", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The only line in the cave where keeping your bum off the ground is an issue. Start on the good flat hold and climb the line of flakes running 3m right with a big final move to end in the bucket undercling.", "printed_number": "10", "grade_note": null, "photo": "photos/101-2.jpg"}, {"id": 336, "page": 95, "area": "Echoes Block", "boulder": null, "name": "FACKELN IM STURM", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start bear-hugging low on the overhanging arete with a LH pocket and RH incut slot. Climb under the arete to holds on the right side before topping out over the nose.", "printed_number": "1", "grade_note": null, "photo": "photos/095-2.jpg"}, {"id": 578, "page": 163, "area": "Mt Stapylton", "boulder": "Spurt & Afterglow Walls", "name": "FADING LITE", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "Sit start with a RH shallow pocket and a sharp hidden LH pocket just left of where Bossanova Roof starts. Move up to the lip via the rail and mantle onto the slab.", "printed_number": "12", "grade_note": null, "photo": null}, {"id": 584, "page": 166, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "FARMER TRAVERSE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start on the left edge of the big flake and traverse about 12m right along the lower horizontal weakness to finish up John Deere. Will Detmold. A variant can be done using the higher line of holds near the end of the traverse finishing on the sloper to the left of the original finish jug.", "printed_number": "4", "grade_note": null, "photo": "photos/166-1.jpg"}, {"id": 417, "page": 115, "area": "Loopeys", "boulder": null, "name": "FASHION", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Popular. Sit start on a good hold in the crack and the pocket above it. Climb the right trending diagonal weakness to a juggy mantle. Gordon Poultney", "printed_number": "15", "grade_note": null, "photo": "photos/115-1.jpg"}, {"id": 303, "page": 88, "area": "Legoland", "boulder": null, "name": "FERN GULLY", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Stand start on the lowest point of the seam over the boulder. Move up right to a diagonal seam and top out.", "printed_number": "10", "grade_note": null, "photo": "photos/088-2.jpg"}, {"id": 251, "page": 76, "area": "Andersens / Clicke", "boulder": "Coppertone Boulder (inferred)", "name": "FORMULA ONE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "From a stand climb the right side of the slab from the deep seam. Top out right of the wall's peak", "printed_number": null, "grade_note": null, "photo": "photos/075-1.jpg"}, {"id": 536, "page": 151, "area": "Trackside", "boulder": "Tiger Boulder", "name": "FUTURE WOLF & THE GAY PARISIAN MILK INCIDENT", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "We gave it a star just for the name. Stand start at the blocky undercling and climb the committing right side of the face over the sloping slab. Tom O'Halloran", "printed_number": "48", "grade_note": null, "photo": null}, {"id": 212, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "GOLDEN OLDIE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start as for Arm and a Leg and follow the diagonal weakness up right to jugs on the nose. Make hard moves up right to a thin incut edge and higher pocket and top out.", "printed_number": "31", "grade_note": null, "photo": "photos/067-1.jpg"}, {"id": 1051, "page": 275, "area": "BUANDIK / MADE IT", "boulder": "THE EYRIE (wall below Balazar)", "name": "GRAVEYARD", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start as for Balazar but climb straight up, mantling into the hueco on the left to finish. Katinka Perschmann", "printed_number": "53", "grade_note": null, "photo": "photos/274-2.jpg"}, {"id": 444, "page": 129, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "GUILT", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A commonly felt emotion amongst climbers. Sit start at the base of the leaning arete. Mantle into the scoop and climb straight up on slopers and edges.", "printed_number": "8", "grade_note": null, "photo": "photos/129-3.jpg"}, {"id": 885, "page": 233, "area": "Valley of the Giants", "boulder": "Weilly Bin Boulder", "name": "HAIR CARE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Lee's favourite subject? Under the curving tree. Stand start on underclings, slap left and lurch right for the jug then slopey top out. Lee Cossey", "printed_number": null, "grade_note": null, "photo": "photos/233-1.jpg"}, {"id": 256, "page": 77, "area": "Andersens / Clicke", "boulder": "Shandy Boulder", "name": "HAND SHANDY", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "What is a hand shandy? Sit start at the base of the arete and then climb to the top on layaways and pockets.", "printed_number": "16", "grade_note": null, "photo": "photos/076-1.jpg"}, {"id": 284, "page": 81, "area": "Andersens / Clicke", "boulder": null, "name": "HAUNTED", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start matched on the flake over the dicey broken talus and climb to the ledge.", "printed_number": "44", "grade_note": null, "photo": "photos/081-4.jpg"}, {"id": 750, "page": 211, "area": "The Bleachers", "boulder": "Evans Above Cave", "name": "HEART SHAPED BOX", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Undercling heart-shaped shield of rock on right of cave (2m left of crack) to gaston and high finish.", "printed_number": "9", "grade_note": null, "photo": null}, {"id": 593, "page": 167, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "HELMUT", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "From the sit start follow Karl up the crack and continue rightwards to a big move to a crimp then up to some fragile looking lip jugs.", "printed_number": "13", "grade_note": null, "photo": "photos/167-2.jpg"}, {"id": 802, "page": 220, "area": "The Bleachers", "boulder": "Prow Boulder", "name": "HERO", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The tall prow's frightening conclusion offers the moderate-grade climber the chance to be a hero. Sit start on the prow's left side, compression up using left knee scum to gain good LH side-pull, which leads to good holds. Finish left at the top. Simon Weill", "printed_number": "61", "grade_note": null, "photo": null}, {"id": 425, "page": 117, "area": "Loopeys", "boulder": "Overlooked Wall", "name": "HIKE THE MOON", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "As they say, position position, position. This easier companion route to Eagle's Nest is a perfect intro to highballing. Four metres left of the black weakness that splits the wall is a jug in a dark grey streak. From the jug, make a series of crimp moves until you hit jugs and a high, easy finish. Riccardo Toto Monetta", "printed_number": "23", "grade_note": null, "photo": "photos/117-1.jpg"}, {"id": 103, "page": 48, "area": "Andersens / Left Main", "boulder": "Birthday Slab", "name": "HOLDING PATTERN", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A highball line up the middle of the wall. Start in the lichen-covered scoop and climb to the diagonal breaks, which are followed by better holds leading to the top. Julian Saunders", "printed_number": "81", "grade_note": null, "photo": "photos/047-3.jpg"}, {"id": 404, "page": 112, "area": "Loopeys", "boulder": null, "name": "HOT CARL", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "Sit start matched on the RH grey edge of Crimpy Caterpillar, but make a big move out right to the slopey ledge, which is traversed further right until you can climb up the obvious groove weakness. Peter Arciadiaco", "printed_number": "2", "grade_note": null, "photo": null}, {"id": 1104, "page": 286, "area": "Buandik / Got Lost", "boulder": "Still Here Boulder", "name": "I'MA KOALA", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The name makes sense when you descend off the boulder down the tree. The left arete can be done as a Stand or sit (V5).", "printed_number": "32", "grade_note": null, "photo": "photos/286-2.jpg"}, {"id": 138, "page": 54, "area": "Andersens / Right Main", "boulder": "Illiad Boulder", "name": "ILLIAD", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A fun problem. Sit start under the prow. Reach up to good holds and top out right. Gavin Portier", "printed_number": "23", "grade_note": null, "photo": "photos/055-2.jpg"}, {"id": 999, "page": 258, "area": "BUANDIK / MADE IT", "boulder": "HILLARY STEP", "name": "INSTANT CLASSIC", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start just left of the right end of the long face on low holds. Climb up to tricky mantle.", "printed_number": "1", "grade_note": null, "photo": "photos/264-3.jpg"}, {"id": 555, "page": 156, "area": "Trackside", "boulder": "Upper Boulder", "name": "JAB", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start with good holds 2m right of the arete and climb the V-shaped seams to top out the high point of the wall.", "printed_number": null, "grade_note": null, "photo": "photos/156-1.jpg"}, {"id": 277, "page": 80, "area": "Andersens / Clicke", "boulder": "3 Star Buttress", "name": "JACOBS LADDER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start on the big horizontal break. Make a long reach over the bulge to edges. Continue up the slab to top out.", "printed_number": "37", "grade_note": null, "photo": "photos/080-3.jpg"}, {"id": 924, "page": 240, "area": "Valley of the Giants", "boulder": "Hand of Fatima", "name": "K-BORKIAN CLOVER", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "On the back side of the boulder is a chalked up diagonal. Sit start on cracks and up rightwards.", "printed_number": "85", "grade_note": null, "photo": null}, {"id": 1036, "page": 270, "area": "VICTORIA RANGE", "boulder": "MASSIVE DYNAMIC BOULDER (uncertain)", "name": "KILLIAN SUCKS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "So does the name. Climb the black arête, which looks like it has lost a hold, finishing right towards the top.", "printed_number": "38", "grade_note": null, "photo": "photos/270-1.jpg"}, {"id": 834, "page": 224, "area": "The Bleachers", "boulder": "Frankston Boulders (downhill face)", "name": "KLEPTOCRACY", "grade_raw": "V4", "grade_num": 4, "pictured": 0, "description": "Barn from the entitlement of the ruling class. At the left end of the downhill face is a big jug under a small roof. From the jug go left around the lip then up to high finish. Simon Weill", "printed_number": "93", "grade_note": null, "photo": null}, {"id": 740, "page": 207, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "KNOB JOCKEY", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "An insult that's falling out of favour. Sit start on slopey edges under the nose between Warm Up Left and Warm Up Right. Move back through the roof via a slot and a knob-pinch to top out.", "printed_number": "20", "grade_note": null, "photo": "photos/206-1.jpg"}, {"id": 728, "page": 206, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "LEFT FOR DEAD", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start with the arrow-shaped hold just right of the arete. Climb right on small crimps and slopers, finishing on the same jug as Jugged.", "printed_number": "8", "grade_note": null, "photo": "photos/204-1.jpg"}, {"id": 1081, "page": 279, "area": "VICTORIA RANGE", "boulder": "SPACE PIRATE SHIP", "name": "MARVIN", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start as for Space Pirate but head right up obvious crack.", "printed_number": "9", "grade_note": null, "photo": "photos/279-1.jpg"}, {"id": 703, "page": 201, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "MINUS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "For once a minus is better than a plus. Sit start at the back of the cave on crimp/pinch feature, follow the line of holds left out of the roof.", "printed_number": "22", "grade_note": null, "photo": "photos/201-3.jpg"}, {"id": 1211, "page": 317, "area": "Tower Proper", "boulder": "Mojo Boulder", "name": "MOJO", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Terrifying. From the ledge on the right climb left so you are high above the drop, then commit to even higher finish up the black streak on good holds. Julian Saunders", "printed_number": "17", "grade_note": null, "photo": "photos/317-2.jpg"}, {"id": 788, "page": 217, "area": "The Bleachers", "boulder": "Moon Boulder", "name": "MOON WALKER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start low on the right prow. Punch to the good jug and then climb prow, you collect bonus points if you stop to style a bat hang at the lip, though remember when you are confronting the tricky exit that pride comes before a fall. Chook Betts", "printed_number": "477", "grade_note": null, "photo": "photos/217-2.jpg"}, {"id": 87, "page": 45, "area": "Andersens / Left Main", "boulder": "Lygon St Boulder", "name": "MUNGO GETS THE GIRL", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Mistakenly called Spew Boy in the last edition. Start on the right arete and climb up and left.", "printed_number": "65", "grade_note": null, "photo": "photos/045-1.jpg"}, {"id": 616, "page": 175, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "MUST HAVE BEEN THE THIEF", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on the shelf at Kamikaze on good pockets. Climb straight up on undercling and sidepull pockets to the good holds on the lip.", "printed_number": null, "grade_note": null, "photo": "photos/175-1.jpg"}, {"id": 738, "page": 207, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "NESTED", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start with pockets on the right side of the low but deep cave. Move up to holds in the seam, then left to pockets around the bulge. Finish up the face.", "printed_number": "18", "grade_note": null, "photo": "photos/206-2.jpg"}, {"id": 234, "page": 70, "area": "Andersens / Lower Clicke", "boulder": "The Scab (inferred)", "name": "NO FUTURE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start holding the hueco under the prow and a good side-pull to the right. Move up the juggy flake and onto holds on the face above it.", "printed_number": "53", "grade_note": null, "photo": "photos/071-2.jpg"}, {"id": 102, "page": 48, "area": "Andersens / Left Main", "boulder": "Cave behind Tickity Boo (inferred)", "name": "OESTERONE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start on the good flat holds at the arete and make a big move up right to an easier top out.", "printed_number": "80", "grade_note": null, "photo": null}, {"id": 1039, "page": 271, "area": "VICTORIA RANGE", "boulder": "BLACK SABBATH WALL", "name": "OLAF THE CEREBRAL VIKING", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "From the obvious horizontal break make long move to the diagonal. Up. Olaf Ciolek", "printed_number": "41", "grade_note": null, "photo": "photos/271-2.jpg"}, {"id": 408, "page": 114, "area": "Loopeys", "boulder": null, "name": "OLD HENRY'S FUN CLIMB", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Originally called Snotty Glass. A fantastic line of edges up a tall, overhanging wall. Start matched on the slopey break and head straight up on big moves between good holds.", "printed_number": "6", "grade_note": null, "photo": "photos/114-3.jpg"}, {"id": 1299, "page": 332, "area": "Windowlicker Area", "boulder": "Sun Arete Boulder", "name": "PAD SANDWICH", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Bring loads. The slabby purple face. Simon Weill", "printed_number": "43", "grade_note": null, "photo": "photos/332-1.jpg"}, {"id": 1304, "page": 108, "area": "Hollow Mountain Cave", "boulder": null, "name": "PALM BEACH", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Half bouldering/half Cirque Du Soleil. Start pressed into the bowl 2m to the right of Rave Heart with some very poor holds. Reach back to the crack and dyno out to the good hold. Grading is honesty based", "printed_number": "33", "grade_note": "printed as V4/7", "photo": "photos/107-1.jpg"}, {"id": 349, "page": 96, "area": "Echoes Block", "boulder": null, "name": "PANIC SWITCH", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start standing on the lower boulder with a good LH pocket on the slab and a blocky RH side-pull under the overlan 'hb the high slab on seams.", "printed_number": "14", "grade_note": null, "photo": "photos/096-1.jpg"}, {"id": 117, "page": 52, "area": "Andersens / Right Main", "boulder": "Gasoline Prow", "name": "PETROL SNIFFER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Looks suspiciously tricky for the grade. Start at jug of Gasoline, but make a big reach right to the opposite side of the boulder, climbing along the prow to top out at the point. Blake Wardell", "printed_number": "4", "grade_note": null, "photo": "photos/051-2.jpg"}, {"id": 69, "page": 43, "area": "Andersens / Left Main", "boulder": "Font Boulder", "name": "PINCHE AND THE BRAIN", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start with a RH pinch on the arete and a LH crimpy edge to the left of it. Move up to a pinch on the arete and make a big move out left to better holds on face. Top out left of the arete.", "printed_number": "48", "grade_note": null, "photo": "photos/043-2.jpg"}, {"id": 192, "page": 65, "area": "Andersens / Lower Clicke", "boulder": "Sydney Highrise Boulder (inferred)", "name": "PLASTIC NINJA", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start with a LH undercling and RH block side-pull. Slap to a sloper then head up the face to top out.", "printed_number": "11", "grade_note": null, "photo": "photos/050-174.jpg"}, {"id": 314, "page": 89, "area": "Legoland", "boulder": null, "name": "QUAKEN", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Stand start at the large diagonal break. Climb up right on seams to the arete and drop or continue up the slab to a higher top out. Matt Connock", "printed_number": "21", "grade_note": null, "photo": "photos/089-2.jpg"}, {"id": 743, "page": 211, "area": "The Bleachers", "boulder": "Railon Boulder", "name": "RAILON", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on the low diagonal crack in the middle of the northwest face. Straight up, finishing right of the moss. Evan Campbell", "printed_number": "2", "grade_note": null, "photo": "photos/209-1.jpg"}, {"id": 1247, "page": 323, "area": "The Tower", "boulder": "Backside Terraces", "name": "RAILROADED", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "From the low juggy rail climb orange rib/arete to a jug that is 1m left of first hanger on the lonely, desperate bolted route, evidence of Kent's bolting fever. Downclimb on big jugs off to the left. Julian Saunders", "printed_number": "53", "grade_note": null, "photo": "photos/323-2.jpg"}, {"id": 744, "page": 211, "area": "The Bleachers", "boulder": "Railon Boulder", "name": "RAILUP", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start as for Railon but traverse left to finish as for Swarm Up. Evan Campbell", "printed_number": "3", "grade_note": null, "photo": "photos/209-1.jpg"}, {"id": 611, "page": 174, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "RAILWAY MACHINE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A train perhaps? Start as for Slot Machine to the crack then move out under the roof to the higher juggy flake of Cinema Show. Finish up this problem.", "printed_number": "4", "grade_note": null, "photo": "photos/171-3.jpg"}, {"id": 64, "page": 42, "area": "Andersens / Left Main", "boulder": null, "name": "RAIN SHADOW", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Very rarely repeated. Sit start on the crimp at the bottom of seam feature just left of arete. Follow the seam up and left to a committing top out.", "printed_number": null, "grade_note": null, "photo": "photos/042-2.jpg"}, {"id": 327, "page": 91, "area": "Legoland", "boulder": null, "name": "RELUCTANT GARDENER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The right of the two aretes. Sit start matched in the black seam under the rooflet and climb straight up. As thrutchy as its neighbour.", "printed_number": "34", "grade_note": null, "photo": "photos/091-2.jpg"}, {"id": 1212, "page": 317, "area": "Tower Proper", "boulder": "Unnamed quartz-seamed boulder below Mojo", "name": "RIBBED FOR HER PLEASURE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Very good. Sit start on low jug on left side of face, up, then traverse right on quartz ribs, topping out on the right side. Corinne Gwyther", "printed_number": "18", "grade_note": null, "photo": "photos/317-1.jpg"}, {"id": 544, "page": 155, "area": "Trackside", "boulder": "Paul's Boulder", "name": "RIGHT EL WESTWOOD", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The final moves have you checking your spotter. Stand start on the good hold in the crescent seam 1m left of the arete. Move out through the pockets and finish up Left El Westwood. Paul Westwood", "printed_number": "56", "grade_note": null, "photo": "photos/154-3.jpg"}, {"id": 700, "page": 201, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "ROSS' PROBLEM", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Brilliant, imaginative name. Sit start under the roof on low pockets. Head left out of the roof with big moves on a sharp pocket and an edge to a cruxy finale at the lip. Ross Taylor", "printed_number": "18", "grade_note": null, "photo": "photos/201-1.jpg"}, {"id": 111, "page": 51, "area": "Andersens / Right Main", "boulder": null, "name": "S.S. MEMORIAL SLAB", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Delicate, technical and fun. An area classic up the middle of the slab. Stand start and move up to the vague slopey rails (the good holds out right are off limits) and top out.", "printed_number": null, "grade_note": null, "photo": "photos/048-2.jpg"}, {"id": 1106, "page": 286, "area": "Buandik / Got Lost", "boulder": "Little Country", "name": "SEKANI", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Originally graded aspirationally at V9, which like most aspirations was cruelled by reality. Sit start at the base of the seam, which is climbed. Chad Foti", "printed_number": "34", "grade_note": null, "photo": "photos/286-1.jpg"}, {"id": 141, "page": 55, "area": "Andersens / Right Main", "boulder": "Seduction Wall", "name": "SELECTIVE ETHICS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Who doesn't have them? Sit start with side-pull just left of arete. Make a move up, then climb around left, trying to avoid the bothersome tree. Ross Taylor", "printed_number": "26", "grade_note": null, "photo": "photos/055-3.jpg"}, {"id": 351, "page": 96, "area": "Echoes Block", "boulder": null, "name": "SHIVER ME TIMBERS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Stand start in the middle of the wall on a big flake. Climb up carefully on loose looking flakes and underclings to a big reach for the arete.", "printed_number": "16", "grade_note": null, "photo": "photos/096-1.jpg"}, {"id": 806, "page": 220, "area": "The Bleachers", "boulder": "Three Sisters Boulder", "name": "SISTERS OF MERCY", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A surprisingly nice black streak in spite of the dirt and grime. From a sit start just right of the crack, climb slopers to a dynamic move left to sloper then finish through groove. Chook Betts", "printed_number": "65", "grade_note": null, "photo": "photos/220-1.jpg"}, {"id": 657, "page": 186, "area": "Mt Stapylton", "boulder": "Caves Club", "name": "SKIM MILK", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on a right-trending crack. Move up right to the jug line and make a big move to an edge. Finish on jugs.", "printed_number": "1", "grade_note": null, "photo": "photos/186-1.jpg"}, {"id": 821, "page": 222, "area": "The Bleachers", "boulder": "Slapper's Boulder", "name": "SLAPPER'S ARETE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The left arete - slappers absolutely love it, although the right beta avoids slapping. Stand start on opposing side-pulls past a pinch to top out. It also has a sit start that starts down left off a RH side-pull (V7).", "printed_number": "80", "grade_note": null, "photo": "photos/222-2.jpg"}, {"id": 610, "page": 174, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "SLOT MACHINE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on the ring-grip hold in the lower break. Make a big move up to an incut in the crack and finish up Railroad.", "printed_number": "3", "grade_note": null, "photo": "photos/171-3.jpg"}, {"id": 490, "page": 146, "area": "Trackside", "boulder": "Simon Says Boulder", "name": "SOME DAYS YOU SCORE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "More often than you would expect. Sit start at the arete and climb up right to mantle the rooflet.", "printed_number": "2", "grade_note": null, "photo": "photos/146-3.jpg"}, {"id": 1080, "page": 279, "area": "VICTORIA RANGE", "boulder": "SPACE PIRATE SHIP", "name": "SPACE PIRATE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start matched on crimp on face's right side (RH starting hold of the Botanist). Move through gaston and crimp followed by a big move to a large hold on the lip and top out left.", "printed_number": "8", "grade_note": null, "photo": "photos/279-1.jpg"}, {"id": 1225, "page": 319, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "SUBDUCTION", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Grab the slopers at the end of the boulder with purpose then make a difficult and 'udgie' mantle. You know, udge. Phillipa Matthews", "printed_number": "31", "grade_note": null, "photo": "photos/319-1.jpg"}, {"id": 104, "page": 48, "area": "Andersens / Left Main", "boulder": "Birthday Slab", "name": "SWITCHAROONEY", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start in the diagonal break 2m right of Holding Pattern and climb up and right to a very committing finish. Julian Saunders", "printed_number": "82", "grade_note": null, "photo": "photos/047-3.jpg"}, {"id": 148, "page": 56, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "TECHNOLOGY IS AN ENABLER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start on the furthest left point of the cave's lip. Traverse right along the lip to the opposite corner, then mantle.", "printed_number": "33", "grade_note": null, "photo": "photos/057-1.jpg"}, {"id": 1073, "page": 279, "area": "VICTORIA RANGE", "boulder": "MONSTER BOULDER", "name": "TERRORDACTYL", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The protruding nose of rock that hangs out over a 5m drop. The climbing is not hard, but it is committing. Stephen Waring", "printed_number": "1", "grade_note": null, "photo": "photos/279-2.jpg"}, {"id": 504, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "THE ANIMATOR", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start as for Media Construct heading left for 2m and exit up the first line of holds.", "printed_number": "16", "grade_note": null, "photo": "photos/147-1.jpg"}, {"id": 507, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "THE ATAVIST", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "From a stand start in front of the small rock sticking out of ground, dyno from two slopers at head height to the high break. Ross Taylor", "printed_number": null, "grade_note": null, "photo": "photos/148-3.jpg"}, {"id": 686, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "THE CLAW", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start right of Inspector Gadget on the sharp LH pocket and the RH sloper. Follow pocket and slots up the obvious weakness to top out.", "printed_number": "5", "grade_note": null, "photo": "photos/198-1.jpg"}, {"id": 344, "page": 95, "area": "Echoes Block", "boulder": null, "name": "THE FONT MANTLE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Climb out the cave in the big boulder separate to the main Echoes Block. Start at the shelf in the face to an edge and sloper. Make some big moves to holds in the higher seam to top out.", "printed_number": "9", "grade_note": null, "photo": "photos/095-1.jpg"}, {"id": 246, "page": 73, "area": "Andersens / Clicke", "boulder": "Honeycomb Boulder", "name": "THE HIVE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Someone's been watching too much children's TV. Start on the edge of the lowest hole and climb up the line of large Nuecos to top out.", "printed_number": "6", "grade_note": null, "photo": "photos/058-222.jpg"}, {"id": 1112, "page": 287, "area": "Buandik / Got Lost", "boulder": "Cracked boulder (name not printed)", "name": "THE LITTLE ONE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Looks a little contrived. Sit start on low holds on right, left through scoop and up prow avoiding crack.", "printed_number": "40", "grade_note": null, "photo": "photos/287-2.jpg"}, {"id": 188, "page": 64, "area": "Andersens / Lower Clicke", "boulder": "Sydney Highrise Boulder (inferred)", "name": "THE PARISIAN", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start as for French Toast, but head right to gain the big juggy pockets before finishing up Sydney Highrise.", "printed_number": "7", "grade_note": null, "photo": "photos/065-2.jpg"}, {"id": 1172, "page": 301, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "THE PUMMELLING", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Named for the massive pinch that pulled off and KO'd the first ascentionist. Sit down start on slopey rib 1m right of Dos Manos, just before the cave drops away. Follow the obvious rib out to a tricky finish. Ross Taylor", "printed_number": "17", "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 1188, "page": 311, "area": "Love Triangle", "boulder": "The Sun Deck", "name": "THE THROBBER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on orange sickle, climb left on the veiny orange rock, finishing on ledge. Julian Saunders", "printed_number": "16", "grade_note": null, "photo": "photos/311-1.jpg"}, {"id": 300, "page": 87, "area": "Legoland", "boulder": null, "name": "THE TUNNEL", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start on the pockety divot I'm right of Wet With Excitement and climb up the face on good holds in the diagonal breaks to top out. Ross Taylor", "printed_number": "7", "grade_note": null, "photo": "photos/087-1.jpg"}, {"id": 601, "page": 169, "area": "Mt Stapylton", "boulder": "Lower Taipan", "name": "THE UNKNOWN PROBLEM", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Symbolic of all the world's unnamed problems, in the same vein as the Unknown Soldier only way, way, way less iconic. Start matched on a crimpy rail and move right to a gaston and up to top out.", "printed_number": "7", "grade_note": null, "photo": null}, {"id": 891, "page": 236, "area": "Valley of the Giants", "boulder": "Weill Deal Boulder", "name": "THE WEILL DEAL", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Excellent. Just right of the low boulder is a green streak. From a stand start, climb the thin face past a punchy move or two.", "printed_number": "53", "grade_note": null, "photo": "photos/236-1.jpg"}, {"id": 901, "page": 237, "area": "Valley of the Giants", "boulder": "High face to the right of Pinch & A Punch (Barbara Cartland names)", "name": "THE WICKED MAQUIS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "More than de Sade? Climb the face just right of the arete, finishing back left at top.", "printed_number": "63", "grade_note": null, "photo": "photos/237-2.jpg"}, {"id": 892, "page": 236, "area": "Valley of the Giants", "boulder": "Weill Deal Boulder", "name": "THERE'S NO WE IN WEILL", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A slogan to live by. From a stand start with pocket, climb the right arete.", "printed_number": "54", "grade_note": null, "photo": "photos/236-1.jpg"}, {"id": 1136, "page": 293, "area": "Buandik / Got Lost", "boulder": "Got Lost Boulder", "name": "THIS IS THE DUCK DRIVING HIS TRUCK AND GOT STUCK IN THE MUD", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Some kind of German joke? On the other end of the boulder, just right of arete. Sit start on a low slopey rail, left and up. Jochen Perschmann", "printed_number": "64", "grade_note": null, "photo": null}, {"id": 412, "page": 114, "area": "Loopeys", "boulder": null, "name": "THREE SLEEPS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start as for Two Sleeps and climb the right side of the cave to an easier exit out right of the roof.", "printed_number": "10", "grade_note": null, "photo": "photos/114-2.jpg"}, {"id": 166, "page": 59, "area": "Andersens / Right Main", "boulder": "The Wailing Wall", "name": "TIGER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Roar! Sit start on incut flakes and climb the blank face via a few little pockets and seams to finish on the horizontal break.", "printed_number": "51", "grade_note": null, "photo": "photos/059-1.jpg"}, {"id": 617, "page": 175, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "TO CATCH A THIEF", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start on the two big pockets (RH sloper) 3m right of Kamikaze (or sit start awkwardly on the shelf if the mood takes you) and climb the line of pockets leading left and up into finish Must Have Been the Thief.", "printed_number": "10", "grade_note": null, "photo": "photos/175-1.jpg"}, {"id": 586, "page": 166, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "TONKA", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on the same holds as Caterpillar and move out left to an edge and crimp in the crack and make a big move to the break.", "printed_number": "6", "grade_note": null, "photo": "photos/166-1.jpg"}, {"id": 745, "page": 211, "area": "The Bleachers", "boulder": "Heart Boulder", "name": "TOO LEGIT TO QUIT", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Climb the left arete of the west face, just right of the detached block. Stuart Beekmeyer", "printed_number": "4", "grade_note": null, "photo": null}, {"id": 312, "page": 89, "area": "Legoland", "boulder": null, "name": "TOWERING INFERNO", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Exciting. The featured line up the middle of the face via pockets and vertical seams to a very high and committing top out. Julian Saunders", "printed_number": "19", "grade_note": null, "photo": "photos/084-2.jpg"}, {"id": 145, "page": 55, "area": "Andersens / Right Main", "boulder": "Trust Boulder", "name": "TRUST ISSUES", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Start sitting on the edge of the fin shaped boulder at the juggy grey flake. Move up left and crank to slopers on the lip.", "printed_number": "30", "grade_note": null, "photo": "photos/056-1.jpg"}, {"id": 411, "page": 114, "area": "Loopeys", "boulder": null, "name": "TWO SLEEPS", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Fun. Sit start at the back of the cave and climb the central line through the middle of the roof and up the short headwall. Dave Jones", "printed_number": "9", "grade_note": null, "photo": "photos/114-2.jpg"}, {"id": 915, "page": 239, "area": "Valley of the Giants", "boulder": "Large southern face (unnamed boulder)", "name": "TWO-MOVER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "From a jug just right of vertical crack, make one long move to small hold and jug above. Drop off.", "printed_number": null, "grade_note": null, "photo": "photos/238-1.jpg"}, {"id": 683, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "ULTRA DELUXE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "A little punchy. Sit start as for Super Deluxe. Move up and right to double-pocket feature, onto the crimp rail and then make a big move. Top out. Dave Jones", "printed_number": "2", "grade_note": null, "photo": "photos/198-1.jpg"}, {"id": 747, "page": 211, "area": "The Bleachers", "boulder": "Heart Boulder", "name": "UNCLEAR (OCR: ES x IME)", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Right arete of west face. Jump start to jug then finish up the grey face above. Evan Campbell", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1086, "page": 283, "area": "Buandik / Got Lost", "boulder": "Hydra Boulder", "name": "UNDERTAKER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on crimps under roof on left side of block. Up through underclings and then out to the lip, mantle and top out left. Stephen Waring", "printed_number": "14", "grade_note": null, "photo": "photos/282-1.jpg"}, {"id": 226, "page": 69, "area": "Andersens / Lower Clicke", "boulder": "Dali Boulder (inferred)", "name": "UNREAL", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start at the blunt arete. Make a hard first move to a good hold, finish left to top out.", "printed_number": null, "grade_note": null, "photo": "photos/070-2.jpg"}, {"id": 581, "page": 166, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "VOLUME 1000", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The stellar highball on the left side of the cliff. Start on the thin rail at 1.5m. Make big moves through the breaks to a pocket side-pull and a tricky last move. The sit start (V5) detracts some stars. Julian Saunders Volume 1001 (V7) - a classic case of trying to go one better than your mate - climbs from the sit directly (keeping left) into the finish. Simon Weill", "printed_number": "1", "grade_note": null, "photo": "photos/169-3.jpg"}, {"id": 633, "page": 179, "area": "Mt Stapylton", "boulder": "Ammagamma Boulder", "name": "WEIBELEID", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start on the sharp flakes on the wall to the right of Ammagamma. Finish on the break.", "printed_number": "3", "grade_note": null, "photo": "photos/179-2.jpg"}, {"id": 291, "page": 83, "area": "Sandanista", "boulder": "Malapropism Boulder", "name": "WHEN YOU SAY ONE THING...", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "..and Mean A Mother. Stand on the small boulder under the right arete on the lowest of the good holds and climb to the top. Ross Taylor", "printed_number": "4", "grade_note": null, "photo": "photos/082-1.jpg"}, {"id": 1102, "page": 286, "area": "Buandik / Got Lost", "boulder": "Still Here Boulder", "name": "WHERE THERE'S A WILL", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "There's a curry. Sit start on a low crimp about 1.5m right of Nachtnasenwombat, top out via a difficult mantle and a high step. Will Currie", "printed_number": "30", "grade_note": null, "photo": "photos/286-2.jpg"}, {"id": 250, "page": 76, "area": "Andersens / Clicke", "boulder": "Coppertone Boulder (inferred)", "name": "WILL POWER", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Excellent. If you like slabs Stand start and climb the central line up the wall on shallow pockets", "printed_number": "10", "grade_note": null, "photo": "photos/075-1.jpg"}, {"id": 1108, "page": 286, "area": "Buandik / Got Lost", "boulder": "Little Country", "name": "WILLIAM BUSH", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Horatio Hornblower's greatest moment. Sit start at the left end of the break, climb right along the break to finish just before Nathaniel Hornblower.", "printed_number": "36", "grade_note": null, "photo": "photos/286-1.jpg"}, {"id": 1270, "page": 329, "area": "Windowlicker Area", "boulder": "Windowlicker Terraces", "name": "WINDOWLICKER ARETE", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "At the far left end of the Windowlicker Terrace is another classic photogenic Tower arete. From the boulder below arete, make a committing move off good edges to an easier yet satisfying top out. Simon Weill", "printed_number": "14", "grade_note": null, "photo": null}, {"id": 630, "page": 177, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "WIRSCHLLSIADA", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start 1m right of Anal Head on LH jug and RH slope. Climb up and right to finish in the break.", "printed_number": "23", "grade_note": null, "photo": "photos/177-1.jpg"}, {"id": 986, "page": 254, "area": "HALLS GAP", "boulder": "SMALLER BOULDER LEFT OF TSUNAMI", "name": "YOU BEAUT", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "Sit start as for Sockdolager but move to the left end of the flat rail. Pop if you're big / dyno if you're wee to good crimp. Top out delicately.", "printed_number": "36", "grade_note": null, "photo": "photos/254-2.jpg"}, {"id": 1173, "page": 309, "area": "Love Triangle", "boulder": "Love Boulder", "name": "YOU KNOW YOU WANT IT", "grade_raw": "V4", "grade_num": 4, "pictured": 1, "description": "The left arete of the west face from a sit start.", "printed_number": "1", "grade_note": null, "photo": "photos/309-3.jpg"}, {"id": 245, "page": 71, "area": "Andersens / Clicke", "boulder": null, "name": "1-4-6", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Good preparation for 15-9. Start at the slopey rail on the lip of the cave. Campus up right to a pocket and top.", "printed_number": null, "grade_note": null, "photo": "photos/073-1.jpg"}, {"id": 281, "page": 80, "area": "Andersens / Clicke", "boulder": "3 Star Buttress", "name": "808 STATE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "As for Telekinetic, but at the break under the roof traverse right 2m to the big flake in the roof and pull the lip to finish on jugs.", "printed_number": null, "grade_note": null, "photo": "photos/080-3.jpg"}, {"id": 1219, "page": 318, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "9.1", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Great. From the jug at the back of the cave make some tensiony moves out on flat-topped jugs, finishing slightly right. Christoph Gill", "printed_number": null, "grade_note": null, "photo": "photos/318-2.jpg"}, {"id": 660, "page": 187, "area": "Mt Stapylton", "boulder": "Caves Club", "name": "AFFENSCHAUKEL", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start on the big curved-flake feature on the left side of the cave. Move trending left into the finish of Whipped Cream.", "printed_number": "4", "grade_note": null, "photo": "photos/186-1.jpg"}, {"id": 629, "page": 177, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "ANAL HEAD", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Not quite a dick head. Start really low under the roof on the LH rib/pinch and RH gaston. Move awkwardly out to slopers to finish on the jugs in the break.", "printed_number": "22", "grade_note": null, "photo": "photos/177-1.jpg"}, {"id": 557, "page": 156, "area": "Trackside", "boulder": "Angst Boulder", "name": "ANGST", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A little sandy but fun. Sit start at the large round hueco and climb up right onto the rib pinch feature. Continue up the arete on pockets and holds in the seam to top out next to the walking track. Simon Weill", "printed_number": "69", "grade_note": null, "photo": "photos/088-367.jpg"}, {"id": 814, "page": 221, "area": "The Bleachers", "boulder": "Cirque of the Climbables", "name": "ANONYMOUS ARETE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The right arete is a classic that has a sting in the tail. Sit start on the underclings and climb up left past a pocket and into slopey finish.", "printed_number": "73", "grade_note": null, "photo": "photos/221-1.jpg"}, {"id": 225, "page": 69, "area": "Andersens / Lower Clicke", "boulder": "Dali Boulder", "name": "AUTUMN CANNIBALISM", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start with the low incut flake. Climb left and up the scoop.", "printed_number": null, "grade_note": null, "photo": "photos/070-2.jpg"}, {"id": 201, "page": 66, "area": "Andersens / Lower Clicke", "boulder": "Bad Cliche Boulder", "name": "AXE TO GRIND", "grade_raw": "V5", "grade_num
