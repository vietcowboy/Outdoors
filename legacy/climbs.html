": 5, "pictured": 1, "description": "Everyone loves a whinge. Start at good holds on the lip of the roof and make big moves to the horizontal seam and punch to the top.", "printed_number": "20", "grade_note": null, "photo": "photos/066-1.jpg"}, {"id": 1032, "page": 269, "area": "BUANDIK / MADE IT", "boulder": "KOOKABURRA BOULDER", "name": "BACKLASH", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Good. Sit start as for Barbed Art but climb directly up the arête to a high finish.", "printed_number": "34", "grade_note": null, "photo": "photos/269-1.jpg"}, {"id": 313, "page": 89, "area": "Legoland", "boulder": null, "name": "BAD MOON RISING", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Another superb highball. Start as for Towering Inferno and head up and right to follow the high diagonal seams to the arete. Jonathon Woods", "printed_number": "20", "grade_note": null, "photo": "photos/089-2.jpg"}, {"id": 70, "page": 43, "area": "Andersens / Left Main", "boulder": "Font Boulder", "name": "BLEAUSARD", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Classic, but pad out the ankle-breaking boulder below. Sit start and follow the proud overhanging arete to a hard slopey top out. A variant finishing up into Medicare has also been done at a similar grade. Dave Jones", "printed_number": "49", "grade_note": null, "photo": "photos/043-1.jpg"}, {"id": 488, "page": 141, "area": "Mt Stapylton", "boulder": "Epsilon Wall (Upper Tier)", "name": "BOX OFFICE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start on underclings under the roof 4m left of Pussy Power's start. Pop to a pocket around the lip, finish up Pussy Power. Stephen Waring", "printed_number": "13", "grade_note": null, "photo": "photos/141-1.jpg"}, {"id": 1214, "page": 317, "area": "Tower Proper", "boulder": "Mojo Boulder (east face)", "name": "BROMANCE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Starting in the gap between two boulders, climb the cracked face, trending left to high top-out over rocks below. Julian Saunders", "printed_number": "20", "grade_note": null, "photo": null}, {"id": 1253, "page": 325, "area": "The Tower", "boulder": "Cave 15m right of Boxing Mike Bison", "name": "BUNG JULIO", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "More pumpy fun. The middle sit start that climbs out on pockets. Julian Saunders", "printed_number": "59", "grade_note": null, "photo": "photos/325-1.jpg"}, {"id": 922, "page": 239, "area": "Valley of the Giants", "boulder": "Highrise Boulder", "name": "BURJ AL ARAB", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Your classic skyscraping highball. Climb the middle of the face and don't fall off the tap. Simon Weill", "printed_number": "84", "grade_note": null, "photo": "photos/239-1.jpg"}, {"id": 909, "page": 238, "area": "Valley of the Giants", "boulder": "Close Shave Boulder", "name": "BURL-USCONI", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Bunched sit start on small ledge 1m left of Fuck You Fashion Week, up to crimpy edges then finish as Fuck You Fashion Week. Garry Williams", "printed_number": null, "grade_note": null, "photo": null}, {"id": 961, "page": 247, "area": "VENUS BATHS", "boulder": "CERAMICS BOULDER", "name": "CERAMICS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "For the committed (also consider renting a spotter or three). Stand start on large jugs on gorgeous featured face and move up through side-pulls and crimps (avoiding stepping left into the sickle crack) to a terrifying crux high off the ground. Oliver Miller", "printed_number": "11", "grade_note": null, "photo": "photos/249-2.jpg"}, {"id": 421, "page": 115, "area": "Loopeys", "boulder": null, "name": "CIRCUS JERKUS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A classic slopey mantle problem. Sit start around the corner from the main wall (under where the tree has worn into the rock) on jugs. Climb left on big holds and slap the slopey lip before mantling out. Dave Jones. Even better is the low version, which goes left from the big jug before exiting via the mantle.", "printed_number": "19", "grade_note": null, "photo": null}, {"id": 852, "page": 231, "area": "Valley of the Giants", "boulder": "Big Bastard", "name": "CLASSIC LANGERS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Poor Amy. Four metres right of the towering arete is a pinch/fin. Stand start off this, gaston RH. Finish at jug 1m above the left end of the sloping ledge. The highball finish awaits someone bald. Simon Weill", "printed_number": "14", "grade_note": null, "photo": "photos/230-1.jpg"}, {"id": 1119, "page": 289, "area": "Buandik / Got Lost", "boulder": "Unnamed block opposite Alone on the Hill", "name": "CLEAN BREAK", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Directly opposite Alone on the Hill is a small semi-detached and not particularly inspiring piece of rock. Sit start off some small crimps and ascend, avoiding the obvious ramp for feet. The stand is V3. Chad Foti", "printed_number": "47", "grade_note": null, "photo": "photos/289-3.jpg"}, {"id": 772, "page": 214, "area": "The Bleachers", "boulder": "Nicholas Cage Memorial Face", "name": "CON AIR", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Same start as Leaving Las Vegas, but move left to a pocket, then straight up the slopey face above. Simon Weill", "printed_number": "31", "grade_note": null, "photo": null}, {"id": 1266, "page": 327, "area": "Windowlicker Area", "boulder": "Cornish Acid Boulder", "name": "CORNISH ACID", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Good trip. Sit start on jugs just left of arete move left up blunt arete and small slopers to cracks. Pete Reynolds", "printed_number": "10", "grade_note": null, "photo": "photos/327-1.jpg"}, {"id": 134, "page": 54, "area": "Andersens / Right Main", "boulder": "Russian Bull Boulder", "name": "CROATIAN COW", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start on the same low jug as Peaches & Damsons. Move up to the big flake and head right around nose to a sharp little pocket. Finish up the arete and right face. Julian Saunders", "printed_number": "19", "grade_note": null, "photo": "photos/054-2.jpg"}, {"id": 911, "page": 238, "area": "Valley of the Giants", "boulder": "Close Shave Boulder", "name": "CRUSHED", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sharp but quite good. Stand start on head-height jug, up and move right past a sharp edge and a tricky move at the top. Ross Taylor", "printed_number": "73", "grade_note": null, "photo": "photos/238-2.jpg"}, {"id": 164, "page": 59, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "DAB", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The lowest of the lowballs. Sit start with a LH incut crimp and RH side-pull. Pull on and try to keep from hitting the boulder behind you. Slap RH to another side-pull and up to the peak.", "printed_number": null, "grade_note": null, "photo": "photos/059-2.jpg"}, {"id": 563, "page": 159, "area": "Trackside", "boulder": "Darjeeling Express Boulders", "name": "DARJEELING EXPRESS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "This prow has been recently discovered and named, but it was probably first climbed by Dave Jones but never recorded. From a sit start climb the proud arete via some bear-hugging on slopers. Riccardo Toto Monetta", "printed_number": "75", "grade_note": null, "photo": "photos/159-2.jpg"}, {"id": 830, "page": 223, "area": "The Bleachers", "boulder": "Frankston Boulders", "name": "DERAILED", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "'Da plane!' Located in a small cave. Sit start on the rail then make a move to a sloper before busting for the lip. Simon Weill", "printed_number": "89", "grade_note": null, "photo": "photos/223-1.jpg"}, {"id": 339, "page": 95, "area": "Echoes Block", "boulder": null, "name": "DIRTY DANCING", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Climb Dra Di to the lip and then mantle over the pocket on the slab.", "printed_number": null, "grade_note": null, "photo": "photos/095-2.jpg"}, {"id": 51, "page": 40, "area": "Andersens / Left Main", "boulder": "B4 BOULDER (inferred)", "name": "DOS CUCHACHAS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start with RH in a crack side-pull and LH slopey edge. Surmount lip and top out via a pocket.", "printed_number": "29", "grade_note": null, "photo": "photos/040-2.jpg"}, {"id": 1228, "page": 319, "area": "Tower Proper", "boulder": "Dr Spock Outcrop", "name": "DR SPOCK", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Deceptively tricky. Climb the middle of the bulgy grey face past a slopey side-pull and a small edge to a high finish. Barti Wuersch", "printed_number": null, "grade_note": null, "photo": "photos/319-2.jpg"}, {"id": 1298, "page": 332, "area": "Windowlicker Area", "boulder": "Sun Arete Boulder", "name": "DRIVING MISS RAVEN", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The left leaning arete has a committing finish above a less-than-ideal landing. Sit start off the blocks and climb left. Simon Weill", "printed_number": "42", "grade_note": null, "photo": "photos/332-1.jpg"}, {"id": 1063, "page": 277, "area": "BUANDIK / MADE IT", "boulder": "THE PISSOIR", "name": "EAU DE TOILETTE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Looks quite nice. Sit start on the low flake inside the cave and climb back out right.", "printed_number": "65", "grade_note": null, "photo": "photos/277-2.jpg"}, {"id": 478, "page": 138, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "ENCORE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start on a curving crack 3m right of the Show Must Go. Climb left on pockets, finishing as for the Show Must Go On. Michael Tonon", "printed_number": "3", "grade_note": null, "photo": null}, {"id": 101, "page": 48, "area": "Andersens / Left Main", "boulder": "Cave behind Tickity Boo (inferred)", "name": "EPINEPHRINE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start as for Testostrogen and move out left under the overhang and up to top out. Julian Saunders", "printed_number": "79", "grade_note": null, "photo": "photos/047-1.jpg"}, {"id": 483, "page": 139, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "EPSILON CRACK", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Crag classic. Sit start on a jug and use the crack to do a funky move up to an edge. Continue up the face to the finishing jug.", "printed_number": "8", "grade_note": null, "photo": "photos/139-1.jpg"}, {"id": 516, "page": 148, "area": "Trackside", "boulder": "Bolt Boulder", "name": "FAULTY BOLTY", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Acclaimed guidebook author, Dave Pearson's, nomination for the worst boulder in the guide. Sit start on pockets on the right edge of the wall and climb the short and uninspiring line to top out. Included for historical value...", "printed_number": "28", "grade_note": null, "photo": "photos/148-1.jpg"}, {"id": 800, "page": 219, "area": "The Bleachers", "boulder": "Feltching Season Boulder", "name": "FELTCHING SEASON", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Is this the Weill's favourite time of the year? Looks unlikely for the grade (and, obviously, could be spoogey). Sit start off LH undercling and RH side-pull then go up the blunt arete. Simon Weill", "printed_number": "59", "grade_note": null, "photo": "photos/118-507.jpg"}, {"id": 295, "page": 85, "area": "Legoland", "boulder": null, "name": "FEMINIST THEORY", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start at the flat ledge 1m right of Wife Beater and mantle/jump to finish on the higher pocket. Julian Saunders", "printed_number": "2", "grade_note": null, "photo": "photos/085-1.jpg"}, {"id": 274, "page": 80, "area": "Andersens / Clicke", "boulder": "3 Star Buttress", "name": "FRICTION POINT", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start in the crack at the back of the roof. Reach out to a flake and up to slopers on the face and high top out.", "printed_number": "34", "grade_note": null, "photo": "photos/080-1.jpg"}, {"id": 1092, "page": 283, "area": "Buandik / Got Lost", "boulder": "Hydra Boulder", "name": "FUCK THE PURITY", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Young people these days. Sit start on undercling and crimp 2m right of Chance Impression. Move up to large block feature, head left via crimp on face and top out wherever. Fuck the purity! Stephen Waring", "printed_number": null, "grade_note": null, "photo": "photos/283-2.jpg"}, {"id": 939, "page": 241, "area": "VALLEY OF THE GIANTS", "boulder": "ABYSS BOULDER", "name": "GIANT STEPS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "From a stand start, climb the black arête on the right side of the eastern face. Pete Reynolds", "printed_number": "101", "grade_note": null, "photo": "photos/241-1.jpg"}, {"id": 1160, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "HANDS UP", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start 3m right of Hands Down at the obvious rib, traverse left to finish in hueco as for Hands Down. Simon Weill", "printed_number": "5", "grade_note": null, "photo": "photos/301-2.jpg"}, {"id": 356, "page": 97, "area": "Echoes Block", "boulder": null, "name": "HOLLOW POINT", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start as for Ricochet to the first crimpy rail and traverse 3m right on it to top out on better holds.", "printed_number": "21", "grade_note": null, "photo": "photos/097-2.jpg"}, {"id": 39, "page": 39, "area": "Andersens / Left Main", "boulder": "GAS BOULDER", "name": "HORMONE EXPRESS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A pretty face on immaculate rock. Sit start on flat edges. Make a big first move and head straight up to top out. Julian Saunders", "printed_number": "17", "grade_note": null, "photo": "photos/039-1.jpg"}, {"id": 998, "page": 256, "area": "HALLS GAP", "boulder": "HUMPING AN ORCA", "name": "HUMPING AN ORCA", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Balance up the slab. Ollie Tobias Bugg", "printed_number": "48", "grade_note": null, "photo": "photos/132-592.jpg"}, {"id": 1280, "page": 329, "area": "Windowlicker Area", "boulder": "Gully proper (chasm)", "name": "I WAS ONLY 19", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start on the pinches 1m left of the naturally scrawled '19'. Make a big gaston move right, finishing as for Stockholm Syndrome or right into Oriental Shit Scared. Simon Weill", "printed_number": null, "grade_note": null, "photo": "photos/330-1.jpg"}, {"id": 218, "page": 68, "area": "Andersens / Lower Clicke", "boulder": "Skittle Boulder", "name": "IN STITCHES", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start on the block and seam under the small rooflet. Move up to a gaston and make a big move to the scoop.", "printed_number": null, "grade_note": null, "photo": "photos/068-3.jpg"}, {"id": 1223, "page": 318, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "INDIAN PLATE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start just right of block propping up the end of the boulder. From undercling and edge, pop to a good edge, then climb right to top out. Simon Weill", "printed_number": "29", "grade_note": null, "photo": "photos/319-1.jpg"}, {"id": 1244, "page": 322, "area": "The Tower", "boulder": "Backside Terraces", "name": "KEEFIE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A gaping maw for a finish. Sit start in the slopey cave on the left then top out via the slot:", "printed_number": "50", "grade_note": null, "photo": "photos/323-2.jpg"}, {"id": 778, "page": 216, "area": "The Bleachers", "boulder": "Buttress left of There Will Be Blood face", "name": "KOREAN JESUS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Committing arete climbing with an exciting finish. Fridge-hug the double arete to a rail then add courage or prayers to finish. Simon Weill", "printed_number": "37", "grade_note": null, "photo": "photos/216-3.jpg"}, {"id": 572, "page": 162, "area": "Mt Stapylton", "boulder": null, "name": "LAMB CHOP", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Nick would regularly climb this as a sit start to Not too Bad (28) for training. Sit start on the low holds of the shield feature (it looks like a lamb chop) 8m right of Miss Muppet and finish up on the large incut jugs. Nick Sutter", "printed_number": "6", "grade_note": null, "photo": "photos/162-2.jpg"}, {"id": 498, "page": 146, "area": "Trackside", "boulder": "Amazing Boulder", "name": "LESSONS IN SOCIALISM", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start right of the arete on incuts in the flake. Top out with a good side-pull that leads to a slopey mantle.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 833, "page": 223, "area": "The Bleachers", "boulder": "Frankston Boulders (downhill roof boulder)", "name": "LIKE STEALING CANDY FROM A BABY", "grade_raw": "V5", "grade_num": 5, "pictured": 0, "description": "Stand start off opposing slopers at the front of low cave. Up. The sit'll be well 'ard. Simon Weill", "printed_number": "92", "grade_note": null, "photo": "photos/122-540.jpg"}, {"id": 43, "page": 39, "area": "Andersens / Left Main", "boulder": "GAS BOULDER", "name": "LIQUID SKIN", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Interesting face climbing. Sit start left of right end of the face. Make a move or two left, then up, finishing slightly left on good edges. Julian Saunders", "printed_number": "21", "grade_note": null, "photo": "photos/039-1.jpg"}, {"id": 853, "page": 231, "area": "Valley of the Giants", "boulder": "Big Bastard", "name": "LITTLE BASTARD", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start on undercling on the blunt arete. Climb left to finish as for Classic Langers. Simon Weill", "printed_number": "15", "grade_note": null, "photo": "photos/230-1.jpg"}, {"id": 1084, "page": 282, "area": "Buandik / Got Lost", "boulder": "Sasquatch Boulder", "name": "LORD SASS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Could be a tautology. Start as for Sassy Pants. Make a big move out right to a pocket then top out. Michael Tonon", "printed_number": "12", "grade_note": null, "photo": "photos/282-2.jpg"}, {"id": 930, "page": 240, "area": "Valley of the Giants", "boulder": "Giant Slab Boulder", "name": "LOST NEGATIVE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "From the horizontal break at head height, make a move or two up on slopers to easier top out in the corner. Ross Taylor", "printed_number": "92", "grade_note": null, "photo": "photos/235-1.jpg"}, {"id": 324, "page": 91, "area": "Legoland", "boulder": null, "name": "MAPLE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Nice. Sit start as for St David. Move right to more side-pulls and make a hard move into the high undercling pocket, finish as for St David.", "printed_number": "31", "grade_note": null, "photo": "photos/091-1.jpg"}, {"id": 125, "page": 53, "area": "Andersens / Right Main", "boulder": "Snowflake Boulder (inferred)", "name": "MASTER BATES", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Classic Saunders' name. Sit start just right of the crack. Climb to the arrow-shaped hold and up via hard moves on the arete. Julian Saunders", "printed_number": "10", "grade_note": null, "photo": "photos/052-3.jpg"}, {"id": 574, "page": 162, "area": "Mt Stapylton", "boulder": null, "name": "MENSTRUAL DIRECT START", "grade_raw": "V5", "grade_num": 5, "pictured": 0, "description": "Originally this was a highball bouldering problem that has since been retroed. It's still a great highball. Stand start on horizontal seams 5m right of Not Too Bad and climb up on beautiful pockets until you have to make a slap/dyno for the horizontal break. Drop off from the break.", "printed_number": "8", "grade_note": null, "photo": null}, {"id": 1103, "page": 286, "area": "Buandik / Got Lost", "boulder": "Still Here Boulder", "name": "NACHTNASENWOMBAT", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "From a sit start climb the nice grey face.", "printed_number": "31", "grade_note": null, "photo": "photos/286-2.jpg"}, {"id": 517, "page": 148, "area": "Trackside", "boulder": "Anti-Inflammatory Boulder", "name": "NAPROSYN", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Hard for the grade. Sit start on a good edge with some not-so-good feet. Make a shouldery gaston move up and out to the hanging lip then top out on jugs.", "printed_number": "29", "grade_note": null, "photo": "photos/149-1.jpg"}, {"id": 643, "page": 181, "area": "Mt Stapylton", "boulder": null, "name": "NICE MAX", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start on the incut rail at the base of the blunt arete. Reach to a pocket and follow the arete on edges and shallow pockets to finish in the juggy break. Gordon Poultney", "printed_number": "13", "grade_note": null, "photo": "photos/102-425.jpg"}, {"id": 710, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "NIMBUS 2000", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start with a side-pull and pocket and move up left to sharp crimps and top out left of the block on top.", "printed_number": "29", "grade_note": null, "photo": "photos/202-2.jpg"}, {"id": 695, "page": 199, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "NO SEX AFTER MUSHROOMS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sadly. Do the first move or two of the Happy Camper Traverse, then move right to the slot and sloper before making a big move to the lip and top out.", "printed_number": null, "grade_note": null, "photo": "photos/199-2.jpg"}, {"id": 573, "page": 162, "area": "Mt Stapylton", "boulder": null, "name": "NOT TOO BAD", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start right of Lamb Chop on edges in the low seam. Climb to the double-barrel pockets and punch straight up to the ledge next to the bolt.", "printed_number": "7", "grade_note": null, "photo": "photos/162-2.jpg"}, {"id": 713, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "OBELISK", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start at the back of the cave and head out through the roof and left to finish up.", "printed_number": "32", "grade_note": null, "photo": "photos/202-1.jpg"}, {"id": 697, "page": 199, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "OUT OF BOUNDS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "For loose cannons? Sit start as for No Sex After Mushrooms and climb up to the seam and traverse right to finish up Boundary.", "printed_number": "16", "grade_note": null, "photo": "photos/199-2.jpg"}, {"id": 75, "page": 44, "area": "Andersens / Left Main", "boulder": "Font Boulder (inferred)", "name": "OUT OF THE BLEAU", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Beautiful slopers. Sit start on a slopey edge. Make a hard move left to another slopey edge finishing straight up. Dave Jones", "printed_number": "53", "grade_note": null, "photo": "photos/043-1.jpg"}, {"id": 415, "page": 115, "area": "Loopeys", "boulder": null, "name": "PASSION", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Tricky. The left most line on the main face. Sit start on good slanting holds and climb the right trending diagonal weakness to mantle over the huge lip. Gordon Poultney", "printed_number": "13", "grade_note": null, "photo": "photos/115-1.jpg"}, {"id": 1257, "page": 326, "area": "Windowlicker Area", "boulder": "Crown Boulder", "name": "PEOPLE OF A LESSER POD", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Fun. Sit start just right of obvious pod feature. Up to next smaller pod on left then high finish through corner and roof. Simon Weill", "printed_number": null, "grade_note": null, "photo": "photos/327-2.jpg"}, {"id": 154, "page": 57, "area": "Andersens / Right Main", "boulder": "Mandatory Choices Boulder", "name": "PETER PARKER", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Do you have the skills of Spiderman? From the adjacent slab, jump across the gap and try and stick to the wall. It's not all over once you stick the jump either, a delicate slab remains. Julian Saunders did the FA, but Chris Jones spotted the line before Saunders cruelly cut his lunch", "printed_number": "39", "grade_note": null, "photo": "photos/058-2.jpg"}, {"id": 1302, "page": 81, "area": "Andersens / Clicke", "boulder": null, "name": "PLATINUM FLOW", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Stand start at the shallow rail. Climb the face on a thin incut pocket to juggy features and a high finish on the ledge. Walk off right.", "printed_number": "45", "grade_note": "printed as V5/6", "photo": "photos/065-258.jpg"}, {"id": 310, "page": 89, "area": "Legoland", "boulder": null, "name": "POCKET ROCKET", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Mark's first FA. Start 3m right of the arete on LH incut side-pull and RH pocketed feature. Make a big move to the obvious ledge under the roof and traverse left to finish on the arete. Mark Spoelstra", "printed_number": "17", "grade_note": null, "photo": "photos/070-275.jpg"}, {"id": 1242, "page": 322, "area": "The Tower", "boulder": "Proud Highway Boulder", "name": "PROUD HIGHWAY", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Could be the best five in the Grampians and a standout arete in an area thick with standout aretes. From a stand start, climb the arete to a high conclusion. Simon Weill", "printed_number": "48", "grade_note": null, "photo": "photos/012-002.jpg"}, {"id": 269, "page": 79, "area": "Andersens / Clicke", "boulder": "Bridesmaid Wall", "name": "PUMP ACTION", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start in the big, juggy, double-barrel pockets 2m right of the Seam Grip exit. Make a big throw to jugs and top out. Julian Saunders", "printed_number": null, "grade_note": null, "photo": "photos/079-1.jpg"}, {"id": 350, "page": 96, "area": "Echoes Block", "boulder": null, "name": "RAGGED EDGE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Stand start on the block leaning against the main boulder matched on the incut arete flake. Climb committingly up to mantle over the poor landing.", "printed_number": "15", "grade_note": null, "photo": "photos/096-1.jpg"}, {"id": 171, "page": 60, "area": "Andersens / Right Main", "boulder": "The Wailing Wall", "name": "RAIN", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Stand start matched on a small left facing flake. Slap up right to a good hold and top out.", "printed_number": "56", "grade_note": null, "photo": "photos/060-1.jpg"}, {"id": 355, "page": 97, "area": "Echoes Block", "boulder": null, "name": "RICOCHET", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Stand start 2m right of the arete on a shallow pocket and climb the slab on thin holds.", "printed_number": "20", "grade_note": null, "photo": "photos/097-2.jpg"}, {"id": 1131, "page": 293, "area": "Buandik / Got Lost", "boulder": "Gully behind Mini Rigs (unnamed)", "name": "RIGHT LIGHT", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Look at anything in the right light and... Climb the grey arete and face from small edges. Nalle Hukkataival", "printed_number": "59", "grade_note": null, "photo": "photos/292-1.jpg"}, {"id": 650, "page": 184, "area": "Mt Stapylton", "boulder": "Penguin Area", "name": "RIGHT PENGUIN", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A bit tight. Starting on the jug, climb directly up then shimmy right to finish on the face right of the chockstone.", "printed_number": "20", "grade_note": null, "photo": "photos/184-1.jpg"}, {"id": 1252, "page": 325, "area": "The Tower", "boulder": "Cave 15m right of Boxing Mike Bison", "name": "ROLL WITH THE PUNCHES", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Pumpy with a final punch. First of three problems sharing the same tricky finish. Sit start on low jugs at bottom left side of cave, climb out to jug over lip. Julian Saunders", "printed_number": "58", "grade_note": null, "photo": "photos/325-1.jpg"}, {"id": 556, "page": 156, "area": "Trackside", "boulder": "Upper Boulder", "name": "ROUNDHOUSE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start at the right of the wall next to the adjoining boulder and climb straight up.", "printed_number": "68", "grade_note": null, "photo": "photos/156-1.jpg"}, {"id": 1202, "page": 313, "area": "Tower Proper", "boulder": "Unnamed boulder right of gully (heading not printed)", "name": "SANGUINE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The pretty grey shield of rock just right of the gully is climbed from a stand. Finish left to arete.", "printed_number": "8", "grade_note": null, "photo": "photos/313-1.jpg"}, {"id": 1278, "page": 329, "area": "Windowlicker Area", "boulder": "Windowlicker Terraces", "name": "SAUNDERS SANCTION", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Immaculate orange sandstone that smells a little of urine. Sit start 5m right of wide crack in cliff, then traverse left with increasing difficulty to exit via a tricky gaston move. Ross Taylor", "printed_number": "22", "grade_note": null, "photo": "photos/329-2.jpg"}, {"id": 1115, "page": 288, "area": "Buandik / Got Lost", "boulder": "Alone on the Hill Boulder", "name": "SEE THE SUN GOING DOWN", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "From a crouched position on the left side of the cave, traverse all the way right along the break.", "printed_number": "43", "grade_note": null, "photo": "photos/288-2.jpg"}, {"id": 858, "page": 231, "area": "Valley of the Giants", "boulder": "Taken Boulder", "name": "SHAKEY TAYLOR", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Named after a legendary guidebook author. Crouch start on good holds just right of where the two boulders meet. Climb up to slopey top-out, moving slightly left at top. Simon Weill", "printed_number": null, "grade_note": null, "photo": null}, {"id": 503, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "SICK NUTTER", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "It doesn't get much better than this. Sit start on the big pocket and head straight up the blunt arete using the LH edge and high RH sloper. Top out up the seam. Nick Sutter", "printed_number": "15", "grade_note": null, "photo": "photos/147-1.jpg"}, {"id": 363, "page": 102, "area": "Hollow Mountain Cave", "boulder": null, "name": "SILVERCHAIR", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Many people's project. Sit start on the big flat hold to the right of the window and finish on the big slopey rail. A myriad of possible ways to get there exist, none of them are easy.", "printed_number": "4", "grade_note": null, "photo": "photos/102-1.jpg"}, {"id": 127, "page": 53, "area": "Andersens / Right Main", "boulder": "Snowflake Boulder", "name": "SNOWFLAKE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Stand start and climb the pocketed slab to the juggy break. Climb the headwall via a big flake to the gripping finale. Julian Saunders", "printed_number": "12", "grade_note": null, "photo": "photos/052-1.jpg"}, {"id": 985, "page": 254, "area": "HALLS GAP", "boulder": "SMALLER BOULDER LEFT OF TSUNAMI", "name": "SOCKDOLAGER", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start on very low side-pull then pull up onto large flat rail and make a tricky move up past a dimple and slopey side-pulls.", "printed_number": "35", "grade_note": null, "photo": "photos/254-2.jpg"}, {"id": 427, "page": 119, "area": "Sunset Arete Boulder", "boulder": null, "name": "SUNSET ARETE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A nice recent find. Stand start on the big jug on the inside of the chasm. Move left and up to arete and final move crux. James O'Neil", "printed_number": "25", "grade_note": null, "photo": "photos/119-1.jpg"}, {"id": 321, "page": 90, "area": "Legoland", "boulder": null, "name": "SWEDISH MEATBALLS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start matched on crimps in the flake and reach right to a jug and dyno straight up to the lip and mantle onto the slab.", "printed_number": "28", "grade_note": null, "photo": "photos/090-1.jpg"}, {"id": 114, "page": 52, "area": "Andersens / Right Main", "boulder": "Gasoline Prow (inferred)", "name": "TAINTED", "grade_raw": "V5", "grade_num": 5, "pictured": 0, "description": "Located between two boulders. Sit start on the low undercling and climb the orange seams.", "printed_number": "1", "grade_note": null, "photo": null}, {"id": 562, "page": 157, "area": "Trackside", "boulder": null, "name": "TALONS", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A hidden gem. Sit start next to a boulder on the slab with two good edges. Move up to the flakeline and then through to the higher flake with a committing final pull to the jugs near the top.", "printed_number": "74", "grade_note": null, "photo": "photos/157-2.jpg"}, {"id": 810, "page": 220, "area": "The Bleachers", "boulder": "Tier of boulders below Three Sisters (unnamed)", "name": "TAX EVASION", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Contrived but fun. From an off-balance sit start, climb the left leaning arete through the cave to a tricky exit. Grade only holds if you don't use the boulder behind or fingerlocks. Chook Betts", "printed_number": "69", "grade_note": null, "photo": "photos/221-2.jpg"}, {"id": 953, "page": 244, "area": "VENUS BATHS", "boulder": "THE BEANSTALK BOULDER", "name": "THE BEANSTALK", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "In the fairy-tale a fall from the top of the beanstalk kills the giant - don't be the giant. The all too obvious seam up the west face, Oliver Miller", "printed_number": "3", "grade_note": null, "photo": null}, {"id": 605, "page": 171, "area": "Mt Stapylton", "boulder": "Wildsides", "name": "THE BEGINNINGS OF A GREAT ADVENTURE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The name gives a hint of the excitement of Team Austria/Germany. Start on underclings and climb up on thin flakes around the left side of the shield feature to finish on big holds at the ledge.", "printed_number": "3", "grade_note": null, "photo": null}, {"id": 143, "page": 55, "area": "Andersens / Right Main", "boulder": "Seduction Wall", "name": "THE BLACK LINE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Not too bad if you are tall, probably terrifying if you are short. Start up the Seduction Line but then make some long moves right above the boulder choke to finish as for the Crucible. Ross Taylor", "printed_number": "28", "grade_note": null, "photo": "photos/056-2.jpg"}, {"id": 687, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "THE DYNO", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "[ELIMINATE] Yep, another eliminate. Start on the slopey crimps and dyno to the large slot.", "printed_number": "5", "grade_note": null, "photo": "photos/198-1.jpg"}, {"id": 1279, "page": 329, "area": "Windowlicker Area", "boulder": "Gully proper (chasm)", "name": "THE EXPLOSION", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The first problem in the gully proper is named for its exploding starting jug. From the shattered jug in the left side of the chasm climb up on thin-lipped edges to juggy ledge where you can step off. Simon Weill", "printed_number": "23", "grade_note": null, "photo": "photos/330-1.jpg"}, {"id": 847, "page": 230, "area": "Valley of the Giants", "boulder": "Wall of Arses Boulder", "name": "THE GOBBLER", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start 1.5m right of face's right end on a low crack. Up slopers, tending right. Byron Glover", "printed_number": null, "grade_note": null, "photo": "photos/230-3.jpg"}, {"id": 1246, "page": 323, "area": "The Tower", "boulder": "Backside Terraces", "name": "THE REMEDY", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Not sure if the cure is better than the malady in this duo. Start as for the Poison but move right on good holds, continuing up the bulgy face to a hard final move off a gaston. Simon Weill", "printed_number": "52", "grade_note": null, "photo": "photos/323-2.jpg"}, {"id": 570, "page": 160, "area": "Spurt & Afterglow Walls", "boulder": "Spurt Wall", "name": "THE SPURT TRAVERSE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A classic warm up for Taipan aspirants. Start 5m right of the tunnel on the slopey rail and traverse the permachalked line of pockets and breaks about 35m right to cruxy moves just past the tree. Finish on a jug under the bolt of Academia.", "printed_number": "4", "grade_note": null, "photo": "photos/162-3.jpg"}, {"id": 1284, "page": 330, "area": "Windowlicker Area", "boulder": "Smack My Patch Up Boulder", "name": "THE THREAT", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The best line on the bloc. Climb the obvious right-leaning prow from a sit start. You can finish left or right. Pete Reynolds", "printed_number": "28", "grade_note": null, "photo": "photos/330-2.jpg"}, {"id": 500, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "THE V5 SIT", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start 2m right of the V2 sit on slopers and a poor undercling. Make a big move to better holds in the break then go up.", "printed_number": "12", "grade_note": null, "photo": null}, {"id": 897, "page": 237, "area": "Valley of the Giants", "boulder": "Pinch & A Punch Boulder", "name": "THE WORLD IS A NAPKIN", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "And the universe is napkins all the way down. Sit start from the slopey jug and move right and up the surprisingly tricky face. Ross Taylor", "printed_number": "59", "grade_note": null, "photo": "photos/237-1.jpg"}, {"id": 58, "page": 41, "area": "Andersens / Left Main", "boulder": "Tim Tam Boulder (inferred)", "name": "THRUTCH ARETE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start with a sloping edge just under the lip of the blunt arete. Make a tricky mantle.", "printed_number": "36", "grade_note": null, "photo": "photos/029-052.jpg"}, {"id": 1070, "page": 278, "area": "VICTORIA RANGE", "boulder": "CRIDULAR BOULDER", "name": "TROUBLEMAKER", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Sit start on inside of the left end of the cave, finishing as for Simplicity. Axel Perschmann", "printed_number": "72", "grade_note": null, "photo": "photos/278-2.jpg"}, {"id": 955, "page": 244, "area": "VENUS BATHS", "boulder": "THE BEANSTALK BOULDER", "name": "TWEEDLE DEE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Start just left of Tweedle Dum, head left and up to the high rails and top out. Oliver Miller", "printed_number": "5", "grade_note": null, "photo": "photos/247-2.jpg"}, {"id": 956, "page": 244, "area": "VENUS BATHS", "boulder": "THE BEANSTALK BOULDER", "name": "TWEEDLE DUM", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "From a stand start just left of the tree in the middle of the face, climb the vertical seams on side-pulls. Oliver Miller", "printed_number": "6", "grade_note": null, "photo": "photos/247-2.jpg"}, {"id": 967, "page": 250, "area": "VENUS BATHS", "boulder": null, "name": "VENUS IN FUR", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Just another high-quality, high-and-mighty, terrifying highball. Three metres above the main track is a high purple jug. From this climb the slab and seam above. Oliver Miller", "printed_number": "17", "grade_note": null, "photo": "photos/250-4.jpg"}, {"id": 518, "page": 148, "area": "Trackside", "boulder": "Anti-Inflammatory Boulder", "name": "VOLTAREN", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The arete 2m right of Naprosyn. Start on a small blocky sloper and two-finger pocket and top out through the funky features.", "printed_number": "30", "grade_note": null, "photo": "photos/149-1.jpg"}, {"id": 1237, "page": 321, "area": "The Tower", "boulder": "Tower Proper", "name": "WASABI", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "From atop the terrace climb the right side of the overhanging face. Julian Saunders", "printed_number": null, "grade_note": null, "photo": "photos/320-2.jpg"}, {"id": 1239, "page": 322, "area": "The Tower", "boulder": "Web Boulder", "name": "WEB OF DECEIT", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "To the left of the tree is a small face. From a sit start climb up on small crimps.", "printed_number": "45", "grade_note": null, "photo": "photos/322-1.jpg"}, {"id": 882, "page": 233, "area": "Valley of the Giants", "boulder": "Mini Giant Boulders", "name": "WEILLY ANNOYING", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Surprisingly tricky. Climb the slabby face 2m left of right arete, tending left at top. Simon Weill", "printed_number": "44", "grade_note": null, "photo": null}, {"id": 74, "page": 44, "area": "Andersens / Left Main", "boulder": "Font Boulder (inferred)", "name": "WHITE DESTINY", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "Good. Start as for Green Destiny, but climb right to finish as for Out of the Bleau. Dave Jones", "printed_number": "52", "grade_note": null, "photo": "photos/043-1.jpg"}, {"id": 393, "page": 108, "area": "Hollow Mountain Cave", "boulder": null, "name": "WIMMEL FRIEDHOFF", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "A contender for the best V5 in the country. Stand start on good holds under the hanging bulge (underneath the bottom of the groove/ramp). Climb the roof right on good opposing holds and heel hooks to tricky moves at the slopers to reach the higher holds. Top it out on pockets and dishes.", "printed_number": "34", "grade_note": null, "photo": "photos/107-1.jpg"}, {"id": 1023, "page": 268, "area": "BUANDIK / MADE IT", "boulder": "DEAF LEOPARD BOULDER", "name": "YANNICK'S ARETE", "grade_raw": "V5", "grade_num": 5, "pictured": 1, "description": "The black and grey featured wall facing the track. From a stand start on good edge climb blunt grey arête. Yannick Godfrin", "printed_number": "25", "grade_note": null, "photo": null}, {"id": 551, "page": 156, "area": "Trackside", "boulder": "100 Pint Wall", "name": "2 CAN SAM", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Start up on the shelf a few metres left of the arete with a good blocky hold. Move up to the incut flake and finish on the jugs.", "printed_number": null, "grade_note": null, "photo": "photos/156-3.jpg"}, {"id": 1105, "page": 286, "area": "Buandik / Got Lost", "boulder": "Little Country", "name": "A LITTLE COUNTRY, A LITTLE ROCK 'N' ROLL", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Very nice. Start on jug right of crack. Up and left past crimp, popping for a good hold on the lip. Chad Foti", "printed_number": "33", "grade_note": null, "photo": null}, {"id": 208, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "AS THE CROWFLIES", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "A fun dyno. Start on the flakes as for Ass Backwards, move up to the slopers and jump for the worn white jug on the face.", "printed_number": "27", "grade_note": null, "photo": "photos/067-1.jpg"}, {"id": 714, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "ASTERIX", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "You may need some magic potion. Sit start as for Connected and climb right through the roof to a hard mantle with a pocket over the low lip at the side of the cave and top out.", "printed_number": "33", "grade_note": null, "photo": "photos/202-1.jpg"}, {"id": 591, "page": 167, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "ATTACK OF THE KILLER DROP BEARS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "The terrifying drop bears make another appearance. Sit start low on two good holds and make a long dynamic move to a good hold in the hueco and then another big throw to the lip. Klem Loskot", "printed_number": null, "grade_note": null, "photo": "photos/167-2.jpg"}, {"id": 921, "page": 239, "area": "Valley of the Giants", "boulder": "Prow Boulder (Valley)", "name": "AUSTRIAN WOMEN", "grade_raw": "V6", "grade_num": 6, "pictured": 0, "description": "Apparently great. On the uphill side of the boulder, sit start in the corner then trend slightly right and up past distinctive orange crimp. Oliver Miller", "printed_number": "83", "grade_note": null, "photo": null}, {"id": 621, "page": 176, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "BETWEEN THE SHEEPS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "The end requires a good spotter and some commitment. Start on the obvious tooth jug undercling and flake horn. Move up to a large pocket and make a very committing move to edges then finish on the higher flake.", "printed_number": "14", "grade_note": null, "photo": "photos/176-1.jpg"}, {"id": 1085, "page": 283, "area": "Buandik / Got Lost", "boulder": "Sasquatch Boulder", "name": "BIG FOOT", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Start matched in right hand scoop on the flat wall 5m right of Sassy Pants. Climb left to gain the large undercling feature and head straight up. Stephen Waring", "printed_number": "13", "grade_note": null, "photo": "photos/282-2.jpg"}, {"id": 92, "page": 46, "area": "Andersens / Left Main", "boulder": "Zoolander Wall", "name": "BLUE STEEL", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "The crux requires commitment. Sit start on the rail. Climb up on small crimps and pockets to finish matched on the big flat rail. Down climb the corner. This is serious ankle breaking territory so pad out the landing. Simon Weill", "printed_number": "70", "grade_note": null, "photo": "photos/046-1.jpg"}, {"id": 577, "page": 163, "area": "Mt Stapylton", "boulder": "Spurt & Afterglow Walls", "name": "BOSSANOVA ROOF", "grade_raw": "V6", "grade_num": 6, "pictured": 0, "description": "Sit start as for Bossanova Left and climb the initial crack line straight out the nose of the boulder via some pockets to mantle over the end.", "printed_number": "11", "grade_note": null, "photo": null}, {"id": 508, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "BREAKFAST OF CHAMPIONS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Technical. Sit start at the crescent dihedral and traverse right on slopers to finish up Paranoiac Critical Town.", "printed_number": "20", "grade_note": null, "photo": "photos/148-3.jpg"}, {"id": 1043, "page": 271, "area": "VICTORIA RANGE", "boulder": "BLACK SABBATH WALL", "name": "CAPP IN THE ASS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Not super inspiring. About 10m left of Losing Grip. From low jugs on right make a big move left (avoiding using rail for feet), continue left on positive but sharp holds. Brian Capps", "printed_number": "45", "grade_note": null, "photo": "photos/271-1.jpg"}, {"id": 496, "page": 146, "area": "Trackside", "boulder": "Simon Says Boulder", "name": "COMPACTION", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Much easier if you are tall. Sit start 4m right of Wiggly Boy between the tree and the boulder on some shallow pockets in the vague seam. Move up on edges.", "printed_number": "8", "grade_note": null, "photo": "photos/146-2.jpg"}, {"id": 711, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "CONNECTION", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start with a side-pull and pocket. Move up to small slopey edges then jump for the lip.", "printed_number": null, "grade_note": null, "photo": "photos/202-2.jpg"}, {"id": 83, "page": 45, "area": "Andersens / Left Main", "boulder": "Shotgun Boulder (inferred)", "name": "DEATH & DECAY", "grade_raw": "V6", "grade_num": 6, "pictured": 0, "description": "Located in the hole right of the start of 3 Rounds. Start low in the seam and thrutch to glory.", "printed_number": "61", "grade_note": null, "photo": null}, {"id": 340, "page": 95, "area": "Echoes Block", "boulder": null, "name": "DIRTY DANCING DIRECT", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Climbs Dirty Dancing but mantles to the right of it on with a tricky big press.", "printed_number": null, "grade_note": null, "photo": "photos/095-2.jpg"}, {"id": 239, "page": 70, "area": "Andersens / Lower Clicke", "boulder": "Discovery Boulder", "name": "DISCOVERY", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Tricky. Sit start on vertical seams just left of Grand Discovery. Climb up the black streak on pockets.", "printed_number": "58", "grade_note": null, "photo": "photos/070-1.jpg"}, {"id": 1066, "page": 277, "area": "BUANDIK / MADE IT", "boulder": "RATIONAL BEING BOULDER (uncertain)", "name": "DON'T DAI", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Who says Sepos don't do sarcasm? A reference to Dai Koyamada's propensity for adding low sit starts to sit starts. Just right of the south arête is a low (no, a bit lower) side-pull. From the side-pull make one or two hard moves up to top. Beau Kahler", "printed_number": "68", "grade_note": null, "photo": "photos/277-1.jpg"}, {"id": 733, "page": 207, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "DROWNING DICAPRIO", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "There are worse crimes. Sit start at the base of the broken flakeline and continue traversing right with big moves between good holds. Gordon Poultney", "printed_number": "13", "grade_note": null, "photo": "photos/206-3.jpg"}, {"id": 65, "page": 42, "area": "Andersens / Left Main", "boulder": null, "name": "EMERALD ARETE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Not the greatest landing. but this should still be more popular than it is. Stand start on a good rounded edge on the arete and climb up the arete to top out. Chris Jones", "printed_number": "45", "grade_note": null, "photo": "photos/030-061.jpg"}, {"id": 353, "page": 97, "area": "Echoes Block", "boulder": null, "name": "EMORY BOARD", "grade_raw": "V6", "grade_num": 6, "pictured": 0, "description": "Stand start around 1m left of the arete around the corner from Baited Breath on edges in the dihedral. Make some long moves to gain the lip and top out.", "printed_number": "18", "grade_note": null, "photo": null}, {"id": 120, "page": 52, "area": "Andersens / Right Main", "boulder": "Lillyput Wall (inferred)", "name": "ESTERIA", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Mostly for masochists. From under the roof climb the desperately slick crack leftwards to finish up over the slabs. Julian Saunders", "printed_number": "92", "grade_note": null, "photo": "photos/048-1.jpg"}, {"id": 795, "page": 218, "area": "The Bleachers", "boulder": "The Walker Boulder", "name": "EVAC", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Nearly as good as the Walker. Soft if you're tall. Dispiritingly desperate if you're not. Climb the Walker but exit right after the jump to the lip. Simon Weill", "printed_number": "54", "grade_note": null, "photo": "photos/219-1.jpg"}, {"id": 345, "page": 96, "area": "Echoes Block", "boulder": null, "name": "FALLEN COW", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "A long traverse on the big leaning wall right of the Font Mantle Boulder. Start matched on good holds in the right side of the long horizontal seam. Climb right along the lip of the block to better holds up the arete and traverse right on the nose to finish on a jug.", "printed_number": "10", "grade_note": null, "photo": "photos/096-2.jpg"}, {"id": 628, "page": 177, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "FAMILY LOSS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start straddling the concerningly-positioned tree stump on a pocket and edge. Climb up on edges, crimps and a small pocket to finish on the jug.", "printed_number": "21", "grade_note": null, "photo": "photos/177-1.jpg"}, {"id": 715, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "FAT COW", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Requires a good spotter. Stand start matched on the obvious ledge at 1.5m. Use the pockets to climb up and left around the phallus. Matt 'Master of the Mid Grade' Adams", "printed_number": "34", "grade_note": null, "photo": "photos/203-1.jpg"}, {"id": 305, "page": 88, "area": "Legoland", "boulder": null, "name": "FATIGUE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Start with the slopey rail 1m left of the arete and move right to the small incut edge on arete and climb up left of tree with long spans on crimps to top out via the sloper.", "printed_number": "12", "grade_note": null, "photo": "photos/088-2.jpg"}, {"id": 40, "page": 39, "area": "Andersens / Left Main", "boulder": "GAS BOULDER", "name": "FEELING OBLIVION", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start with a good RH side-pull and LH crimp. Pull to a slopey jug and fine face to high finish.", "printed_number": "18", "grade_note": null, "photo": "photos/039-1.jpg"}, {"id": 106, "page": 51, "area": "Andersens / Right Main", "boulder": null, "name": "FEVERISH", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "A head trip. From a side-pull flake and shallow pocket move left to a crimpy break and irreversible move to the horizontal pocket. Good holds lead back left to the arete (watch the loose block) and the top. Chris Jones", "printed_number": "84", "grade_note": null, "photo": "photos/048-2.jpg"}, {"id": 658, "page": 187, "area": "Mt Stapylton", "boulder": "Caves Club", "name": "FULL CREAM", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Better than low fat. Sit start on hand-sized letterbox slot. Go up to incut dishes, make a big move to a pocket and finish on jugs.", "printed_number": "2", "grade_note": null, "photo": "photos/186-1.jpg"}, {"id": 42, "page": 39, "area": "Andersens / Left Main", "boulder": "GAS BOULDER", "name": "GAS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "You have to hit the gas on the crux. Sit start on small crimps and make a hard first move to a jug then climb the tricky face via a long move to a shallow fingerlock. Julian Saunders", "printed_number": null, "grade_note": null, "photo": "photos/039-1.jpg"}, {"id": 255, "page": 77, "area": "Andersens / Clicke", "boulder": "Shandy Boulder", "name": "GILLETTE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Well named and not the most appealing line, unless you're a masochist. Sit start on the thin crimpy rail and slice and dice your way up on the sharpest razor crimps in the Grampians.", "printed_number": "18", "grade_note": null, "photo": "photos/076-2.jpg"}, {"id": 436, "page": 122, "area": "Hollow Mountain", "boulder": "Project Wall", "name": "GINSHU", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Unremarkable. Start matched on the jug holds in the right side of the horizontal seam with feet on the main block. Follow the orange streak straight up the face on crimps that are both small and sharp.", "printed_number": null, "grade_note": null, "photo": "photos/123-1.jpg"}, {"id": 773, "page": 214, "area": "The Bleachers", "boulder": "Nicholas Cage Memorial Face", "name": "GONE IN 60 SECONDS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Same start as Ghost Rider, but go straight up the slopey wall, veering right to top. Chook Betts", "printed_number": "32", "grade_note": null, "photo": null}, {"id": 1161, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "HAND OUT", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Exciting at the lip. Start as per Hands Up but keep following the attractive rib to a scary culmination. Simon Weill", "printed_number": "6", "grade_note": null, "photo": "photos/301-2.jpg"}, {"id": 1159, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "HANDS DOWN", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "The best? The worst? It's a pity this and the next one don't top out. Sit down 1m right of Man Down on obvious jug. Blast straight out, trending right past poor slopers to finish in hueco. Simon Weill", "printed_number": "4", "grade_note": null, "photo": "photos/301-2.jpg"}, {"id": 93, "page": 47, "area": "Andersens / Left Main", "boulder": "Zoolander Wall (inferred)", "name": "HANSEL", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Like Blue Steel, make sure you pad the end carefully. From the LH end of the shelf down and right of the start of Magnum, climb back left into Blue Steel, but at the first pocket step left to an even smaller pocket and a delicate step up to the finishing break. Julian Saunders", "printed_number": "71", "grade_note": null, "photo": "photos/046-1.jpg"}, {"id": 1028, "page": 269, "area": "BUANDIK / MADE IT", "boulder": "KOOKABURRA BOULDER", "name": "HANSON'S DISEASE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Please explain? Known as Kookaburra for a while. Sit start on a low jug on the right side of overhanging face. Up on jugs then back left on diagonals to high top out.", "printed_number": "30", "grade_note": null, "photo": "photos/269-1.jpg"}, {"id": 233, "page": 70, "area": "Andersens / Lower Clicke", "boulder": "The Scab (inferred)", "name": "HOT MAMA VIBES", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Prescient given Phil's recent ascencion (descent) to fatherhood? Climb the right side of the prow, moving right onto the face at the top. Phil Neville", "printed_number": "52", "grade_note": null, "photo": "photos/071-2.jpg"}, {"id": 1210, "page": 317, "area": "Tower Proper", "boulder": "Mojo Boulder", "name": "JEDI NINJA", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Below the large face is a diagonal arete under an arcing crack. Traverse diagonally left to high finish. Julian Saunders", "printed_number": "16", "grade_note": null, "photo": "photos/317-2.jpg"}, {"id": 615, "page": 175, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "KAMIKAZE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Exciting. On an early repeat Julian Saunders kicked his spotter, Dave Jones, in the chest dynoing on the final 'kamikaze' move. Dave rocked on his heels for a second or two, arms flapping in the breeze, until another spotter pulled him back from the embrace of the death slab. Sit start on juggy pockets over the shelf.", "printed_number": "8", "grade_note": null, "photo": "photos/175-1.jpg"}, {"id": 416, "page": 115, "area": "Loopeys", "boulder": null, "name": "KLAPUSTERPERLE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Fun extension. Start at Passion and traverse right low on edges to finish up Fashion.", "printed_number": "14", "grade_note": null, "photo": "photos/115-1.jpg"}, {"id": 972, "page": 250, "area": "VENUS BATHS", "boulder": "BATH SHARK", "name": "LAYER CAKE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Stand start just right of tree, finishing via a desperate mantel. Oliver Miller", "printed_number": "22", "grade_note": null, "photo": "photos/251-2.jpg"}, {"id": 652, "page": 184, "area": "Mt Stapylton", "boulder": "Penguin Area", "name": "LEFT PENGUIN", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Starting on the jug, climb up and left on slopers, to a tight exit through the left side of the cave.", "printed_number": "22", "grade_note": null, "photo": "photos/184-1.jpg"}, {"id": 1190, "page": 311, "area": "Love Triangle", "boulder": "The Sun Deck", "name": "LEG SPREAD ARETE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "From a sit start, climb the prominent arete/rib to high jug. Drop off. Julian Saunders", "printed_number": "18", "grade_note": null, "photo": "photos/311-1.jpg"}, {"id": 486, "page": 141, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "LET IT B", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Climb Downunder and continue up the right side of the face to a high (and possibly loose) top out.", "printed_number": null, "grade_note": null, "photo": "photos/139-2.jpg"}, {"id": 761, "page": 213, "area": "The Bleachers", "boulder": "Blackbeard's Boulder", "name": "LEXIT", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Left-most problem on the main face. Start as for Musk Up, but go left along the break and exit through the gap. Simon Weill", "printed_number": "20", "grade_note": null, "photo": "photos/213-2.jpg"}, {"id": 816, "page": 221, "area": "The Bleachers", "boulder": "Cirque of the Climbables", "name": "MAGIC DADDY", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "The sloper exit spits off most. Start matched on the low jug, up the underclings then punch left and finish via slopey top out. Scott Clarke", "printed_number": "75", "grade_note": null, "photo": "photos/221-1.jpg"}, {"id": 931, "page": 240, "area": "Valley of the Giants", "boulder": "Giant Slab Boulder", "name": "MANOSPHERE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Make a series of tricky moves on slopey edges, to hard top out. Ross Taylor", "printed_number": "93", "grade_note": null, "photo": null}, {"id": 50, "page": 40, "area": "Andersens / Left Main", "boulder": "B4 BOULDER (inferred)", "name": "MARY MOHITO", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start with blobby edges. Head out the roof and move right to a tricky mantle with a pocket.", "printed_number": "28", "grade_note": null, "photo": "photos/040-2.jpg"}, {"id": 505, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "MEDIA CONSTRUCT", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start on the large pocket (of Sick Nutter) and traverse left on slopers and edges for 7m to finish up Paranoiac Critical Town.", "printed_number": "17", "grade_note": null, "photo": "photos/147-1.jpg"}, {"id": 571, "page": 160, "area": "Spurt & Afterglow Walls", "boulder": "Spurt Wall", "name": "MISS MUPPET", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Start 5m right of the end of the Spurt Traverse with low pockets. Move up left to shallow edges in the break and finish on the high pockets.", "printed_number": "5", "grade_note": null, "photo": "photos/162-1.jpg"}, {"id": 651, "page": 184, "area": "Mt Stapylton", "boulder": "Penguin Area", "name": "PENGUIN", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Fun. From the jug climb directly up on slopers and the big rib, exiting up through the window left of the chockstone.", "printed_number": null, "grade_note": null, "photo": "photos/184-1.jpg"}, {"id": 227, "page": 69, "area": "Andersens / Lower Clicke", "boulder": "Dali Boulder (inferred)", "name": "PHANTOM CART", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Discrediting reality. Sit start at the blunt arete with a small LH pocket and RH edge. Climb up the arete on edges.", "printed_number": "46", "grade_note": null, "photo": "photos/070-2.jpg"}, {"id": 978, "page": 251, "area": "VENUS BATHS", "boulder": "BAKELITE CONCEPT", "name": "PLASTIC FACTS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "The best kind. From Bakelite's starting holds climb the diagonal rightwards. Oliver Miller", "printed_number": "28", "grade_note": null, "photo": "photos/251-1.jpg"}, {"id": 1303, "page": 81, "area": "Andersens / Clicke", "boulder": null, "name": "PLATINUM FLOW", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Stand start at the shallow rail. Climb the face on a thin incut pocket to juggy features and a high finish on the ledge. Walk off right.", "printed_number": "45", "grade_note": "printed as V5/6", "photo": "photos/065-258.jpg"}, {"id": 704, "page": 201, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "PLUS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Start as for Minus but climb to the right of that problem on slopers out the roof to a big move to the lip and then up the face on pockets.", "printed_number": "23", "grade_note": null, "photo": "photos/201-3.jpg"}, {"id": 435, "page": 122, "area": "Hollow Mountain", "boulder": "Project Wall", "name": "PROJECT WALL DYNO", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Climb the line of good holds up the black streak. The crux final moves can be done statically by gaining the horizontal crack below the top jug, but that's only for spoil sports and scaredy cats. For the true dyno jump straight to the top of the cliff from the lower holds.", "printed_number": null, "grade_note": null, "photo": "photos/123-1.jpg"}, {"id": 26, "page": 37, "area": "Andersens / Left Main", "boulder": "LEFT MAIN (unlabelled boulder)", "name": "PUPPET MASTER", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Climb Transcience to the ledge and traverse right across the long break. Dave Jones", "printed_number": "4", "grade_note": null, "photo": "photos/037-2.jpg"}, {"id": 1276, "page": 329, "area": "Windowlicker Area", "boulder": "Windowlicker Terraces", "name": "READ LESS, LEARN LESS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "You can tell Pete is a teacher. Same start as Read More, Learn More but traverse all the way right on break to easy top-out. Pete Reynolds", "printed_number": "20", "grade_note": null, "photo": null}, {"id": 620, "page": 176, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "REMAINS OF THE SHEEP", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "A long and pumpy classic. Start as for Chas Remains to the good pocket. Span out right into good gastons and a pocket and keep pocket pulling all the way to the final hold of Between the Sheeps.", "printed_number": "13", "grade_note": null, "photo": "photos/175-1.jpg"}, {"id": 1217, "page": 317, "area": "Tower Proper", "boulder": "Rib Tickler Wall", "name": "RIB TICKLER", "grade_raw": "V6", "grade_num": 6, "pictured": 0, "description": "Just right of a tree branch leaning against the cliff is a line of holds up a black face. From good holds climb past thin edges to high conclusion. Simon Weill", "printed_number": "23", "grade_note": null, "photo": null}, {"id": 77, "page": 44, "area": "Andersens / Left Main", "boulder": "Shotgun Boulder", "name": "RIDING SHOTGUN", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "An area classic that's more technical than it first looks. Sit start on good holds in the low seam and climb up the line of slopers and underclings. Corinne Gwyther", "printed_number": "55", "grade_note": null, "photo": "photos/045-3.jpg"}, {"id": 268, "page": 79, "area": "Andersens / Clicke", "boulder": "Bridesmaid Wall", "name": "RIDUNCULOUS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Classic Saunders name. Start at the good jugs near the leftmost of the big pockets. Cross up to a deep pocket and jump for the lip. Careful of the landing. Julian Saunders", "printed_number": null, "grade_note": null, "photo": "photos/079-1.jpg"}, {"id": 266, "page": 79, "area": "Andersens / Clicke", "boulder": "Bridesmaid Wall", "name": "RUNNING MAN", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "The beginning of Julian's obsession with traversing, a period which he now tries to deny. Start with LH edge and RH slopey pinch. Traverse 3m right on the horizontal weakness and then bust straight up the face on a crimp and chickenheads that lead to an easy mantle. Julian Saunders", "printed_number": "26", "grade_note": null, "photo": "photos/079-1.jpg"}, {"id": 135, "page": 54, "area": "Andersens / Right Main", "boulder": "Russian Bull Boulder", "name": "RUSSIAN BULL", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "A well-worn classic. Try not to barn-door off the crux. Climb Croatian Cow and traverse right along the lip past the nose to mantle onto the slab. Mungo", "printed_number": "20", "grade_note": null, "photo": "photos/054-2.jpg"}, {"id": 1195, "page": 312, "area": "Tower Proper", "boulder": "The Parapet", "name": "SAUNDERS' FACE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Ugly, although the boulder is quite pretty. In the middle of the buttress is a grey face, left of a prominent tiger streak. Climb it from a sit start to little ledge at 4m. Drop off. Julian Saunders", "printed_number": "1", "grade_note": null, "photo": "photos/312-2.jpg"}, {"id": 424, "page": 117, "area": "Loopeys", "boulder": "Overlooked Wall", "name": "SCARY MONSTERS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start and climb the line of big (and possibly fragile) holds up the sharp arete to exit left into the bottomless bowl feature. Keep chugging up to finish on the ledge high above. During the first ascent the spotter was halfway through dialling the ambulance before the problem was topped out. Axel Perschmann", "printed_number": "22", "grade_note": null, "photo": "photos/117-2.jpg"}, {"id": 654, "page": 185, "area": "Mt Stapylton", "boulder": "Scary Monster Boulder", "name": "SCARY MONSTERS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "A great overhanging, featured face that was long ignored by visitors to the Citadel. Sit start in the middle of the narrow face at a good pocket. Climb up on holds in the central orange streak, followed by edges on the face to a juggy top out.", "printed_number": "24", "grade_note": null, "photo": "photos/185-1.jpg"}, {"id": 204, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "SCORPION", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start on the right side of the scoop. Make a big move up to a crimp and big edge, then top.", "printed_number": "23", "grade_note": null, "photo": "photos/066-1.jpg"}, {"id": 531, "page": 151, "area": "Trackside", "boulder": "Love Boulder", "name": "SEXY DIRECT", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sounds better. Sit start under the arete on the low seam. Tricky moves on a gaston pinch and crimps lead into Sexy as a Turd.", "printed_number": "43", "grade_note": null, "photo": "photos/150-1.jpg"}, {"id": 493, "page": 146, "area": "Trackside", "boulder": "Wiggly Boulder", "name": "SHATTERING DREAMS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Hard. Sit start on the triangular pocket and gaston. Make a long, hard press to the slopey break and top out.", "printed_number": "5", "grade_note": null, "photo": "photos/146-1.jpg"}, {"id": 656, "page": 185, "area": "Mt Stapylton", "boulder": "Silica Superhighway Boulder", "name": "SILICA SUPERHIGHWAY", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sandy. Start underneath the boulder on the right of the two cracklines. Climb up the crack all the way to the top.", "printed_number": "26", "grade_note": null, "photo": "photos/104-438.jpg"}, {"id": 689, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "SILLY PUTTY", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start with the pocket and pinch. Make a big move out right to the large incut rail and then continue out right on the higher flake to a big move at the lip. Dave Jones", "printed_number": "9", "grade_note": null, "photo": "photos/199-1.jpg"}, {"id": 690, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "SILLY PUTTY DIRECT", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "As for Silly Putty but from the scoop head straight up. Dave Jones", "printed_number": "9", "grade_note": null, "photo": "photos/199-1.jpg"}, {"id": 437, "page": 128, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "SLAYING DRAGONS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Good but scary. Climbs the high arete above a tiered landing. Start around left of the arete, then climb right across the shield to a high finish. Simon Weill", "printed_number": "1", "grade_note": null, "photo": "photos/128-3.jpg"}, {"id": 1254, "page": 325, "area": "The Tower", "boulder": "Cave 15m right of Boxing Mike Bison", "name": "SMOKED MUSCLES", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start on arete on right side of cave and traverse back left. You could start even further back in the cave if you are really bloody minded. Julian Saunders", "printed_number": "60", "grade_note": null, "photo": "photos/325-1.jpg"}, {"id": 438, "page": 128, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "SPICY FINGERS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start on edges in the break and climb straight up the wall to sharp holds and finish on jugs at the lip. Al Robertson", "printed_number": "2", "grade_note": null, "photo": "photos/128-3.jpg"}, {"id": 1090, "page": 283, "area": "Buandik / Got Lost", "boulder": "Hydra Boulder", "name": "STONE GAZE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Start as for Medusa but follow the roof right using holds in the horizontal break. Top out through large heads. Stephen Waring", "printed_number": "18", "grade_note": null, "photo": "photos/282-1.jpg"}, {"id": 995, "page": 256, "area": "HALLS GAP", "boulder": "STOPLIGHT ARETE", "name": "STOPLIGHT ARETE LHV", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Start as for Stoplight Arête but bust out left via underclings then up the face.", "printed_number": "45", "grade_note": null, "photo": "photos/256-3.jpg"}, {"id": 442, "page": 129, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "STRAWBERRIES & CREAM", "grade_raw": "V6", "grade_num": 6, "pictured": 0, "description": "Classic Weill mega-pumper. Stand start just around to the left of Innocence on two small crimps, make a hard move up and you're done. Simon Weill", "printed_number": "6", "grade_note": null, "photo": null}, {"id": 189, "page": 64, "area": "Andersens / Lower Clicke", "boulder": "Sydney Highrise Boulder (inferred)", "name": "SURRENDER MONKEY", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Everyone loves to the take the piss out of the French. Sit start as for Sydney Highrise. Climb left to jug pockets and left again to smaller pockets to finish up French Toast Direct.", "printed_number": "8", "grade_note": null, "photo": "photos/065-2.jpg"}, {"id": 864, "page": 232, "area": "Valley of the Giants", "boulder": "Taken Boulder", "name": "TAKE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Rope climbers note, squealing 'take' when you must whack your heel level with your head won't help. Avoids the Taken's crux by climbing the final fine arete of that problem from a jump start.", "printed_number": "26", "grade_note": null, "photo": null}, {"id": 1046, "page": 274, "area": "VICTORIA RANGE", "boulder": "THE EYRIE", "name": "THE ADVENTURE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Nice. Start off large underclings at the back of the cave. Up to big jug, right then straight up on more amazing wind-carved holds to high finish on right. There is also a variant that finishes left into Northern Fire. Axel Perschmann", "printed_number": "48", "grade_note": null, "photo": "photos/274-1.jpg"}, {"id": 1201, "page": 313, "area": "Tower Proper", "boulder": "Unnamed boulder right of gully (heading not printed)", "name": "THE BIG CHAMPERS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sketchy landing, high finish. Climb the concave grey face above the hole. Julian Saunders", "printed_number": "7", "grade_note": null, "photo": "photos/313-1.jpg"}, {"id": 514, "page": 148, "area": "Trackside", "boulder": "Bolt Boulder", "name": "THE BOLT OF OLD REGRET", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start with a LH pocket and RH side-pull and head straight up to a tricky mantle.", "printed_number": "26", "grade_note": null, "photo": "photos/148-1.jpg"}, {"id": 903, "page": 237, "area": "Valley of the Giants", "boulder": "High face to the right of Pinch & A Punch (Barbara Cartland names)", "name": "THE CROSS OF LOVE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Looks good. Sit start on the left end of the fallen block. Follow orange streak up and slightly left to horizontal break. Finish out left. Simon Weill", "printed_number": "65", "grade_note": null, "photo": "photos/237-2.jpg"}, {"id": 144, "page": 55, "area": "Andersens / Right Main", "boulder": "Seduction Wall", "name": "THE CRUCIBLE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "On the right end of the wall. Start on holds in the higher seam and climb left to good holds, finishing with a gripping last move back right to top out.", "printed_number": "29", "grade_note": null, "photo": "photos/056-2.jpg"}, {"id": 451, "page": 130, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "THE KINDERGARTEN SCOOP", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Scary, committing and fairly height-dependent. Step into the scoop to the right of Fairy Head and punch straight to the rounded lip.", "printed_number": "15", "grade_note": null, "photo": "photos/129-1.jpg"}, {"id": 289, "page": 83, "area": "Sandanista", "boulder": "Sandanista Wall", "name": "THE PICKUP LINE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Classic tourist pleaser. Stand start a few metres right of the arete on the good side-pull undercling. Go straight to the top on flakes.", "printed_number": "2", "grade_note": null, "photo": "photos/083-1.jpg"}, {"id": 172, "page": 60
