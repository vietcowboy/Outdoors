ictured": 1, "description": "Sit start on the right side of the low break and climb up the line of jugs.", "printed_number": "25", "grade_note": null, "photo": "photos/067-1.jpg"}, {"id": 1120, "page": 289, "area": "Buandik / Got Lost", "boulder": "Bespoke Cave", "name": "BESPOKE", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Climbs the right side of the cave before dropping off. Dave Kellerman", "printed_number": "48", "grade_note": null, "photo": "photos/289-1.jpg"}, {"id": 1218, "page": 318, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "BOXING DAY", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "At the western end of the boulder is a tree, sit start just right of it on a deep pocket. Climb up the juggy face.", "printed_number": "24", "grade_note": null, "photo": "photos/318-2.jpg"}, {"id": 1293, "page": 332, "area": "Windowlicker Area", "boulder": "Northern wall of chasm (Sun Arete massif)", "name": "BROWN ROOM", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "Sit start between two boulders in the gully and climb groove above. Ross Taylor", "printed_number": "37", "grade_note": null, "photo": null}, {"id": 982, "page": 254, "area": "HALLS GAP", "boulder": "TSUNAMI BOULDER", "name": "CAT'S MEOW", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Tricky start but it eases as you ascend. From a sit start on the finger jug, climb up the juggy wall.", "printed_number": "32", "grade_note": null, "photo": "photos/254-2.jpg"}, {"id": 492, "page": 146, "area": "Trackside", "boulder": "Simon Says Boulder", "name": "CHECK YOUR TRAPS", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Poxy - tick, contrived - tick. Sit start on the slot 2m right of the arete. Move to the break and out right to slopers for a few moves and mantle.", "printed_number": "4", "grade_note": null, "photo": "photos/146-4.jpg"}, {"id": 193, "page": 65, "area": "Andersens / Lower Clicke", "boulder": "Clyde Boulder", "name": "CLYDE", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Looking for a Bonnie. Stand start on the left side of the face with the lowest part of the right-leaning diagonal flakeline. Ride it all the way to a high top out.", "printed_number": "12", "grade_note": null, "photo": "photos/066-2.jpg"}, {"id": 946, "page": 242, "area": "FALLS GAP", "boulder": "CONVINCED BOULDER", "name": "DEAD CERTAIN", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "A fool's mindset. Sit start 3m right of the arête on the bucket jug then climb up the bulging face above.", "printed_number": "108", "grade_note": null, "photo": null}, {"id": 1026, "page": 269, "area": "BUANDIK / MADE IT", "boulder": "DEAF LEOPARD BOULDER", "name": "DRAGON WHISPER", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "Nalle V1 - looks hard for the grade. Two metres right of Deaf Leopard is a white jug, from this climb slightly left and up. Nalle Hukkataival", "printed_number": "28", "grade_note": null, "photo": null}, {"id": 790, "page": 217, "area": "The Bleachers", "boulder": "Easy Peasy Boulder", "name": "EASY AS", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "Climb the arete from a stand start. Step off right onto the adjacent boulder when you hit the big jug.", "printed_number": "49", "grade_note": null, "photo": null}, {"id": 167, "page": 59, "area": "Andersens / Right Main", "boulder": "The Wailing Wall", "name": "EUGENE", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "An old lover of Giles? Sit start at the bottom of the rising flake near the arete. Top out up over the end of the flake. Giles Helbig", "printed_number": "52", "grade_note": null, "photo": "photos/060-2.jpg"}, {"id": 221, "page": 69, "area": "Andersens / Lower Clicke", "boulder": "Skittle Boulder (inferred)", "name": "EXPECTATIONS", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Step into the scoop and climb the seams.", "printed_number": "40", "grade_note": null, "photo": "photos/068-2.jpg"}, {"id": 205, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "FAIR DINKUM", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "..cobber. Sit start on the left side of the low juggy break. Make a big move to the slopey pocket and top out up big holds.", "printed_number": "24", "grade_note": null, "photo": "photos/067-1.jpg"}, {"id": 161, "page": 58, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "FORCED ENTRY DIRECT", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Dai Koyamada's addition to Andersens. Sit start matched on the left facing flake. Move up the wall and jump like mad to the lip.", "printed_number": null, "grade_note": null, "photo": "photos/059-2.jpg"}, {"id": 908, "page": 238, "area": "Valley of the Giants", "boulder": "Close Shave Boulder", "name": "FUCK YOU FASHION WEEK", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Start on the wide-ledge scar that marks the spot where the boulder almost brained one of the authors and traverse left through the break to exit via the jug layback. Giulia Savorgnan", "printed_number": "70", "grade_note": null, "photo": null}, {"id": 564, "page": 159, "area": "Trackside", "boulder": "Darjeeling Express Boulders", "name": "GALAXY VIVISECTION", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "A great warm up. Just opposite Darjeeling Express is a rising traverse that surmounts a low, prow-shaped boulder. Climb this from a sit start on a good pocket on the left. Riccardo Toto Monetta", "printed_number": "76", "grade_note": null, "photo": null}, {"id": 185, "page": 62, "area": "Andersens / Right Main (inferred)", "boulder": "Golden Beauty", "name": "GOLDEN BEAUTY", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "A worthwhile outing. Stand start and climb the majestic grey and orange face.", "printed_number": "66", "grade_note": null, "photo": null}, {"id": 823, "page": 222, "area": "The Bleachers", "boulder": "Slapper's Boulder", "name": "HIGH & MIGHTY", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit or stand start, up blunt arete to tricky finish.", "printed_number": null, "grade_note": null, "photo": "photos/222-2.jpg"}, {"id": 781, "page": 216, "area": "The Bleachers", "boulder": "Indy's Drop Off", "name": "INDY'S DROP OFF", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Climb the big wall to the first break and drop off. Pushing through to the direct finish awaits.", "printed_number": "40", "grade_note": null, "photo": "photos/216-2.jpg"}, {"id": 45, "page": 40, "area": "Andersens / Left Main", "boulder": "CONSULTANT BOULDER", "name": "IS DON IS GOOD", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start with a side-pull, up easy face.", "printed_number": null, "grade_note": null, "photo": "photos/039-2.jpg"}, {"id": 413, "page": 114, "area": "Loopeys", "boulder": null, "name": "JAMES", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Start matching on the block to the left of the In Your Jesus Christ Pose cave and climb up using the rib like feature. Gordon Poultney", "printed_number": null, "grade_note": null, "photo": "photos/115-1.jpg"}, {"id": 580, "page": 163, "area": "Mt Stapylton", "boulder": "Spurt & Afterglow Walls", "name": "JERKIN", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "This problem is located on the right hand overhanging side of the same boulder as Amber Lite. Sit start with a deep pocket and slopey LH hold. Make a big move to the jug on the lip and then mantle.", "printed_number": "14", "grade_note": null, "photo": null}, {"id": 136, "page": 54, "area": "Andersens / Right Main", "boulder": "Button Boulder", "name": "JOEY", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start with two good holds in the low horizontal crack. Climb straight up to the top via more horizontal cracks.", "printed_number": "21", "grade_note": null, "photo": "photos/054-1.jpg"}, {"id": 1077, "page": 279, "area": "VICTORIA RANGE", "boulder": "SPACE PIRATE SHIP", "name": "JOHN CARTER", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start on left side of the small overhang, head up and right to finish on good pockets.", "printed_number": "5", "grade_note": null, "photo": "photos/279-3.jpg"}, {"id": 585, "page": 166, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "JOHN DEERE", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Tricky for the grade. Start on the right side of the horizontal seam on an angled jug. Climb up using a slopey pocket to finish on the break.", "printed_number": "5", "grade_note": null, "photo": "photos/166-1.jpg"}, {"id": 118, "page": 52, "area": "Andersens / Right Main", "boulder": "Lillyput Wall", "name": "LILLYPUT", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start on good flake and climb seam above.", "printed_number": "5", "grade_note": null, "photo": "photos/051-1.jpg"}, {"id": 236, "page": 70, "area": "Andersens / Lower Clicke", "boulder": "The Scab (inferred)", "name": "LOW GLOW", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "Sit start with jugs at the base of the vertical seam. Climb straight up on good holds.", "printed_number": "55", "grade_note": null, "photo": null}, {"id": 642, "page": 181, "area": "Mt Stapylton", "boulder": null, "name": "MAD MAX", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Arms like an ape help. Sit start on an incut slot (LH) and a shallow undercling (RH) and make a big span move to the arete. Climb up the arete to finish at the juggy break. Klem Loskot", "printed_number": "12", "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 195, "page": 65, "area": "Andersens / Lower Clicke", "boulder": "Clyde Boulder", "name": "MADE TO ORDER", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start as for Trivial Pursuit and move up right to slopey rail and then mantle the lower end of the block.", "printed_number": "14", "grade_note": null, "photo": "photos/066-2.jpg"}, {"id": 1156, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "MAN DOWN", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Good warm up. Sit start as far left in the cave as possible on good jugs and follow the big holds rightwards towards the light. Andy Beckworth", "printed_number": "1", "grade_note": null, "photo": "photos/301-2.jpg"}, {"id": 1, "page": 31, "area": "Andersens / Amnesty", "boulder": "METROSEXUAL BOULDER", "name": "METROSEXUAL", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Located on the first boulder you encounter on the track into Andersens, just in front of Gunn Buttress. Stand start with the incut flake just left of the arete and top out. Julian Saunders", "printed_number": "1", "grade_note": null, "photo": "photos/031-2.jpg"}, {"id": 1130, "page": 293, "area": "Buandik / Got Lost", "boulder": "Mini Rigs (small boulder cluster)", "name": "MILLIPEDE", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "Sit start on the spiked jug and go straight up. Miriam Perschmann", "printed_number": "58", "grade_note": null, "photo": null}, {"id": 866, "page": 232, "area": "Valley of the Giants", "boulder": "Unnamed boulder beside Taken (see notes)", "name": "MINISTRY OF FAIRNESS", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Pleasant warm up. From a jug 1m right of Phantom Foot Orgasm climb the pocketed grey face.", "printed_number": "28", "grade_note": null, "photo": null}, {"id": 22, "page": 35, "area": "Andersens / Amnesty", "boulder": "B1 BOULDER (inferred)", "name": "MOUNTAIN MAN", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Do boulderers qualify as mountain men/women? Sit start on the left side of the arete and climb the juggy arete to top out.", "printed_number": "22", "grade_note": null, "photo": "photos/034-3.jpg"}, {"id": 1107, "page": 286, "area": "Buandik / Got Lost", "boulder": "Little Country", "name": "NATHANIEL HORNBLOWER", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Adam Yauch of the Beastie Boys' tribute problem. Climb the featured face 3m left of Sekani on good holds.", "printed_number": null, "grade_note": null, "photo": "photos/286-1.jpg"}, {"id": 808, "page": 220, "area": "The Bleachers", "boulder": "Three Sisters Boulder", "name": "NERVOUS NED IS DEAD", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "The right column. Sit start then up to LH side-pull and juggy finish. Braeden Hyland", "printed_number": "67", "grade_note": null, "photo": "photos/220-1.jpg"}, {"id": 519, "page": 149, "area": "Trackside", "boulder": "Inflammatory Boulder", "name": "ONE FLASH AND YOU'RE ASH", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Climb the right-leaning crack to a juggy mantle.", "printed_number": "32", "grade_note": null, "photo": "photos/149-2.jpg"}, {"id": 1226, "page": 319, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "ONE MOVE WONDER", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "You get what it says on the box (though the wonder may be hyperbolic). On the track side of the boulder, just left of the boulder propping up the bloc is a sloper. Make one move off this to juggy top out.", "printed_number": "32", "grade_note": null, "photo": "photos/318-1.jpg"}, {"id": 410, "page": 114, "area": "Loopeys", "boulder": null, "name": "ONE SLEEP", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start at the back of the cave and climb left around the cave to finish as for Two Sleeps.", "printed_number": "8", "grade_note": null, "photo": "photos/114-2.jpg"}, {"id": 165, "page": 59, "area": "Andersens / Right Main", "boulder": "The Wailing Wall", "name": "PANTHER", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start on flakes at the left side of wall. Pounce like a panther up to a hole in the wall and finish matched in the horizontal break.", "printed_number": "50", "grade_note": null, "photo": "photos/059-1.jpg"}, {"id": 133, "page": 53, "area": "Andersens / Right Main", "boulder": "Russian Bull Boulder", "name": "PEACHES & DAMSONS", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Very pleasant. Sit start matched on the low protruding jug. Move up to the rounded flake and then follow the small seam to the top of the boulder.", "printed_number": "18", "grade_note": null, "photo": "photos/054-2.jpg"}, {"id": 827, "page": 222, "area": "The Bleachers", "boulder": "Den of Dwarves", "name": "PONY", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Ride it. Sit start on two slopey edges, up right past good sloper and easy finish. Kade Wilson", "printed_number": "86", "grade_note": null, "photo": "photos/223-2.jpg"}, {"id": 994, "page": 256, "area": "HALLS GAP", "boulder": "STOPLIGHT ARETE", "name": "PROBLEM BANANA", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Fun. One metre left of Stoplight Arête, sit start in the crack and layback up the corner.", "printed_number": "44", "grade_note": null, "photo": "photos/256-3.jpg"}, {"id": 168, "page": 59, "area": "Andersens / Right Main", "boulder": "The Wailing Wall", "name": "REGINALD", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start at the bottom of the rising flake near the arete. Head halfway up the flake and up pockets. Giles Helbig", "printed_number": "53", "grade_note": null, "photo": "photos/060-2.jpg"}, {"id": 1082, "page": 282, "area": "Buandik / Got Lost", "boulder": "Sasquatch Boulder", "name": "SASSY PANTS", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start on the jug flake at the left side of the boulder, traverse left to gain arete and head up.", "printed_number": "10", "grade_note": null, "photo": "photos/282-2.jpg"}, {"id": 262, "page": 78, "area": "Andersens / Clicke", "boulder": "Sketchy Wall", "name": "SKETCHY", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Start at right side of the wall on the diagonal slopey rail and climb to the top over the peak.", "printed_number": "22", "grade_note": null, "photo": "photos/062-236.jpg"}, {"id": 1074, "page": 279, "area": "VICTORIA RANGE", "boulder": "MONSTER BOULDER", "name": "SLAB MONSTER", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Start as Scary Monster but move left and up slab.", "printed_number": "2", "grade_note": null, "photo": "photos/279-2.jpg"}, {"id": 798, "page": 218, "area": "The Bleachers", "boulder": "Africa Boulder (unclear)", "name": "SLAB OF SHITNESS", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Not that shit and requiring a surprising amount of deft climbing. Ascend the small face from a stand start off side-pulls, up the middle of the wall avoiding the aretes. Chook Betts", "printed_number": "57", "grade_note": null, "photo": null}, {"id": 110, "page": 51, "area": "Andersens / Right Main", "boulder": null, "name": "SLAB101", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "The left most line on the slabby face. Stand start at small pockets and move up via blocky edges.", "printed_number": "88", "grade_note": null, "photo": "photos/048-2.jpg"}, {"id": 14, "page": 34, "area": "Andersens / Amnesty", "boulder": "BREMBO BOULDER", "name": "SLAM DUNK", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Everyone can dunk nowadays. Sit start on the big pocket 1m right of the arete and make a big move to a huge pocket, chalk up the two points, then peacock through an easy top out.", "printed_number": "14", "grade_note": null, "photo": "photos/033-1.jpg"}, {"id": 191, "page": 65, "area": "Andersens / Lower Clicke", "boulder": "Sydney Highrise Boulder (inferred)", "name": "SMACK CRACK", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Showing its age, all the kids are on ice now. Stand start on a jug at the bottom of the crack. Follow it to the top. In need of some gardening.", "printed_number": "10", "grade_note": null, "photo": "photos/065-2.jpg"}, {"id": 758, "page": 212, "area": "The Bleachers", "boulder": "Dovai Ray (hidden chamber)", "name": "SMASHED BOX", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "From a sit start off a double-handed sloper, climb the inside of the arete finishing right at the top. Chook Betts", "printed_number": "17", "grade_note": null, "photo": null}, {"id": 44, "page": 40, "area": "Andersens / Left Main", "boulder": "GAS BOULDER (inferred)", "name": "SOOKIE", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start on jugs just left of the arete. Climb up using the face and arete to top out.", "printed_number": "22", "grade_note": null, "photo": "photos/039-1.jpg"}, {"id": 540, "page": 151, "area": "Trackside", "boulder": "Jungle Boulder", "name": "STEAK KNIFE", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sharp? Stand start in the pocket and traverses the lip to a funky rollover manoeuver. Al Robertson", "printed_number": "52", "grade_note": null, "photo": "photos/154-1.jpg"}, {"id": 1281, "page": 330, "area": "Windowlicker Area", "boulder": "Gully proper (chasm)", "name": "STOCKHOLM SYNDROME", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "From a stand start at the lip of the chasm climb the ribbed red turret to the ledge. Ross Taylor", "printed_number": "25", "grade_note": null, "photo": "photos/330-1.jpg"}, {"id": 79, "page": 44, "area": "Andersens / Left Main", "boulder": "Shotgun Boulder", "name": "THE CLEAVER", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Easier post fires now that the flake is a jug. Sit start on the arrowhead flake and up to mantle.", "printed_number": "57", "grade_note": null, "photo": "photos/044-1.jpg"}, {"id": 1114, "page": 288, "area": "Buandik / Got Lost", "boulder": "Alone on the Hill Boulder", "name": "THE DOWNCLIMB", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "Climbs the easy northern face of the boulder on good holds. Jochen Perschmann", "printed_number": "42", "grade_note": null, "photo": null}, {"id": 1197, "page": 313, "area": "Tower Proper", "boulder": "The Stool", "name": "THE GROOM", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "The arete on the front from a stand. Ross Taylor", "printed_number": "3", "grade_note": null, "photo": "photos/312-2.jpg"}, {"id": 793, "page": 218, "area": "The Bleachers", "boulder": "The Walker Boulder", "name": "THE KRISS", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Climb the sweet, high face from a stand start.", "printed_number": "52", "grade_note": null, "photo": null}, {"id": 286, "page": 81, "area": "Andersens / Clicke", "boulder": "Wrecking Ball", "name": "THE PUNT ARETE", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Stand start at a high incut jug and climb the blunt arete.", "printed_number": "46", "grade_note": null, "photo": "photos/081-2.jpg"}, {"id": 533, "page": 151, "area": "Trackside", "boulder": "Tiger Boulder", "name": "THE SEEN & UNSEEN", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "Please don't fall off. Step off the boulder and climb the left side of northwestern arete. Steve Kelly", "printed_number": "45", "grade_note": null, "photo": null}, {"id": 194, "page": 65, "area": "Andersens / Lower Clicke", "boulder": "Clyde Boulder", "name": "TRIVIAL PURSUIT", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start at the right side of the face with a juggy flake side-pull. Climb up left through diagonal weaknesses to a high top out near where the biggest flakeline meets the lip.", "printed_number": "13", "grade_note": null, "photo": "photos/066-2.jpg"}, {"id": 702, "page": 201, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "UNFLEXED", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Start on the far right of the crackline and climb up through the groove exit of Gay Hip Flexor.", "printed_number": "21", "grade_note": null, "photo": "photos/201-1.jpg"}, {"id": 835, "page": 224, "area": "The Bleachers", "boulder": "Frankston Boulders (downhill face)", "name": "VICTIM", "grade_raw": "V1", "grade_num": 1, "pictured": 0, "description": "Stand start 2m left of Kleptocracy and climb the easy face above. Chook Betts", "printed_number": "94", "grade_note": null, "photo": null}, {"id": 741, "page": 207, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "WARM UP RIGHT", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Sit start low on the wall just right of the arete with a bucket of a hold. Climb left and up on jugs and a slot to mantle.", "printed_number": "21", "grade_note": null, "photo": "photos/206-1.jpg"}, {"id": 287, "page": 81, "area": "Andersens / Clicke", "boulder": "Wrecking Ball", "name": "WRECKING BALL", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Start on the jugs at the left end of the sloping break. Climb the slopey features.", "printed_number": "47", "grade_note": null, "photo": "photos/081-2.jpg"}, {"id": 804, "page": 220, "area": "The Bleachers", "boulder": "Prow Boulder", "name": "ZERO", "grade_raw": "V1", "grade_num": 1, "pictured": 1, "description": "Climb rail then up face.", "printed_number": "63", "grade_note": null, "photo": "photos/220-2.jpg"}, {"id": 869, "page": 232, "area": "Valley of the Giants", "boulder": "Unnamed boulder beside Taken (see notes)", "name": "8 ITEMS OR FEWER", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "About 15m around right from VS Ramachandran is short arete capped by a little roof that is perfect for pedants. Climb the arete from a sit start off low edges. Ross Taylor", "printed_number": null, "grade_note": null, "photo": null}, {"id": 881, "page": 233, "area": "Valley of the Giants", "boulder": "Mini Giant Boulders", "name": "APOSTROPHE PROTECTION SOCIETY", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Climb twin cracks in middle of the face from stand start. Ross Taylor", "printed_number": "43", "grade_note": null, "photo": null}, {"id": 265, "page": 79, "area": "Andersens / Clicke", "boulder": "Guernica Block", "name": "ARCANE ART", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The best kind. Start with the protruding ledge and climb the perfect splitter crack to its top. Finish by traversing right on pockets and the horizontal break.", "printed_number": "25", "grade_note": null, "photo": "photos/078-1.jpg"}, {"id": 1289, "page": 331, "area": "Windowlicker Area", "boulder": "Arnie Cracks the Sads", "name": "ARNIE CRACKS THE SADS", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Cruelly stolen from Arnie who, utterly justifiably, cracked the shits and had a sook. Climb the left arete of the big black face. Ross Taylor", "printed_number": "33", "grade_note": null, "photo": null}, {"id": 813, "page": 221, "area": "The Bleachers", "boulder": "Cirque of the Climbables", "name": "ATTACK OF THE KILLER BULGES", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The northeast face (facing the main track) of the boulder is high and mossy. Climb the middle of it avoiding death flake near top. Ross Taylor", "printed_number": "72", "grade_note": null, "photo": "photos/221-1.jpg"}, {"id": 21, "page": 35, "area": "Andersens / Amnesty", "boulder": "B1 BOULDER (inferred)", "name": "BANANA SLAB", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Climb the slab 2m right of The Air Below.", "printed_number": "21", "grade_note": null, "photo": "photos/034-3.jpg"}, {"id": 856, "page": 231, "area": "Valley of the Giants", "boulder": "Big Bastard", "name": "BASTARD SLAB", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Just left of where the two boulders meet is a slab. Start up the blunt arete, finishing right under the tree branch. Ross Taylor", "printed_number": "18", "grade_note": null, "photo": null}, {"id": 942, "page": 242, "area": "FALLS GAP", "boulder": "FIRST BOULDER", "name": "BE THE GOAT", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Always be yourself, unless you can be the goat. From a stand start climb the short arête on the northern end of the boulder. Ross Taylor", "printed_number": "104", "grade_note": null, "photo": null}, {"id": 949, "page": 242, "area": "FALLS GAP", "boulder": "CONVINCED BOULDER", "name": "BEACH HOLIDAY", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Bring your boardies this one looks a tad sandy. Sit start on the fallen boulder under the right side of the boulder. Up the hanging arête on satisfying jugs.", "printed_number": "111", "grade_note": null, "photo": null}, {"id": 818, "page": 221, "area": "The Bleachers", "boulder": "Cirque of the Climbables", "name": "BIG DAVE'S ARETE", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Sit start on the left arete and climb right up prow.", "printed_number": "77", "grade_note": null, "photo": null}, {"id": 780, "page": 216, "area": "The Bleachers", "boulder": "Short face near Indy's Drop Off", "name": "BLEACHED BALLS", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "As high as they climb. The arete right of Indy's Drop Off is high and sustained with some long moves. Don't fall off. Chook Betts", "printed_number": "39", "grade_note": null, "photo": "photos/216-2.jpg"}, {"id": 197, "page": 66, "area": "Andersens / Lower Clicke", "boulder": "Bonnie Boulder", "name": "BONNIE", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Start on good holds on the west arete and climb it to a high top out.", "printed_number": "16", "grade_note": null, "photo": null}, {"id": 223, "page": 69, "area": "Andersens / Lower Clicke", "boulder": "Bonsai Rooflet", "name": "BONSAI RIGHT", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Start on the jug rail under the roof and move straight up to holds in the seam and a pretty easy mantle.", "printed_number": "42", "grade_note": null, "photo": "photos/068-1.jpg"}, {"id": 35, "page": 38, "area": "Andersens / Left Main", "boulder": "B2 BOULDER (inferred)", "name": "BUCK DELUXE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Stand start on the jug in the middle of the wall and top out high up via the crack systems.", "printed_number": "13", "grade_note": null, "photo": "photos/038-1.jpg"}, {"id": 253, "page": 76, "area": "Andersens / Clicke", "boulder": "Coppertone Boulder (inferred)", "name": "BUMBLE CORNER", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start at the big pocket just left of the arete and climb up left through a series of rails.", "printed_number": "13", "grade_note": null, "photo": "photos/076-1.jpg"}, {"id": 63, "page": 42, "area": "Andersens / Left Main", "boulder": null, "name": "CAPTAIN PUGWASH", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The easiest way up the face. Stand start with diagonal sloping jugs and climb up and slightly left up the face to top out. Julian Saunders", "printed_number": "43", "grade_note": null, "photo": "photos/042-2.jpg"}, {"id": 445, "page": 129, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "CHARLIE'S SEX TOUR", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start to the right of Innocence and climb up the features in the middle of the wall", "printed_number": "9", "grade_note": null, "photo": "photos/129-3.jpg"}, {"id": 1259, "page": 326, "area": "Windowlicker Area", "boulder": "Crown Boulder", "name": "CHELSEA SMILE", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Four metres right of Podlife is a juggy shelf. Climb straight up from shelf past twin slashes and high top out.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 528, "page": 150, "area": "Trackside", "boulder": "Love Boulder", "name": "CHILD OF LOVE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Great climbing on lovely holds. Sit start on the slot at the base of the blunt arete and climb up on slopers and edges.", "printed_number": "40", "grade_note": null, "photo": "photos/150-2.jpg"}, {"id": 832, "page": 223, "area": "The Bleachers", "boulder": "Frankston Boulders (downhill roof boulder)", "name": "CHOOK'S GROVEL", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Better than its marketing suggests. Sit right of cave and climb bulgy seams above. Chook Betts", "printed_number": "91", "grade_note": null, "photo": null}, {"id": 969, "page": 250, "area": "VENUS BATHS", "boulder": null, "name": "CILICE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Flagellate thine own self. Left of S&M Arête is an easy runnel that is climbed from a stand start.", "printed_number": "19", "grade_note": null, "photo": null}, {"id": 1019, "page": 268, "area": "BUANDIK / MADE IT", "boulder": "COOKIE MONSTER BOULDER", "name": "COOKIE MONSTER", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The short wall on the right of the Junction. Sit start on low break, up past flake to top.", "printed_number": "21", "grade_note": null, "photo": "photos/268-3.jpg"}, {"id": 767, "page": 213, "area": "The Bleachers", "boulder": "Blackbeard's Boulder (backside, unnamed)", "name": "COURTYARD ARETE", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Climb the slopey arete from the sit. Fun.", "printed_number": "26", "grade_note": null, "photo": null}, {"id": 554, "page": 156, "area": "Trackside", "boulder": "Upper Boulder", "name": "COWARD'S PUNCH", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Rebranding the king hit. Sit start just right of the arete and head up either left or right.", "printed_number": "66", "grade_note": null, "photo": "photos/156-1.jpg"}, {"id": 566, "page": 159, "area": "Trackside", "boulder": "Unnamed (near Darjeeling Express)", "name": "D'ARTAGNAN", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "One for all and blah, blah, blah. Just 1.5m left of the blunt arete is a diagonal crack. Climb it from a sit start past the slopey lip. Riccardo Toto Monetta", "printed_number": "78", "grade_note": null, "photo": "photos/159-1.jpg"}, {"id": 199, "page": 66, "area": "Andersens / Lower Clicke", "boulder": "Bad Cliche Boulder", "name": "DROP OF THE HAT", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start on good holds and then ascend the featured arete.", "printed_number": "18", "grade_note": null, "photo": "photos/066-1.jpg"}, {"id": 1204, "page": 316, "area": "Tower Proper", "boulder": "Unidentified side gully behind the Stool", "name": "DURIAN", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Not as sweet as a mango, though luckily this doesn't pong like one. Midway up the right side of the gully behind the Stool is an overhanging face in a side gully. This line busts up easily from a sit start on jugs. Ross Taylor", "printed_number": "10", "grade_note": null, "photo": null}, {"id": 826, "page": 222, "area": "The Bleachers", "boulder": "Den of Dwarves", "name": "DWARF POWER", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Ode to Tyrion. Sit start on low slopers, up right past yet more slopers to top out. Kade Wilson", "printed_number": "85", "grade_note": null, "photo": null}, {"id": 784, "page": 217, "area": "The Bleachers", "boulder": "Beige is All the Rage", "name": "EARL OF BROWN", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Same start as Hymen Gorillas but then head left on the break (no low boulders for feet), and finish up the face. Daniel Earl", "printed_number": "43", "grade_note": null, "photo": "photos/216-1.jpg"}, {"id": 989, "page": 255, "area": "HALLS GAP", "boulder": "DIAGONAL LANEWAY BOULDER", "name": "EASY LANE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The easy arête is climbed from a sit.", "printed_number": "39", "grade_note": null, "photo": "photos/254-1.jpg"}, {"id": 636, "page": 179, "area": "Mt Stapylton", "boulder": "Ammagamma Boulder", "name": "ENDAMAX", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Surprisingly burly for the grade. Sit start on the slopey rail at the base of the crackline and head straight up with big moves on big holds.", "printed_number": "6", "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 1037, "page": 270, "area": "VICTORIA RANGE", "boulder": "MASSIVE DYNAMIC BOULDER (uncertain)", "name": "ENT", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The corner, starting just right of tree on good edge. More good holds lead to high finish.", "printed_number": "39", "grade_note": null, "photo": "photos/270-1.jpg"}, {"id": 979, "page": 251, "area": "VENUS BATHS", "boulder": "BAKELITE CONCEPT", "name": "EVE OF THE TIGER", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Good warm up. Sit start on low jugs down and right of the start of the Bakelite Concept. Climb up and right. Braeden Hyland", "printed_number": "29", "grade_note": null, "photo": "photos/251-1.jpg"}, {"id": 1093, "page": 283, "area": "Buandik / Got Lost", "boulder": "Ranger's Law Boulder", "name": "EVICTION NOTICE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Poor dirtbags. Why won't The Man Just leave them be to camp at Buandik for months on end? Sit start on low jugs on the white arete at the left hand side of the cave on the boulder's northern face. Climb through edges and side pull to top. Zoe Redmond", "printed_number": "21", "grade_note": null, "photo": "photos/283-1.jpg"}, {"id": 1295, "page": 332, "area": "Windowlicker Area", "boulder": "Sun Arete Boulder", "name": "EXHAUSTED STAR", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start on jugs at right end of the ledge. Make a tricky move up, then left on juggy slots until you can make a move to a big jug. Finish right.", "printed_number": "39", "grade_note": null, "photo": "photos/332-1.jpg"}, {"id": 907, "page": 238, "area": "Valley of the Giants", "boulder": "Ways of Being Boulder", "name": "EXIT THROUGH THE GIFTSHOP", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Stand start in the crack 1m left of the arete left of Ways of Being. Follow the crack up left with a funky drive-by to an easy finish. Garry Williams", "printed_number": "69", "grade_note": null, "photo": "photos/238-3.jpg"}, {"id": 770, "page": 214, "area": "The Bleachers", "boulder": "Nicholas Cage Memorial Face", "name": "FACE OFF", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "May get harder as crimps drop off. Climb the crimpy broken face, exiting right to the ledge. Chook Betts", "printed_number": "29", "grade_note": null, "photo": "photos/214-1.jpg"}, {"id": 472, "page": 135, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "FALSE PROFIT", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Deep man, real deep. Anti-capitalist propaganda at a very accessible grade. Sit start on the blunt arete of darker rock just left of the crack. Follow the arete on edges to jugs. Used to get a star before all the holds fell off.", "printed_number": null, "grade_note": null, "photo": "photos/133-1.jpg"}, {"id": 672, "page": 191, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "FAMILY DUCK", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Start just right of Donald and climb up the rib to a sloper rail under the roof. Traverse right to top out onto the ledge.", "printed_number": "8", "grade_note": null, "photo": "photos/190-1.jpg"}, {"id": 723, "page": 205, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "FAR LEFT ZANE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start with the thin, right-leaning diagonal crack to the right of the Grapevine Crack. Climb left, then finish up Grapevine Crack.", "printed_number": "3", "grade_note": null, "photo": "photos/204-1.jpg"}, {"id": 73, "page": 43, "area": "Andersens / Left Main", "boulder": "Font Boulder (inferred)", "name": "FAULTLINE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start with a RH pocket and LH gaston. Follow the good seam to the top. Julian Saunders", "printed_number": "46", "grade_note": null, "photo": "photos/042-1.jpg"}, {"id": 19, "page": 35, "area": "Andersens / Amnesty", "boulder": "B1 BOULDER (inferred)", "name": "FEMININE TOUCH", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Alluring, satisfying, castigating. Stand start at good edge. Move to pocket and slab to top out.", "printed_number": "19", "grade_note": null, "photo": "photos/034-3.jpg"}, {"id": 871, "page": 232, "area": "Valley of the Giants", "boulder": "Weilly Annoying Boulder", "name": "FLAKE OF FEAR", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "On right side of blank face is a slopey flake. Climb it to a high but easy finish.", "printed_number": "33", "grade_note": null, "photo": null}, {"id": 699, "page": 201, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "FLEXOR TRAVERSE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Start all the way over on the far right of the crackline and traverse left to ultimately finish up Ross' Problem.", "printed_number": "10", "grade_note": null, "photo": "photos/201-1.jpg"}, {"id": 211, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "GOOD AS GOLD", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Another good one. Start as for Arm and a Leg and climb straight up the juggy seam.", "printed_number": "30", "grade_note": null, "photo": "photos/067-1.jpg"}, {"id": 1134, "page": 293, "area": "Buandik / Got Lost", "boulder": "Got Lost Boulder", "name": "GOT LOST", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Clearly put up in the pre-guidebook era. On the eastern end of the boulder starting off a boulder, climb the high, juggy face above.", "printed_number": "62", "grade_note": null, "photo": "photos/293-1.jpg"}, {"id": 176, "page": 61, "area": "Andersens / Right Main (inferred)", "boulder": "Giddy Up Boulder", "name": "GREY GUMS", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Stand start and climb straight up the wall on thin flakes and side-pulls.", "printed_number": "61", "grade_note": null, "photo": "photos/062-3.jpg"}, {"id": 1010, "page": 265, "area": "BUANDIK / MADE IT", "boulder": "LOW BOULDER AROUND CORNER FROM SHIT CARTER", "name": "GREY SLAB", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Climb the middle of the grey slab.", "printed_number": "12", "grade_note": null, "photo": null}, {"id": 970, "page": 250, "area": "VENUS BATHS", "boulder": "RICK & MORTY BOULDER", "name": "HELLUVA MILLER", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Climb the juggy face right of arête from a sit start.", "printed_number": "20", "grade_note": null, "photo": "photos/250-1.jpg"}, {"id": 1071, "page": 278, "area": "VICTORIA RANGE", "boulder": "CRIDULAR BOULDER", "name": "HICK UP", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Easy line up arête at the very left side of the cave.", "printed_number": "73", "grade_note": null, "photo": null}, {"id": 515, "page": 148, "area": "Trackside", "boulder": "Website Boulder", "name": "HIGHWAY TO AVDELL", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Takes the more central line up the face. Sit start on underclings in the diagonal seam. Head up and right.", "printed_number": "27", "grade_note": null, "photo": "photos/148-1.jpg"}, {"id": 217, "page": 68, "area": "Andersens / Lower Clicke", "boulder": "Skittle Boulder", "name": "HOOKED", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start at the blocky-arete feature on opposing holds and climb up to a juggy finish.", "printed_number": "36", "grade_note": null, "photo": "photos/068-3.jpg"}, {"id": 805, "page": 220, "area": "The Bleachers", "boulder": "Three Sisters Boulder", "name": "HYLANDER", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Needs more Christopher Lambert. Left column avoiding right crack. Braeden Hyland", "printed_number": "64", "grade_note": null, "photo": "photos/220-1.jpg"}, {"id": 1133, "page": 293, "area": "Buandik / Got Lost", "boulder": "Unnamed boulder north of European Dream", "name": "I'M SO WONEWY", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "All by its lonesome. From sit start on good edge at the face's left end, climb up, finishing left.", "printed_number": "61", "grade_note": null, "photo": "photos/292-4.jpg"}, {"id": 1054, "page": 275, "area": "BUANDIK / MADE IT", "boulder": "THE EYRIE (wall below Balazar)", "name": "IT'S MY STYLE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Juggy line left of Tunnel Vision. Sit start on large jug, up. Katinka Perschmann", "printed_number": "56", "grade_note": null, "photo": "photos/275-1.jpg"}, {"id": 727, "page": 206, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "JUGGED", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Start as for Tall Tales, finishing at the big jug.", "printed_number": "7", "grade_note": null, "photo": "photos/204-1.jpg"}, {"id": 558, "page": 156, "area": "Trackside", "boulder": "Upper Cave Wall", "name": "JUMPING JACK", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "A fun little dyno on the way to the higher boulders. Stand start at the shorter, right hand end of the wall at a large yet solid bucket hold. Make a big move to a pocket and top out onto the ledge.", "printed_number": "70", "grade_note": null, "photo": null}, {"id": 592, "page": 167, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "KARL", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "A good name for a socialist. From a sit start climb up the right-leaning juggy flake and then back out left using a slot to finish in the break.", "printed_number": null, "grade_note": null, "photo": "photos/167-2.jpg"}, {"id": 898, "page": 237, "area": "Valley of the Giants", "boulder": "High face to the right of Pinch & A Punch (Barbara Cartland names)", "name": "KISS THE MOONLIGHT", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Climb the easy white streak to bulging top out.", "printed_number": "60", "grade_note": null, "photo": "photos/237-3.jpg"}, {"id": 183, "page": 62, "area": "Andersens / Right Main (inferred)", "boulder": "Sydney Highrise Boulder", "name": "LADY LUCK", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Everyone needs a bit of lady luck. Start as for George St, but head straight up", "printed_number": "4", "grade_note": null, "photo": "photos/065-2.jpg"}, {"id": 771, "page": 214, "area": "The Bleachers", "boulder": "Nicholas Cage Memorial Face", "name": "LEAVING LAS VEGAS", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Easier if you're not short. Sit start using the low crack, climb up the seam above to the ledge.", "printed_number": "30", "grade_note": null, "photo": null}, {"id": 16, "page": 35, "area": "Andersens / Amnesty", "boulder": "WING BOULDER", "name": "LITTLE WING", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start and climb the juggy features up the right arete.", "printed_number": "16", "grade_note": null, "photo": "photos/034-2.jpg"}, {"id": 270, "page": 79, "area": "Andersens / Clicke", "boulder": "Bridesmaid Wall", "name": "LTZ", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Start on the crescent slot 2m right of Pump Action. Pull up to the pocket and top out.", "printed_number": null, "grade_note": null, "photo": "photos/079-1.jpg"}, {"id": 820, "page": 221, "area": "The Bleachers", "boulder": "Cirque of the Climbables", "name": "MACK DADDY", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "On the back of the boulder (opposite Rosie Perez), sit start on the right end of the boulder, head left across the long lip, for full value get both hands on the nose all the way left and press up to finish. Daniel Earl", "printed_number": "79", "grade_note": null, "photo": null}, {"id": 688, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "MARY", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The site of many a stack but all the same nice little warm up line starting on the break and climbing to the rooflet, which is mantled, walk off or jump.", "printed_number": "7", "grade_note": null, "photo": "photos/199-1.jpg"}, {"id": 1078, "page": 279, "area": "VICTORIA RANGE", "boulder": "SPACE PIRATE SHIP", "name": "MATT DAMON THE POTATO FARMER", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start on crimps on the right side of small overhang, move left through jugs and top out on pockets and edges. Zoe Redmond", "printed_number": "6", "grade_note": null, "photo": "photos/279-3.jpg"}, {"id": 923, "page": 240, "area": "Valley of the Giants", "boulder": "Open Book Boulder", "name": "MURDER SHE WROTE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "As attractive as Angela Lansbury. Sit start with RH on slopey side-pull of the Hapcorner and LH pinching the bulge, press out through gaston up to a good edge and mantle. Giuba Savorgnan", "printed_number": "90", "grade_note": null, "photo": "photos/240-1.jpg"}, {"id": 1268, "page": 327, "area": "Windowlicker Area", "boulder": "Cornish Acid Boulder", "name": "NATIMUK WEED", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sucks you into the Vortex. Sit start on the obvious jug in the tight gully, climb up and slightly right.", "printed_number": "12", "grade_note": null, "photo": "photos/327-1.jpg"}, {"id": 736, "page": 207, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "NOT DROWNING, WAVING", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start at the right hand end of the main face with a jug that's behind the blocky feature. Climb to the top on consistently good holds. Gordon Poultney", "printed_number": "16", "grade_note": null, "photo": "photos/206-3.jpg"}, {"id": 1294, "page": 332, "area": "Windowlicker Area", "boulder": "Northern wall of chasm (Sun Arete massif)", "name": "PATCH'S PROBLEM", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "Many women suggest this problem's name should be pluralised. Sit start 1.5m left of the clean corner. Head up the vague arete to high finish in cave. Nathan Manning", "printed_number": "38", "grade_note": null, "photo": null}, {"id": 822, "page": 222, "area": "The Bleachers", "boulder": "Slapper's Boulder", "name": "PIMPLY PINCHES", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The groove using eponymous pimply pinches.", "printed_number": "81", "grade_note": null, "photo": "photos/222-2.jpg"}, {"id": 196, "page": 66, "area": "Andersens / Lower Clicke", "boulder": "Bonnie Boulder", "name": "PINBALL", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "What will happen if you fall off. At the right side of the north-facing wall. Stand start in the narrow gap between the next boulder with holds in the deep seam. Follow it up the lichen-covered face to a high finish.", "printed_number": "15", "grade_note": null, "photo": null}, {"id": 757, "page": 212, "area": "The Bleachers", "boulder": "Dovai Ray (hidden chamber)", "name": "PRINCE ALBERT", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Could be painful. Climb the very tall right arete from a sit start, crux at 3/4 height. Chook Betts", "printed_number": "16", "grade_note": null, "photo": "photos/212-2.jpg"}, {"id": 348, "page": 96, "area": "Echoes Block", "boulder": null, "name": "RAIL CROSS", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Start low on the giant flake I'm right of XXXX. Climb up the flake and onto the face to finish on the jug of Fallen Cow.", "printed_number": "13", "grade_note": null, "photo": "photos/096-2.jpg"}, {"id": 718, "page": 203, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "RAUMSCHIFF ENTERPRIESS", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start on the rail at the base of the rail feature. Pull through a big move off a small hold and swim through the sea of jugs to the top.", "printed_number": null, "grade_note": null, "photo": "photos/203-2.jpg"}, {"id": 527, "page": 150, "area": "Trackside", "boulder": "Love Boulder", "name": "REACH AROUND", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Dynoing for beginners! Sit start on the obvious horizontal seam and dyno directly to the large pocket.", "printed_number": "39", "grade_note": null, "photo": "photos/150-2.jpg"}, {"id": 960, "page": 247, "area": "VENUS BATHS", "boulder": "CERAMICS BOULDER", "name": "RED-BELLIED BLACK", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Our advice would be to not make this your first V2. The easy line up the middle of the face 2m right of the tree, finishing just left of the crack at top. Oliver Miller", "printed_number": "10", "grade_note": null, "photo": "photos/249-2.jpg"}, {"id": 878, "page": 233, "area": "Valley of the Giants", "boulder": "Weilly Annoying Boulder (uncertain)", "name": "RHETORICAL QUESTION MARK", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Climb the short crack just right of the arete moving left to top out. Ross Taylor", "printed_number": "40", "grade_note": null, "photo": null}, {"id": 812, "page": 220, "area": "The Bleachers", "boulder": "Tier of boulders below Three Sisters (unnamed)", "name": "ROSIE PEREZ", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Strangely fun, apparently. As for Wesley Snipes, but traverse right for 2m then up slab. Chook Betts", "printed_number": "71", "grade_note": null, "photo": "photos/221-2.jpg"}, {"id": 983, "page": 254, "area": "HALLS GAP", "boulder": "TSUNAMI BOULDER", "name": "RUNNING COMMENTARY", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "The tourists will provide it. Sit start as for Cat's Meow, then head up and left to top out.", "printed_number": "33", "grade_note": null, "photo": "photos/254-2.jpg"}, {"id": 673, "page": 191, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "SALMONELLI'S", "grade_raw": "V2", "grade_num": 2, "pictured": 0, "description": "The short and steep overhang 4m right of Family Duck. Start at the ledge in the large slot under the roof and punch up on good holds to mantle the lip.", "printed_number": "9", "grade_note": null, "photo": null}, {"id": 338, "page": 95, "area": "Echoes Block", "boulder": null, "name": "SCHLEICH DI", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "A shorter version of Dra Di starting on jugs at the lip and climbing left into the mantle.", "printed_number": "3", "grade_note": null, "photo": "photos/095-2.jpg"}, {"id": 124, "page": 53, "area": "Andersens / Right Main", "boulder": "Snowflake Boulder (inferred)", "name": "SEAMAN STAINS", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start at the bottom of the crack and climb up, avoiding using the boulder on the left of the crack. Julian Saunders", "printed_number": "9", "grade_note": null, "photo": "photos/052-3.jpg"}, {"id": 530, "page": 150, "area": "Trackside", "boulder": "Love Boulder", "name": "SEXY AS A TURD", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Alluring name for this nice highball line. Stand start and climb the right-trending weakness up the arete on jugs.", "printed_number": null, "grade_note": null, "photo": "photos/150-1.jpg"}, {"id": 993, "page": 256, "area": "HALLS GAP", "boulder": "SILVER LININGS BOULDER", "name": "SILVER LININGS", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Sit start on the lower flake (somewhat hugging the boulder). Bump LH, right heel hook, bump RH, left heel hook, do the hokey pokey then up. Alvin Khao", "printed_number": "43", "grade_note": null, "photo": "photos/132-587.jpg"}, {"id": 128, "page": 53, "area": "Andersens / Right Main", "boulder": "Snowflake Boulder", "name": "SNOWBALL", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "Stand start on big jug pockets. Up to the juggy break, traversing left to top out the boulder.", "printed_number": "13", "grade_note": null, "photo": "photos/052-1.jpg"}, {"id": 489, "page": 146, "area": "Trackside", "boulder": "Simon Says Boulder", "name": "SOME DAYS YOU BORE", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "True. Sit start on the jugs just left of the arete. Climb left for 2m and up on good holds.", "printed_number": "1", "grade_note": null, "photo": "photos/146-3.jpg"}, {"id": 1301, "page": 56, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "SOME OTHER SLOGAN", "grade_raw": "V2", "grade_num": 2, "pictured": 1, "description": "A fun little addition. Find the blankest piece of the slab and try to mantle.", "printed_number": "34", "grade_note": "printed as V0/2", "photo": "photos/057-1.jpg"}, {"id": 315, "page": 89, "area": "Legoland", "boulder": null, "na _number": "97", "grade_note": null, "photo": "photos/224-1.jpg"}, {"id": 476, "page": 138, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "CURTAIN CALL", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start under the left side of the roof on a good flat edge and RH in the crack. Reach back to holds on the rail and finish on the high jug.", "printed_number": "1", "grade_note": null, "photo": "photos/138-1.jpg"}, {"id": 333, "page": 93, "area": "Rambla Wall", "boulder": null, "name": "DANGLEBERRY GRAVEYARD", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Might refer to the putrid plughole of a long-put-off shower. Sit start on good holds in the dihedral and climb up and right past the horizontal break to top out high over the cliffband. Julian Saunders", "printed_number": "6", "grade_note": null, "photo": "photos/093-1.jpg"}, {"id": 988, "page": 255, "area": "HALLS GAP", "boulder": "DIAGONAL LANEWAY BOULDER", "name": "DIAGONAL LANEWAY", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Great climbing on a solid line. Sit start on the jug at the bottom of the rising diagonal cleft, which is followed rightward to top out on the far right of the boulder.", "printed_number": "38", "grade_note": null, "photo": "photos/255-2.jpg"}, {"id": 712, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "DISCONNECTED", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start at the lip of the left side of the cave with good holds. Climb up and left to mantle.", "printed_number": "31", "grade_note": null, "photo": "photos/202-1.jpg"}, {"id": 671, "page": 190, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "DONALD", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "A great introductory lesson in pinches. Start on the right side of the large scoop with a slopey pinch. Climb up to better holds, finishing left.", "printed_number": "7", "grade_note": null, "photo": "photos/190-1.jpg"}, {"id": 337, "page": 95, "area": "Echoes Block", "boulder": null, "name": "DRA DI", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Great warm up. Start matched on the big blockey feature to the right of the overhanging arete. Climb left on slots and pockets to mantle over the nose as Fackeln Im Sturm.", "printed_number": "2", "grade_note": null, "photo": "photos/095-2.jpg"}, {"id": 335, "page": 93, "area": "Rambla Wall", "boulder": null, "name": "EAT MORE LARD", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The Atkins diet. Sit start squeezed in behind the boulder with a pocket and slopey break. Make big moves up left on edges to a high top out. Simon Atkins", "printed_number": "8", "grade_note": null, "photo": "photos/093-1.jpg"}, {"id": 115, "page": 52, "area": "Andersens / Right Main", "boulder": "Gasoline Prow", "name": "ETHANOL", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Start as for Gasoline and move up to flakes in the roof. Climb left to mantle over the short ledge.", "printed_number": "2", "grade_note": null, "photo": "photos/051-2.jpg"}, {"id": 797, "page": 218, "area": "The Bleachers", "boulder": "Africa Boulder", "name": "FADHI KU DIRIR", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "'Sitting and fighting.' Sit start on the front arete. Getting your arse off the deck is the trickiest bit. Simon Weill", "printed_number": "56", "grade_note": null, "photo": null}, {"id": 158, "page": 58, "area": "Andersens / Right Main", "boulder": "Mandatory Choices Boulder (inferred)", "name": "FAITH", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Absolute classic. Sit start on the big featured flake and make a few moves up with bad feet to a punchy throw to the lip. Dave Jones", "printed_number": "43", "grade_note": null, "photo": "photos/058-1.jpg"}, {"id": 119, "page": 52, "area": "Andersens / Right Main", "boulder": "Lillyput Wall", "name": "FALLING SHORT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start 2m right of Lillyput with a LH edge and higher RH gaston. Climb up the bulging features and seams.", "printed_number": "6", "grade_note": null, "photo": "photos/051-1.jpg"}, {"id": 97, "page": 47, "area": "Andersens / Left Main", "boulder": "Zoolander Wall (inferred)", "name": "FAUX MAGNUM", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Apologies if this was your first V5, but the real Magnum is further left. Sit start under the rooflet and climb the zigzagging crack.", "printed_number": "74", "grade_note": null, "photo": "photos/047-1.jpg"}, {"id": 219, "page": 68, "area": "Andersens / Lower Clicke", "boulder": "Skittle Boulder", "name": "FEELINGS OF DETACHMENT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Too much ketamine? Start as for In Stitches. Move left and up the flakeline to top out over the nose.", "printed_number": "38", "grade_note": null, "photo": "photos/068-3.jpg"}, {"id": 1229, "page": 320, "area": "Tower Proper", "boulder": "Time Lapse Terrace", "name": "FLAKE OF DOOM", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Leftmost problem. Climb the obvious (flexing) flake from sit start on a chalked up jug to finish over the hole - don't fall in. Simon Weill", "printed_number": "35", "grade_note": null, "photo": null}, {"id": 666, "page": 190, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "FOG", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Not bad. Start on the jug rail under the roof and traverse left and delicately up to the juggy rail and top out as for Smog.", "printed_number": null, "grade_note": null, "photo": "photos/190-1.jpg"}, {"id": 182, "page": 62, "area": "Andersens / Right Main (inferred)", "boulder": "Sydney Highrise Boulder", "name": "GEORGE ST", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The result of one of the earliest bouldering trips to the Grampians courtesy of visiting Sydneyites. Sit start on small edges in horizontal crack. Move to a pocket and then to the break. Follow the break left and head up around the arete.", "printed_number": "3", "grade_note": null, "photo": "photos/065-2.jpg"}, {"id": 439, "page": 128, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "GHOST RIDE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start with the big slot and climb up and right across the wall to a tricky move at the seam to gain the lip.", "printed_number": "3", "grade_note": null, "photo": "photos/128-1.jpg"}, {"id": 774, "page": 214, "area": "The Bleachers", "boulder": "Nicholas Cage Memorial Face", "name": "GHOST RIDER", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start RH on big hueco, move left to tricky undercling on the arete then up staying left. Chook Betts", "printed_number": "33", "grade_note": null, "photo": null}, {"id": 322, "page": 90, "area": "Legoland", "boulder": null, "name": "GIRLS OF ARARAT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start matched on crimps in the flake. Reach right to a jug, traverse to top.", "printed_number": "29", "grade_note": null, "photo": "photos/090-1.jpg"}, {"id": 1158, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "GOOD MAN DOWN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The pick of the warm ups. Sit start as for Can't Keep A... but from the big jug head right to good pocket then up.", "printed_number": "3", "grade_note": null, "photo": "photos/301-2.jpg"}, {"id": 1009, "page": 265, "area": "BUANDIK / MADE IT", "boulder": "LOW BOULDER AROUND CORNER FROM SHIT CARTER", "name": "GREY AREA", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "On the back side is a one- or two-mover. Sit start on jug, one big move up then it is all over.", "printed_number": "11", "grade_note": null, "photo": "photos/265-3.jpg"}, {"id": 235, "page": 70, "area": "Andersens / Lower Clicke", "boulder": "The Scab (inferred)", "name": "HANG'EM HIGH", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Climbs the end of the hanging block. Start matched on the rail at the lip of the roof just right of the arete and climb/campus up to finish.", "printed_number": "54", "grade_note": null, "photo": null}, {"id": 509, "page": 148, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "HARD RIGHT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on the crescent dihedral and climb up and right using a LH mono to edges and pockets to slabby finish.", "printed_number": "21", "grade_note": null, "photo": "photos/148-3.jpg"}, {"id": 1020, "page": 268, "area": "BUANDIK / MADE IT", "boulder": "HEAVY METALS", "name": "HEAVY METALS", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Short overhanging boulder 5m farther on from the Cookie Monster. Start on low jugs on right, climb left and up.", "printed_number": "22", "grade_note": null, "photo": "photos/268-2.jpg"}, {"id": 825, "page": 222, "area": "The Bleachers", "boulder": "Slapper's Boulder", "name": "HESITATION & TEMPTATION", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The tall, right arete. Tricky stand start then side-pulls to undercling. Refuse the temptation to exit right and commit to finish on pimply jugs.", "printed_number": "84", "grade_note": null, "photo": "photos/222-1.jpg"}, {"id": 343, "page": 95, "area": "Echoes Block", "boulder": null, "name": "HIGHER LEARNING", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start low I'm right of Schweisspatrick on chossy looking jugs and climb the line of good holds in and around the vertical seam. Would be a great line if it wasn't for the boulder behind it.", "printed_number": "8", "grade_note": null, "photo": "photos/095-2.jpg"}, {"id": 293, "page": 83, "area": "Sandanista", "boulder": "Malapropism Boulder", "name": "HIP TO THE JIBE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Definitely not. Start 2m right of Animal Nitrate and climb the short slab. Ross Taylor", "printed_number": "6", "grade_note": null, "photo": "photos/083-2.jpg"}, {"id": 1008, "page": 265, "area": "BUANDIK / MADE IT", "boulder": "LOW BOULDER AROUND CORNER FROM SHIT CARTER", "name": "HOLE LOT OF FUN", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Not really. Sit start in unappealing hole, avoiding the moss as you can, then scarper left to top out.", "printed_number": "10", "grade_note": null, "photo": null}, {"id": 1098, "page": 285, "area": "Buandik / Got Lost", "boulder": "Still Here Boulder", "name": "HOLERUN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The west face has a cave at the base of it. Sit start on the right side of the cave, exit the middle of the cave via a big jug. Manu Mast", "printed_number": "26", "grade_note": null, "photo": null}, {"id": 17, "page": 35, "area": "Andersens / Amnesty", "boulder": "HORSEPENS BOULDER", "name": "HORSEPENS ARETE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Nice. Start with a dimple on the arete and the horizontal seam on the right face. Follow the cool slopey holds to the top.", "printed_number": "17", "grade_note": null, "photo": "photos/034-1.jpg"}, {"id": 783, "page": 216, "area": "The Bleachers", "boulder": "Beige is All the Rage", "name": "HYMEN GORILLAS", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "We have no idea either. Start left of Beige is All the Rage on the rail on the prow (no low boulders for feet), up arete. Chook Betts", "printed_number": "42", "grade_note": null, "photo": "photos/216-1.jpg"}, {"id": 529, "page": 150, "area": "Trackside", "boulder": "Love Boulder", "name": "IGNORANCE RAINS", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Climb the fairly unattractive highball slab between Child of Love and Sexy as a Turd. Gardening required.", "printed_number": "41", "grade_note": null, "photo": null}, {"id": 854, "page": 231, "area": "Valley of the Giants", "boulder": "Big Bastard", "name": "ILLEGITIMATE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "From the undercling bust straight up blunt arete to sloping ledge. Drop off with hands on ledge.", "printed_number": "16", "grade_note": null, "photo": null}, {"id": 334, "page": 93, "area": "Rambla Wall", "boulder": null, "name": "IMPACT ZONE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "A tourist presumably. Sit start on pockets and a gaston flake. Climb straight up the crack feature to top out.", "printed_number": "7", "grade_note": null, "photo": "photos/093-1.jpg"}, {"id": 443, "page": 129, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "INNOCENCE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "A classic. Sit start at the base of the leaning arete and climb leftwards up the line of slopers and flakes.", "printed_number": "7", "grade_note": null, "photo": "photos/129-3.jpg"}, {"id": 1153, "page": 298, "area": "Buandik / Far Out", "boulder": "Rule No. One Boulder", "name": "ITALIAN STALLIONS", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Climbs the left side of the gully-cave. Stand start on pockets, traverse left on more pockets to the crack and then massive jugs on the outside of the gully. Drop off. Ross Taylor", "printed_number": "17", "grade_note": null, "photo": "photos/298-1.jpg"}, {"id": 151, "page": 56, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "JARGON", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sharp and painful. Stand start with the juggy flake in roof just below the arching seam and rooflet on small edges. Make a big move to the lip and up or to mantle. Make a long move to an edge gaston and top out.", "printed_number": "36", "grade_note": null, "photo": "photos/057-2.jpg"}, {"id": 1129, "page": 292, "area": "Buandik / Got Lost", "boulder": "Mini Rigs", "name": "JEO", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Sit start on the chalked rail and finish past the big jug. Miriam Perschmann", "printed_number": null, "grade_note": null, "photo": null}, {"id": 645, "page": 184, "area": "Mt Stapylton", "boulder": null, "name": "KEINEN PLAN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Good. Sit start on the right side of the face on the horizontal seam and slopey pocket. Finish in the juggy pocket. Gordon Poultney", "printed_number": "15", "grade_note": null, "photo": "photos/181-2.jpg"}, {"id": 879, "page": 233, "area": "Valley of the Giants", "boulder": "Mini Giant Boulders", "name": "KETTLE LICKER", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Climb the low crack and bulging face just right of the arete. Ross Taylor", "printed_number": "41", "grade_note": null, "photo": null}, {"id": 1262, "page": 327, "area": "Windowlicker Area", "boulder": "Crown Boulder", "name": "KNELL'S STINK THEORY", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Best not to ask. Below the black face is an obvious flat rock that moves. Sit start in front of it and climb the face above. Ross Taylor", "printed_number": "6", "grade_note": null, "photo": "photos/326-1.jpg"}, {"id": 766, "page": 213, "area": "The Bleachers", "boulder": "Blackbeard's Boulder", "name": "LADY'S NIGHT", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "On the backside, sit start on left then head right on low rail and slopers, exit past the bulging fin.", "printed_number": "25", "grade_note": null, "photo": "photos/112-473.jpg"}, {"id": 13, "page": 34, "area": "Andersens / Amnesty", "boulder": "BREMBO BOULDER", "name": "LATERALUS", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Lateralus literally lunges left into Brembo. Sit start low on flakes 1m left of the arete and head up left into Brembo.", "printed_number": "13", "grade_note": null, "photo": "photos/033-1.jpg"}, {"id": 724, "page": 205, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "LEFT ZANE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Insane for the Zane? Sit start as for Far Left Zane. Move out right along the crack and up on edges and pockets. Finish as for Grapevine Crack.", "printed_number": "4", "grade_note": null, "photo": "photos/204-1.jpg"}, {"id": 57, "page": 41, "area": "Andersens / Left Main", "boulder": "Tim Tam Boulder (inferred)", "name": "LEG OVER", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start on the obvious sloper and make a tricky mantle. Somehow it's fun.", "printed_number": "35", "grade_note": null, "photo": "photos/041-3.jpg"}, {"id": 1191, "page": 311, "area": "Love Triangle", "boulder": "The Sun Deck", "name": "LEGS ELEVEN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Stand start underclinging big hanging block. Up to high rail, then left to the finish jug of Leg Spread Arete.", "printed_number": "19", "grade_note": null, "photo": "photos/311-1.jpg"}, {"id": 559, "page": 156, "area": "Trackside", "boulder": "Upper Cave Wall", "name": "LO JACK", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Sit start on the block 1m right of Jumping Jack with a low incut flake and then jump. Top out on pockets.", "printed_number": "71", "grade_note": null, "photo": null}, {"id": 769, "page": 214, "area": "The Bleachers", "boulder": "Nicholas Cage Memorial Face", "name": "LORD OF WAR", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The right arete is climbed from a sit, finishing slightly left. Chook Betts", "printed_number": "28", "grade_note": null, "photo": "photos/214-1.jpg"}, {"id": 532, "page": 151, "area": "Trackside", "boulder": "Love Boulder", "name": "LOVE LIES BLEEDING", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "Bad relationships are the worst. Sit start on the low break 2m right of the Sexy Direct arete. Slap up to the sloper and out to a jug. Traverse up and left on good holds to finish up Sexy as a Turd.", "printed_number": "44", "grade_note": null, "photo": null}, {"id": 86, "page": 45, "area": "Andersens / Left Main", "boulder": "Lygon St Boulder", "name": "LYGON ST MASSACRE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "An absolute classic for the grade. Sit start low on a crimp and incut edge. Climb the central line up the technical slab to top out over its peak. Gav Portier", "printed_number": "64", "grade_note": null, "photo": "photos/045-1.jpg"}, {"id": 1232, "page": 320, "area": "Tower Proper", "boulder": "Time Lapse Terrace", "name": "MAN IN BLACK", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "From the obvious flat-top jug and undercling, climb right on good holds all the way to the juggy lip. Simon Weill", "printed_number": "38", "grade_note": null, "photo": "photos/320-1.jpg"}, {"id": 7, "page": 32, "area": "Andersens / Amnesty", "boulder": "UPPER GUNN BUTTRESS", "name": "MINUTE MAN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Better than average? Start on good holds 2m left of the arete and make long moves up the face to a high finish.", "printed_number": "7", "grade_note": null, "photo": "photos/020-010.jpg"}, {"id": 123, "page": 52, "area": "Andersens / Right Main", "boulder": "Snowflake Boulder", "name": "MISTY PEAKS", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Stand start with a slopey rail 1m left of the crack and climb the featured face and sloping arete to top out. Careful of the rock garden waiting below.", "printed_number": null, "grade_note": null, "photo": "photos/052-3.jpg"}, {"id": 1297, "page": 332, "area": "Windowlicker Area", "boulder": "Sun Arete Boulder", "name": "MOONRISE KINGDOM", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Stand start 1m left of Sun Arete, straight up slab.", "printed_number": "41", "grade_note": null, "photo": "photos/332-1.jpg"}, {"id": 900, "page": 237, "area": "Valley of the Giants", "boulder": "High face to the right of Pinch & A Punch (Barbara Cartland names)", "name": "NO DARKNESS FOR LOVE", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The slopey arete has a high mantel top out that asks a few questions.", "printed_number": "62", "grade_note": null, "photo": "photos/237-2.jpg"}, {"id": 41, "page": 39, "area": "Andersens / Left Main", "boulder": "GAS BOULDER", "name": "ONCE REMOVED", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The easiest way up the main face. Stand start on good holds, up to break, move left and up to another smaller break, left again at top.", "printed_number": "19", "grade_note": null, "photo": "photos/039-1.jpg"}, {"id": 760, "page": 212, "area": "The Bleachers", "boulder": "Dovai Ray (hidden chamber)", "name": "OPEN BOX", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Start as for Camilla Park Your Balls, but instead climb right on small edges, then up to a slopey finish. Chook Betts", "printed_number": "19", "grade_note": null, "photo": null}, {"id": 613, "page": 175, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "ORANGE GOBLIN", "grade_raw": "V3", "grade_num": 3, "pictured": 0, "description": "The large flake on the left hand side of the wall. Start at the left end of the break and traverse rightwards and out to the vertical flake in the roof. Finish when the flake ends.", "printed_number": "6", "grade_note": null, "photo": null}, {"id": 1282, "page": 330, "area": "Windowlicker Area", "boulder": "Gully proper (chasm)", "name": "ORIENTAL SHIT SCARED", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Stand start on right side of the lip of chasm. Climb thin rib to ledge. Simon Weill", "printed_number": "26", "grade_note": null, "photo": "photos/330-1.jpg"}, {"id": 447, "page": 129, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "PACMAN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sit start to the right of Charlie's Sex Tour on right-slanting holds and traverse onto the lower line of slopers. Finish up into Bubble Trouble.", "printed_number": "11", "grade_note": null, "photo": "photos/129-3.jpg"}, {"id": 506, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "PARANOIAC CRITICAL TOWN", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "Sandstone climbing at its finest. Sit start at the base of the blunt arete below the double pockets and climb up on consistently lovely holds to the top.", "printed_number": "18", "grade_note": null, "photo": "photos/148-3.jpg"}, {"id": 754, "page": 212, "area": "The Bleachers", "boulder": "Dovai Ray (hidden chamber)", "name": "PENNY ROYAL TEA", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "The arete on the right side of the gap. Sit start then up on nice slopers. Chook Betts", "printed_number": "13", "grade_note": null, "photo": "photos/212-1.jpg"}, {"id": 561, "page": 157, "area": "Trackside", "boulder": "Peregrinator Boulder", "name": "PEREGRINATOR", "grade_raw": "V3", "grade_num": 3, "pictured": 1, "description": "An amazing sharp grey overhanging highball arete looming over a landing that may leave you in hospital. Start low on the arete on slopey side-pulls. Move up the arete to the small break and continue on edges and pinches to mantle at the nose. A soft variant bails up the face early to finish up the Juggy break.", "printed_number": "73", "grade_note": null, "photo": "photos/089-371.jpg"}, {"id": 865, "page": 232, "area": "Valley of the Giants", "boulder": "Unnamed boulder beside Taken (see notes)
