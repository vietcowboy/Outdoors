ival", "printed_number": "16", "grade_note": null, "photo": "photos/250-4.jpg"}, {"id": 371, "page": 103, "area": "Hollow Mountain Cave", "boulder": null, "name": "SLEEPY HOLLOW", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Fred's greatest contribution to Oz climbing. Start matched on the good flat hold (finish of X-treme Cool) and climb directly through the roof via pockets to crimpy rails. Follow the line of holds out through some tough moves to finish on the obvious jugs. Fred Nicole", "printed_number": "12", "grade_note": null, "photo": "photos/101-2.jpg"}, {"id": 1001, "page": 258, "area": "BUANDIK / MADE IT", "boulder": "HILLARY STEP", "name": "SLIPPERY SLOPE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Don't be a backslider. Stand start on good edge up and slightly left. Nalle Hukkataival", "printed_number": "3", "grade_note": null, "photo": "photos/264-3.jpg"}, {"id": 639, "page": 181, "area": "Mt Stapylton", "boulder": null, "name": "TANATHOS", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Pumper. Start as for Strammamax and climb into the long move of Endamax to good holds in the roof. Traverse right with big moves to finish up Lost For Life. Dai Koyamada", "printed_number": "9", "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 375, "page": 106, "area": "Hollow Mountain Cave", "boulder": null, "name": "THE AMAZING SOUNDS OF A SHE-MALE SQUEALING", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "We would love to know where the name comes from. Links Easy Does It into Aphrodite into Sleepy Hollow. Sharik Walker", "printed_number": "16", "grade_note": null, "photo": null}, {"id": 466, "page": 133, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "THE WHEEL OF FORTUNE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Full value bouldering. The all-inclusive linkup is even more of a pumper than the Weill of Fortune. Climb Spanking the Monkeybars then reverse A Horse is A Horse. Continue right to finish up the Nevin Rule. That's a lot of climbing. Nathan Hoette", "printed_number": "30", "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 550, "page": 155, "area": "Trackside", "boulder": "The Wave Room", "name": "WAVE ROCK", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "The stunning wall of bizarre sweeping angles has now been climbed. Start on the slopey rail in the middle of the wall. Make a big move to a good pocket then up to incut edges before making a committing move left to a big slot and a pocket near the lip. Kilian Fischhuber", "printed_number": "62", "grade_note": null, "photo": "photos/155-1.jpg"}, {"id": 631, "page": 178, "area": "Mt Stapylton", "boulder": "Ammagamma Boulder", "name": "AMMAGAMMA", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "One of the best anywhere. Sit start with your LH on arete and RH in the lowest scoop underneath the undercling. Move up to the pocket and into the undercling. Make a big move up right to the side-pull and follow the pockets to a tricky mantle into the ramp. Klem Loskot", "printed_number": null, "grade_note": null, "photo": "photos/178-1.jpg"}, {"id": 1155, "page": 298, "area": "Buandik / Far Out", "boulder": "Rule No. One Boulder", "name": "BOREDOM", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Is putting up multiple V13s... Stand start on the far right on the side-pull and traverse left, finishing as for Rule No One. Nalle Hukkataival", "printed_number": "19", "grade_note": null, "photo": "photos/298-1.jpg"}, {"id": 1060, "page": 276, "area": "VICTORIA RANGE", "boulder": "CHERRY PICKING BOULDER", "name": "CHERRY PICKING", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Surely amongst the very best problems in the world, with the rock, the position and the moves. Stand start on two-handed jug in the cave at the far end of the boulder. Left to crimp, right to more crimps. Hail Mary to side-pull. Lock down for the smack down, finishing up the high but relenting slab to a glorious view. Nalle Hukkataival", "printed_number": "62", "grade_note": null, "photo": "photos/276-3.jpg"}, {"id": 384, "page": 107, "area": "Hollow Mountain Cave", "boulder": null, "name": "EVE REVE", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Links Cave Man into Dead Can't Dance exiting as for Dead Can't Dance (same as Amniotic World). Fred Nicole", "printed_number": "25", "grade_note": null, "photo": null}, {"id": 641, "page": 181, "area": "Mt Stapylton", "boulder": null, "name": "LOST FOR LIFE LOW START", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Dai Koyamada somehow managed an even lower start to Lost for Life. Start on underclings under the roof and move into Lost For Life.", "printed_number": null, "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 433, "page": 122, "area": "Hollow Mountain", "boulder": "Project Wall", "name": "MANA", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "The most impressive line on the wall is blessed with an evocative name. Sit start with a LH undercling and a small RH one finger pocket or sharp edge. Dynamic deadpoints to holds in the crack and face lead to easier climbing near the top. Sometimes small birds nest in a hole towards the top of the problem. If this is the case then please use other holds and try not to disturb them. Dai Koyamada", "printed_number": "5", "grade_note": null, "photo": "photos/122-1.jpg"}, {"id": 560, "page": 157, "area": "Trackside", "boulder": "Project Boulder", "name": "ON THE BEACH", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "A killer line on great rock in an exposed position. For a long time climbers have walked beneath it wondering if it is possible on their way up to Taipan Wall. Sit start on the juggy hueco just within the right side of the cave. Climb out to a sloper and edge and make some long moves up the face. Dave Graham", "printed_number": "72", "grade_note": null, "photo": "photos/089-370.jpg"}, {"id": 646, "page": 184, "area": "Mt Stapylton", "boulder": "Pigeon Superstition", "name": "PIGEON SUPERSTITION", "grade_raw": "V13", "grade_num": 13, "pictured": 0, "description": "A short, tight, slopey, hard problem on a boulder just north of Ammagamma. Start at the left end of the horizontal break. Up on poor slopers and then straight up past marginal gastons and side-pulls to jug and top. Nalle Hukkataival", "printed_number": "16", "grade_note": null, "photo": "photos/181-1.jpg"}, {"id": 388, "page": 107, "area": "Hollow Mountain Cave", "boulder": null, "name": "PRETTY HATE MACHINE", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Matt's finest hour, apart from climbing Dead Can't Dance in a mini skirt. Links Cave Bitch into Dead Can't Dance, exiting Rave Heart, Matt Wrigley. There's a variant (V13) that links Cave Bitch into Dead Can't Dance, exiting as for Dead Can't Dance.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1154, "page": 298, "area": "Buandik / Far Out", "boulder": "Rule No. One Boulder", "name": "RULE NO. ONE", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Start on undercling with footledge. Jump to rail and climb overhanging face to ledge. Jump back down from ledge. Nalle Hukkataival", "printed_number": "18", "grade_note": null, "photo": "photos/298-1.jpg"}, {"id": 382, "page": 107, "area": "Hollow Mountain Cave", "boulder": null, "name": "SLEEPY MAN", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "You will be tired at the end. Links Sleepy Hollow into Cave Man. Dai Koyamada", "printed_number": "23", "grade_note": null, "photo": null}, {"id": 364, "page": 102, "area": "Hollow Mountain Cave", "boulder": null, "name": "STIMULATION", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Perfect for contortionists. Start matched on the slopey shelf 2m right of Silverchair. Make a big move back to gaston slopers and climb through the roof 3m left on several flakelines, ripples and slopers to finish back down on the big slopey finishing rail of Silverchair. James Kassay", "printed_number": "5", "grade_note": null, "photo": "photos/102-1.jpg"}, {"id": 366, "page": 103, "area": "Hollow Mountain Cave", "boulder": null, "name": "STUCK SOUTH OF THE BORDER", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Start at Stimulation and climb straight back on thin edges and slopers and drop down to meet Sleepy Hollow at its rest holds. Finish as for Sleepy Hollow. Richard Sticky Dale", "printed_number": "7", "grade_note": null, "photo": "photos/102-1.jpg"}, {"id": 663, "page": 187, "area": "Mt Stapylton", "boulder": "Caves Club", "name": "SULTAN OF SWING", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Accidental visionaries, Chris and Dave, put this one as a project in the first edition of the guide thinking that it wasn't actually possible... Sit start on the right side of the cave with a pocket for the RH and the arete for the LH. Make a big move up and left to a rib, before busting back right to gain a shouldery crimp. Follow the blunt arete rightward to the finish. Alex Megos", "printed_number": null, "grade_note": null, "photo": "photos/187-1.jpg"}, {"id": 372, "page": 103, "area": "Hollow Mountain Cave", "boulder": null, "name": "UNDER SIEGE", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Describes Sharik's mental state at the time? Links X-treme Cool into Sleepy Hollow. Sharik Walker", "printed_number": "13", "grade_note": null, "photo": null}, {"id": 376, "page": 106, "area": "Hollow Mountain Cave", "boulder": null, "name": "X-TREME SQUEALING", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Sounds terrifying. Links X-treme Cool into Easy Does It into Aphrodite into Sleepy Hollow. Dai Koyamada", "printed_number": "17", "grade_note": null, "photo": null}, {"id": 595, "page": 168, "area": "Mt Stapylton", "boulder": "Lower Taipan", "name": "ZEUS", "grade_raw": "V13", "grade_num": 13, "pictured": 1, "description": "Sam's hardest addition to the Grampians and easily the most popular problem here. Start matched on a flat crimp. Move out to LH pocket and climb the line of pockets and crimps right to the jug just below the bolt. Sam Edwards", "printed_number": "1", "grade_note": null, "photo": null}, {"id": 1149, "page": 297, "area": "Buandik / Far Out", "boulder": "Rootarded Boulder", "name": "IL MANCINO DE BRISTOL", "grade_raw": "V14", "grade_num": 14, "pictured": 1, "description": "From a sit start, climb the right leading rib on the left edge of the overhang to a thin, tricky exit onto the slab above. Niky Ceria", "printed_number": "13", "grade_note": null, "photo": "photos/298-4.jpg"}, {"id": 1034, "page": 270, "area": "VICTORIA RANGE", "boulder": "MASSIVE DYNAMIC BOULDER", "name": "MASSIVE DYNAMIC", "grade_raw": "V14", "grade_num": 14, "pictured": 1, "description": "Looks outrageous. Stand start on side-pulls leads to a massive dynamic move and a very high top out. Nalle Hukkataival", "printed_number": "36", "grade_note": null, "photo": "photos/270-2.jpg"}, {"id": 1064, "page": 277, "area": "BUANDIK / MADE IT", "boulder": "THE PISSOIR", "name": "OCCAM'S RAZOR", "grade_raw": "V14", "grade_num": 14, "pictured": 1, "description": "Cut through the shit. Short and powerful. Start on the western end of the boulder. Climb out little cave on slopey pinches and edges, finishing left. Nalle Hukkataival", "printed_number": "66", "grade_note": null, "photo": "photos/277-3.jpg"}, {"id": 1033, "page": 270, "area": "VICTORIA RANGE", "boulder": "MASSIVE DYNAMIC BOULDER", "name": "RIGHT THURR", "grade_raw": "V14", "grade_num": 14, "pictured": 1, "description": "Looks as tricky as a slurring pirate. Sit start on the small slopey edges just left of arête, make some punchy moves up and slight left, finishing right as it eases. Nalle Hukkataival", "printed_number": "35", "grade_note": null, "photo": "photos/270-2.jpg"}, {"id": 1127, "page": 292, "area": "Buandik / Got Lost", "boulder": "Brushing For boulder", "name": "THE WORLD IS NOT FLAT", "grade_raw": "V14", "grade_num": 14, "pictured": 1, "description": "It may not be flat, but at least you can flatten it into a good landing. At the time of writing this is unrepeated despite the attentions of the strong global elite - could be/probably is V15. Stand start from a RH triangle pinch and pocket, move up and right, then arc gracefully rightwards across the scoop to a high finish. Nalle Hukkataival", "printed_number": "55", "grade_note": null, "photo": "photos/011-001.jpg"}, {"id": 1151, "page": 298, "area": "Buandik / Far Out", "boulder": "Knowing Is Half The Battle Boulder (large orange wall)", "name": "ROAD SWEET HOME", "grade_raw": "V15", "grade_num": 15, "pictured": 1, "description": "The hardest problem at Buandik climbs the left edge of the big face. Stand start off small crimp to break, right up seam then straight up to very high finish to the left. Nalle Hukkataival", "printed_number": "15", "grade_note": null, "photo": "photos/298-2.jpg"}, {"id": 385, "page": 107, "area": "Hollow Mountain Cave", "boulder": null, "name": "SLEEPY RAVE", "grade_raw": "V15", "grade_num": 15, "pictured": 1, "description": "Links Sleepy Hollow into Cave Man into Dead Can't Dance exiting Rave Heart. Dai Koyamada", "printed_number": "26", "grade_note": null, "photo": null}, {"id": 367, "page": 103, "area": "Hollow Mountain Cave", "boulder": null, "name": "STIMULATING CARTWHEEL", "grade_raw": "V15", "grade_num": 15, "pictured": 1, "description": "This is what happens when a world-class climber gets stuck at the Hollow Mountain Cave when it rains for two weeks. Begin as for Stuck South of the Border, joining the Wheel of Life at Sleep Hollow and finishing as for the Wheel. Alex Megos", "printed_number": "8", "grade_note": null, "photo": null}, {"id": 386, "page": 107, "area": "Hollow Mountain Cave", "boulder": null, "name": "THE WHEEL OF LIFE", "grade_raw": "V15", "grade_num": 15, "pictured": 1, "description": "The ultimate roof problem. It travels the entire cave from the base to the top through 60 or so moves. Climb X-treme Cool into Sleepy Hollow into Cave Man into Dead Can't Dance exiting Rave Heart. Dai Koyamada. The Wheel of Life Direct (V15), climbs the Wheel but finishes up Amniotic World. James Kassay", "printed_number": "27", "grade_note": null, "photo": null}, {"id": 387, "page": 107, "area": "Hollow Mountain Cave", "boulder": null, "name": "WHEELCHAIR", "grade_raw": "V15", "grade_num": 15, "pictured": 1, "description": "Climbed the Wheel of Life and wondering what is next? Climb the Wheel of Life but halfway through Sleepy Hollow traverse left into Stimulation, climbing the whole of Stimulation (with the exception of the first move). Alex Megos", "printed_number": null, "grade_note": null, "photo": null}];

  const q = document.getElementById("q").value.trim().toLowerCase();
  const area = document.getElementById("area").value;
  const pic = document.getElementById("pic").value;
  const gmin = +minSlider.value, gmax = +maxSlider.value;
  const fullRange = gmin === GRADE_MIN && gmax === GRADE_MAX;
  // Projects have no grade, so they only show when the slider spans the whole range.
  let r = DATA.filter(d =>
    (!area || d.area === area) &&
    (d.grade_num == null ? fullRange : (d.grade_num >= gmin && d.grade_num <= gmax)) &&
    (pic === "" || (pic === "1") === !!d.photo) &&
    (!q || [d.name, d.area, d.boulder, d.description].join(" ").toLowerCase().includes(q)));
  // Primary sort by the chosen column; ties by grade, then name, so the order stays stable.
  r.sort((a, b) => (cmp(a, b, sortKey) * dir) || cmp(a, b, "grade_num") || cmp(a, b, "name"));
  return r;
}
function render() {
  const r = rows();
  document.getElementById("count").textContent = `${r.length} climb${r.length === 1 ? "" : "s"}`;
  document.querySelectorAll("th[data-k]").forEach(th => {
    const on = th.dataset.k === sortKey;
    th.classList.toggle("on", on);
    th.querySelector(".arrow") && (th.querySelector(".arrow").textContent = on ? (dir === 1 ? "▲" : "▼") : "⇅");
  });
  document.getElementById("body").innerHTML = r.map((d, i) => `
    <tr>
      <td class="grade">${esc(d.grade_raw)}${d.grade_note ? `<div class="flag">${esc(d.grade_note)}</div>` : ""}</td>
      <td>${esc(d.name) || '<em>(unnamed project)</em>'}${d.pictured === 0 ? ' <span class="flag">not pictured</span>' : ""}</td>
      <td>${esc(d.area)}</td>
      <td class="sub">${esc(d.boulder)}</td>
      <td>${d.page ?? ""}</td>
      <td class="desc">${esc(d.description)}</td>
      <td>${d.photo ? `<button class="ph" data-photo="${esc(d.photo)}" data-name="${esc(d.name)}">View photo</button>` : ""}</td>
    </tr>`).join("");
}
document.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.k;
  if (sortKey === k) dir *= -1; else { sortKey = k; dir = 1; }
  render();
}));
document.getElementById("body").addEventListener("click", e => {
  const b = e.target.closest(".ph"); if (!b) return;
  document.getElementById("mimg").src = b.dataset.photo;
  document.getElementById("mimg").alt = b.dataset.name;
  document.getElementById("modal").classList.add("open");
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("area").addEventListener("change", render);
document.getElementById("pic").addEventListener("change", render);
render();
</script></body></html>
