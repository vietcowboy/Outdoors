6", "grade_note": null, "photo": "photos/146-1.jpg"}, {"id": 459, "page": 130, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "SPANKING THE MONKEYBARS", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Classic and solid at the grade. Sit start low on the good blocky feature. Move up to the Monkeybar hold and out to a hueco and sloper. Make a long move out left to a slopey pinch and up to pockets before throwing back right to finish matched at the left end of the long slopey ledge. Dave Jones", "printed_number": null, "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 461, "page": 133, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "SPANKING THE MONKEYBARS DIRECT", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Climb Spanking the Monkeybars to the large sloper above the hueco and make a big move (or dyno) to finish on the long slopey ledge.", "printed_number": "25", "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 129, "page": 53, "area": "Andersens / Right Main", "boulder": "Snowflake Boulder (inferred)", "name": "SPANNER", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Sit start on an undercling in the back of the low cave, Make a huge span to the lip of the cave. Roll out and onto the slab. Top out. Julian Saunders", "printed_number": "14", "grade_note": null, "photo": "photos/052-2.jpg"}, {"id": 1185, "page": 311, "area": "Love Triangle", "boulder": "Stolen Boulder", "name": "STOLEN", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The obvious high arete was originally Wayne from Wodonga's project before it was cruelly stolen. Start on low pocket, finish left around arete at top (carefully). Has been climbed right through roof, which looks terrifying. Simon Weill", "printed_number": "13", "grade_note": null, "photo": "photos/310-2.jpg"}, {"id": 606, "page": 171, "area": "Mt Stapylton", "boulder": "Wildsides", "name": "SWEET SENSATIONS", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Start as for the Beginnings of a Great Adventure, but trend right onto small flakes on the top of the shield feature and make a big move from an undercling to the ledge.", "printed_number": "4", "grade_note": null, "photo": null}, {"id": 278, "page": 80, "area": "Andersens / Clicke", "boulder": "3 Star Buttress", "name": "TECHNO DRONE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Start on horizontal seam just left of the orange streak. Reach over the bulge and up seams.", "printed_number": "38", "grade_note": null, "photo": "photos/080-3.jpg"}, {"id": 100, "page": 48, "area": "Andersens / Left Main", "boulder": "Cave behind Tickity Boo (inferred)", "name": "TESTOSTROGEN", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Start on the good flat holds at the arete and move out left under the overhang to the good incut edge. Make a big move left and traverse underneath the chockstone to hard exit moves before the mantle (chockstone is off limits). Julian Saunders", "printed_number": null, "grade_note": null, "photo": "photos/047-1.jpg"}, {"id": 1175, "page": 309, "area": "Love Triangle", "boulder": "Love Boulder", "name": "THE ARNOLD", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Short but handsome in the right light. Stand start with LH on side-pull below the little arete (of Arnie Luvs Arnie) and RH edge, finishing as for Arnie Luvs Arnie. Simon Weill", "printed_number": "3", "grade_note": null, "photo": "photos/309-3.jpg"}, {"id": 1132, "page": 293, "area": "Buandik / Got Lost", "boulder": "European Dream cave", "name": "THE EUROPEAN DREAM", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Unification? Nationalism? It's hard to keep up during these times of tumult, but this is one of Nalle's favourite FAs in all of Oz. From a stand start climb the high black face on your left as you exit the cave. Nalle Hukkataival", "printed_number": "60", "grade_note": null, "photo": "photos/292-3.jpg"}, {"id": 1171, "page": 301, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "THE JIMMY HANDRIX EXPERIENCE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Pumper. Start at the Pummelling and cross the cave diagonally (keeping fairly low), finishing as for Underhanded Tactics. Mattias Braach Maksvytis", "printed_number": null, "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 549, "page": 155, "area": "Trackside", "boulder": "Orphan Boulders", "name": "THE OYSTER", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Looks nice. Sit start on a good edge under the right arete. Climb up left on good holds to a cruxy move and good top out over the pointy landing. Pete Reynolds", "printed_number": "61", "grade_note": null, "photo": "photos/155-2.jpg"}, {"id": 1245, "page": 323, "area": "The Tower", "boulder": "Backside Terraces", "name": "THE POISON", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Perfect orange sandstone. Sit start on low edge, then make a series of gymnastic moves up on slopey side-pulls to high and tricky conclusion. Weill", "printed_number": "51", "grade_note": null, "photo": "photos/323-2.jpg"}, {"id": 1220, "page": 318, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "THE RAVEN TAKES FLIGHT", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Essentially a slightly contrived (but excellent) variant on 9.1. Climb as for 9.1 but finish slightly left on slopers. Pete Reynolds", "printed_number": "26", "grade_note": null, "photo": "photos/318-2.jpg"}, {"id": 1095, "page": 285, "area": "Buandik / Got Lost", "boulder": "Skull boulder (name not printed)", "name": "THE SKULL DIRECT", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Sit start in the cave just to the right of the small boulder (with the skull sitting on it) and climb out the overhanging face. Jochen Perschmann", "printed_number": "23", "grade_note": null, "photo": "photos/285-3.jpg"}, {"id": 9, "page": 33, "area": "Andersens / Amnesty", "boulder": "UPPER GUNN BUTTRESS (inferred)", "name": "THOUGHTS OF A DYING ATHEIST", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Killer high prow that requires creative pad work over the tree. Climb the steep end buttress. Stand start on the horizontal edge/seam at the right of the face. Climb left and up on edges and incuts to a high top out (watch out for friable holds). Pat Reynolds", "printed_number": "9", "grade_note": null, "photo": "photos/032-1.jpg"}, {"id": 54, "page": 41, "area": "Andersens / Left Main", "boulder": "Tim Tam Boulder (inferred)", "name": "TIM TAM MANTLE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Tough. From a sit start on edges climb up to lip and difficult mantle. Dave Jones", "printed_number": "32", "grade_note": null, "photo": "photos/040-1.jpg"}, {"id": 524, "page": 150, "area": "Trackside", "boulder": "Love Boulder", "name": "TO HATE TO LOVE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The burly twin of Ministry of Love. Sit start on the off-angle slopey rail and head left to the slot and jug. Traverse the overhang right on pockets to a sloper and edges before a tricky top out. Dave Jones", "printed_number": "36", "grade_note": null, "photo": "photos/150-3.jpg"}, {"id": 1053, "page": 275, "area": "BUANDIK / MADE IT", "boulder": "THE EYRIE (wall below Balazar)", "name": "TUNNEL VISION LEFT", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "A touch of peripheral vision. Same start but finish left on knobbly crimps. Doesn't look much easier.", "printed_number": "55", "grade_note": null, "photo": "photos/275-1.jpg"}, {"id": 1180, "page": 310, "area": "Love Triangle", "boulder": "Madness Boulder", "name": "VERDUN", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "From the start of Cannon Fodder climb the flake all the way right until you can top out onto the same ledge as Cannon Fodder. Simon Weill", "printed_number": "8", "grade_note": null, "photo": null}, {"id": 844, "page": 230, "area": "Valley of the Giants", "boulder": "Valley of Wads Boulder", "name": "VILLAGE OF THE DAMNED", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Could be a reference to Nati. Sit start off double underclings 2m left of Valley of the Wads. Make a couple of hard moves up through the bulge. Scramble off left. Simon Weill", "printed_number": "6", "grade_note": null, "photo": null}, {"id": 170, "page": 60, "area": "Andersens / Right Main", "boulder": "The Wailing Wall", "name": "WAILING WALL", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Old school hard. Stand start on the shallow pockets and move up the wall on fingery and technical moves.", "printed_number": "55", "grade_note": null, "photo": "photos/060-1.jpg"}, {"id": 419, "page": 115, "area": "Loopeys", "boulder": null, "name": "WINTERKIRSCH", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Sit start at Bitch Slap and traverse the really low line of holds 3m right and then up to a tricky topout near the corner of the wall. Keeping your butt off the ground is near impossible for people over 4ft tall.", "printed_number": null, "grade_note": null, "photo": "photos/115-1.jpg"}, {"id": 705, "page": 201, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "WORM SALOON", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Great. Sit start on the crimp/pinch feature and head through the slopers and underclings under the right slide of the roof, traverse the lip leftwards to finish as for Minus. Will Detmold", "printed_number": "24", "grade_note": null, "photo": "photos/201-3.jpg"}, {"id": 552, "page": 156, "area": "Trackside", "boulder": "100 Pint Wall", "name": "100 PINT CLUB", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "A big dyno with not much room to generate power. Sit start on the block just right of the arete with a good rail. Make a huge dyno all the way to the incut edge and finish just left on the jug. Klem Loskot", "printed_number": null, "grade_note": null, "photo": "photos/156-4.jpg"}, {"id": 389, "page": 107, "area": "Hollow Mountain Cave", "boulder": null, "name": "AMNIOTIC WORLD", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Absolute classic. Sit start on the RH side of the good sloper pinch where the flakelines converge (2m right of the Dead Can't Dance pinch). Move out left to a pocket in the rib and another in the roof and traverse left to the large slopey pod. Finish as for Wimmel Friedhoff. Julian Saunders. If you start 2m to the right, it's Extended World. Klem Loskot. Starting at the slopey pod makes for a nice V6.", "printed_number": "30", "grade_note": null, "photo": "photos/107-1.jpg"}, {"id": 379, "page": 106, "area": "Hollow Mountain Cave", "boulder": null, "name": "ANNAGRAMMA", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Probably the most strenuous V9 in a cave not short of strenuous lines. Start matched in an obvious pocket beyond the bottom end of the flakeline/weakness used by Cave Man. Make some burly moves to gain the flake and pockets. Follow the line through the flakeline to finish up Cave Man. Thomas Willenberg", "printed_number": "20", "grade_note": null, "photo": "photos/106-2.jpg"}, {"id": 1015, "page": 267, "area": "BUANDIK / MADE IT", "boulder": "BARON BOULDER", "name": "BARON DANGLAR", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Sweet. The middle line starts on low slopers (at the bottom of the crack) then head straight up to the crux move to bad slopers on the lip. Stephen Waring", "printed_number": "17", "grade_note": null, "photo": "photos/267-1.jpg"}, {"id": 273, "page": 79, "area": "Andersens / Clicke", "boulder": "Bridesmaid Wall", "name": "BRIDESMAIDS ANONYMOUS", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "The longest pumper of the wall and the zenith of Jules' addiction to the art of moving laterally. Start as for Running Man and finish up Last Waltz. Julian Saunders", "printed_number": "33", "grade_note": null, "photo": "photos/079-1.jpg"}, {"id": 706, "page": 201, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "BUTTHOLE SURFER", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "A strong core helps. Sit start on the low rail and head straight out the roof on underclings to big moves up the face to the glory jugs. Classic test piece of the area. Ton! Lamprecht", "printed_number": "25", "grade_note": null, "photo": "photos/201-3.jpg"}, {"id": 1179, "page": 310, "area": "Love Triangle", "boulder": "Madness Boulder", "name": "CANNON FODDER", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "More route than boulder problem, although the ground follows up behind you. To the right of the Madness Project is a cave. From the juggy flake in the little stone corridor climb straight out the steep roof above on small crimps past the sickle weakness. Finish between the two boulders, topping out on a ledge. Simon Weill", "printed_number": "7", "grade_note": null, "photo": "photos/309-2.jpg"}, {"id": 1274, "page": 329, "area": "Windowlicker Area", "boulder": "Windowlicker Terraces", "name": "CAPTAINS OF CRUSH", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "A fitting ode to the dog-eat-dog hierarchy of a very rag tag army. Climb the high, beautiful arete from a stand start. The sit start remains a coveted project. Reuben Louis 'Rube Goldberg Machine' Bennett-Daly", "printed_number": "18", "grade_note": null, "photo": null}, {"id": 377, "page": 106, "area": "Hollow Mountain Cave", "boulder": null, "name": "CAVE MAN", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "A study in body tension. Start on the jug flakes at the end of Sleepy Hollow. Move back to a flake and good pocket in the roof to make a big span to a slot in the long flakeline or climb around the span via some shorter moves into lower on the flakeline. Move back out to the lip of the long, wavey rib and climb right all the way to finish on juggy flakes just before the pinch move of Dead Can't Dance. The method of avoiding the span used to be called Cave Girl, but let's be honest: it's just as hard and effectively the same problem. Klem Loskot", "printed_number": "18", "grade_note": null, "photo": "photos/106-2.jpg"}, {"id": 734, "page": 207, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "COLLISION COURSE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Sit start on the double underclings just to the right of the broken flakeline. Wrestle up to the rail and then break right to finish by Drowning Dicaprio. Paul Westwood", "printed_number": "14", "grade_note": null, "photo": "photos/206-3.jpg"}, {"id": 403, "page": 112, "area": "Loopeys", "boulder": null, "name": "CRIMPY CATERPILLAR", "grade_raw": "V9", "grade_num": 9, "pictured": 0, "description": "Sit start just right of the geriatric tree (6m left of Hot Henry) with the LH orange seam and RH grey edge. One hard move leads to an easy top out.", "printed_number": "1", "grade_note": null, "photo": null}, {"id": 1059, "page": 276, "area": "VICTORIA RANGE", "boulder": "CHERRY PICKING BOULDER", "name": "CRUNKMAN", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Just right of the cave. Stand start below shallow V-depression. Tricky start to easing ground. Dave Graham", "printed_number": "61", "grade_note": null, "photo": "photos/275-2.jpg"}, {"id": 1264, "page": 327, "area": "Windowlicker Area", "boulder": "Crown Boulder", "name": "CRUSHINGS", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Requires heaps of tension. From the jug in the back of the roof make a big move left to a hueco. Bust straight back out on slopers through the lip of the roof. Simon Weill", "printed_number": "8", "grade_note": null, "photo": "photos/326-1.jpg"}, {"id": 3, "page": 31, "area": "Andersens / Amnesty", "boulder": "GUNN BUTTRESS", "name": "DAVE JONES TRAVERSE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Originally climbed right to left, it's best climbed left to right. A long and slopey traverse starting in the middle of Gunn Buttress. Sit start on the low jug on the blocky feature and traverse 8m right finishing on a juggy break under the roof. Dave Jones. The traverse right to left, but finishing all the way left, is still a project.", "printed_number": "3", "grade_note": null, "photo": "photos/019-006.jpg"}, {"id": 1058, "page": 276, "area": "VICTORIA RANGE", "boulder": "CHERRY PICKING BOULDER", "name": "DIAGONAL MINDS", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Stand start in the middle of the face and climb the crazy diagonal striations. There is a V10 sit start. Dave Graham", "printed_number": "60", "grade_note": null, "photo": null}, {"id": 362, "page": 102, "area": "Hollow Mountain Cave", "boulder": null, "name": "EYE OF THE TIGER", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Rarely repeated. Sit start on the rock protruding from the cave wall with two undercling pockets. Make some hard moves via small edges to good holds. Continue to the arching pinch rail of Krusty. Finish as for Krusty. Sharik Walker", "printed_number": "3", "grade_note": null, "photo": "photos/102-2.jpg"}, {"id": 542, "page": 154, "area": "Trackside", "boulder": "Paul's Boulder", "name": "FAR LEFT EL WESTWOOD", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "The start is desperate. Sit start on the left side of the face with a LH incut and RH flat edge. Move up to a side-pull and small seam and make a long moves straight up the face. Paul Westwood", "printed_number": "54", "grade_note": null, "photo": "photos/154-3.jpg"}, {"id": 1135, "page": 293, "area": "Buandik / Got Lost", "boulder": "Got Lost Boulder", "name": "GOT PSYCHED", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Lost is the new found. Goes up the middle of the overhanging face at the end of the boulder. Sit start on a crimp and then top out to the right. Jochen Perschmann", "printed_number": "63", "grade_note": null, "photo": "photos/293-2.jpg"}, {"id": 1072, "page": 278, "area": "VICTORIA RANGE", "boulder": "THE GRAVITY REEF BREAK", "name": "GRAVITY WAVE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Awesome line up the inside of a unique hanging-tongue feature. Sit start matched on a large side-pull near the tip of the tongue and climb out and right to top out through the northern lip of the cave. Stephen Waring", "printed_number": "74", "grade_note": null, "photo": "photos/278-1.jpg"}, {"id": 329, "page": 93, "area": "Rambla Wall", "boulder": null, "name": "GROUND ZERO", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Long and slick, but the best problem here. Sit start on good side-pulls 2m below the large hueco/hole. Climb straight up the middle of the wall to a high finish on the horizontal break above the level of the block behind it. Julian Saunders", "printed_number": "2", "grade_note": null, "photo": null}, {"id": 693, "page": 199, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "HAPPY CAMPER TRAVERSE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Slightly easier if you have small digits. Sit start on the crescent jug, climb straight out, then traverse left along the line of ever-decreasing edges and slots to top out on good holds. Watch your back on the Fence Post of Justice. Paul Westwood", "printed_number": "12", "grade_note": null, "photo": "photos/199-2.jpg"}, {"id": 594, "page": 167, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "HIGH FLYER", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Tricky. Sit start on the flake underneath the very steep roof. Follow the line of incuts and edges out left via some dynamic moves to ultimately finish on jugs.", "printed_number": "14", "grade_note": null, "photo": "photos/167-1.jpg"}, {"id": 1002, "page": 258, "area": "BUANDIK / MADE IT", "boulder": "HILLARY STEP", "name": "HILLARY STEP", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "A classic of the area. Sit start under roof with LH sloper, RH crimp. Make a series of tenuous moves out to the lip, where you can finish easily left or more with more difficulty straight up. Simon Weill", "printed_number": "4", "grade_note": null, "photo": "photos/264-3.jpg"}, {"id": 801, "page": 219, "area": "The Bleachers", "boulder": "Hippo Boulder", "name": "HIPPO AT THE GATE", "grade_raw": "V9", "grade_num": 9, "pictured": 0, "description": "Sit start in the back of the cave. Big moves through the middle of the roof lead to a hard move to the lip and a scary top out. Simon Weill", "printed_number": "60", "grade_note": null, "photo": null}, {"id": 991, "page": 255, "area": "HALLS GAP", "boulder": "IMMERSION BOULDER", "name": "IMMERSION", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "On the east side of the boulder (facing downstream) is a blunt arête. From a sit start (the stand is a very good V8 in its own right) climb the edges right of the seam. Long moves lead to a tricky conclusion. Try not to ping off into the creek. Oliver Miller", "printed_number": "41", "grade_note": null, "photo": "photos/255-1.jpg"}, {"id": 541, "page": 154, "area": "Trackside", "boulder": "Jungle Boulder", "name": "INCA STEPPA", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "The best problem on the wall. Start low with the obvious LH edge and small RH edge. Gastons, side-pulls, and front-stepping must have been all the rage in the pre-Columbus Americas. Al Robertson", "printed_number": "53", "grade_note": null, "photo": "photos/154-1.jpg"}, {"id": 1035, "page": 270, "area": "VICTORIA RANGE", "boulder": "MASSIVE DYNAMIC BOULDER (uncertain)", "name": "ISIS", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Isis the Egyptian goddess of nature and magic or the evil band of murderous arsehats? Climb Killian Sucks to the horizontal break at 4m, traverse right 2m and then climb the seam to very high top out. Dave Graham", "printed_number": "37", "grade_note": null, "photo": "photos/270-1.jpg"}, {"id": 1031, "page": 269, "area": "BUANDIK / MADE IT", "boulder": "KOOKABURRA BOULDER", "name": "KANGAROO ASSASSIN", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Anyone with a car in the Grampians? Climb Barbed Art for three or four moves, then make a burly move back left to the arête, finishing as for Backlash. Michael Tonon", "printed_number": "33", "grade_note": null, "photo": "photos/269-1.jpg"}, {"id": 360, "page": 102, "area": "Hollow Mountain Cave", "boulder": null, "name": "KRUSTY", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Burly underclinging is followed by some excellent squeezing. Start on the good hold on the wall of the cave 1m left of the window. Make some big moves back through underclings to the right trending rib of pinches and a tricky final move matching the large slopey rail. Klem Loskot", "printed_number": "1", "grade_note": null, "photo": "photos/102-2.jpg"}, {"id": 817, "page": 221, "area": "The Bleachers", "boulder": "Cirque of the Climbables", "name": "METHOD MAN", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Start as for Magic Daddy, but finish further left on some heinous slopes. Simon Weill", "printed_number": "76", "grade_note": null, "photo": "photos/221-1.jpg"}, {"id": 258, "page": 77, "area": "Andersens / Clicke", "boulder": "Shandy Boulder", "name": "MEXICAN DELIGHT", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Punchy. Apparently the name has something to do with everyone's favourite Mexican, Omar. Start on RH two-finger pocket and faint LH undercling. Climb the steep pocketed face and gun for the top. Vincent Day", "printed_number": "18", "grade_note": null, "photo": "photos/061-232.jpg"}, {"id": 762, "page": 213, "area": "The Bleachers", "boulder": "Blackbeard's Boulder", "name": "MUSK UP", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Start as low as you can (no, lower) in a hole, using RH side-pull and LH crimp. Up through some punchy and awkward moves to a slopey topout. Simon Weill", "printed_number": "21", "grade_note": null, "photo": "photos/213-2.jpg"}, {"id": 263, "page": 78, "area": "Andersens / Clicke", "boulder": "Apartment Block", "name": "NOMENTUM", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Just when you need it. Sit start low on the orange flake. Climb to the pocket and make a big reach to holds on the slab then continue straight up to the ledge. Simon Weill/Blake Wardell", "printed_number": "23", "grade_note": null, "photo": "photos/063-1.jpg"}, {"id": 394, "page": 108, "area": "Hollow Mountain Cave", "boulder": null, "name": "OGRE THUMB", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Pinch-tastic. Links Wimmel Friedhoff into reverse Amniotic World down to the pockets in the hanging rib and then exits out as for Rave Heart. Klem Loskot", "printed_number": "35", "grade_note": null, "photo": "photos/107-1.jpg"}, {"id": 297, "page": 85, "area": "Legoland", "boulder": null, "name": "ORCA", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "This superb and very committing arete is the proudest line in the area, although it has lost an important hold, which may render it harder/impossible. Stand start on jugs in the blocky seam and climb the arete. It was practised on top-rope before the FA. Julian Saunders", "printed_number": "4", "grade_note": null, "photo": "photos/087-2.jpg"}, {"id": 1207, "page": 316, "area": "Tower Proper", "boulder": "Mango Boulder", "name": "PEACHES", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "From Crab Apple, traverse right (staying low) to the starting hold of Mango, take a bite and finish as for Mango. Julian Saunders", "printed_number": "13", "grade_note": null, "photo": "photos/316-1.jpg"}, {"id": 926, "page": 240, "area": "Valley of the Giants", "boulder": "Massive Boulder", "name": "PICKPOCKET", "grade_raw": "V9", "grade_num": 9, "pictured": 0, "description": "Found on the lower - southern - end of the boulder. Sit start on pockets and move into the slots and a slicey crimp before topping out. Oliver Miller", "printed_number": "87", "grade_note": null, "photo": null}, {"id": 569, "page": 160, "area": "Spurt & Afterglow Walls", "boulder": "Spurt Wall", "name": "PIKACHU", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Climb Sam Sneak to the sloper over the first bulge and exit up right on pockets to top out on the ledge.", "printed_number": "3", "grade_note": null, "photo": "photos/160-1.jpg"}, {"id": 649, "page": 184, "area": "Mt Stapylton", "boulder": "Penguin Area", "name": "PINGU'S LAST STAND", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "A bit of an adventure. From the jug, climb right, traversing the lip of the low roof, finishing as for Penguin Biceps. Cairo Hazel", "printed_number": "19", "grade_note": null, "photo": "photos/184-1.jpg"}, {"id": 243, "page": 71, "area": "Andersens / Clicke", "boulder": null, "name": "POTS A PANS", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "[partly garbled OCR] Move right along the tip up the wall to a jug. Step off onto the adjacent block or suck it up and continue up pockets to a higher top out. Scot Scoots Walter", "printed_number": null, "grade_note": "corrected from V0 (manual check)", "photo": "photos/071-1.jpg"}, {"id": 272, "page": 79, "area": "Andersens / Clicke", "boulder": "Bridesmaid Wall", "name": "PUMPED ACTION", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Start as for Running Man and - yep - traverse into and finish up Pump Action.", "printed_number": "32", "grade_note": null, "photo": "photos/079-1.jpg"}, {"id": 637, "page": 179, "area": "Mt Stapylton", "boulder": "Ammagamma Boulder", "name": "PUNS & NOODLES", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Has a terrible name and a sting in the tail. Sit start on the large double-pocket feature that is halfway along Strammamax. Climb straight back through the roof and then head up the face on crimps and slopey pockets to finish at the obvious hueco at half height. Ivan Vostinar", "printed_number": "7", "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 692, "page": 199, "area": "Campground Boulders", "boulder": "Butthole Surfer Boulder (inferred)", "name": "RACE EATER", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "The original but often mislabelled line flashed during the first ascent by Klem Loskot. Climb left under the roof from the crescent jug to crimpy moves after the big pocket and make the throw to the sharp pocket of Butt Gravity then cruise to the top. Klem Loskot", "printed_number": "11", "grade_note": null, "photo": "photos/199-1.jpg"}, {"id": 681, "page": 194, "area": "Mt Stapylton", "boulder": "Farside", "name": "RAGING BULL", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Possibly the greatest boulder problem known to humankind. Sit start with the rightmost pocket and the shallow slopey edge to the right of it. Pull on and ride the perfect line of pockets out of the steep roof to a cruxy move gaining the lip. Mantle the nose. Dave Pearson", "printed_number": "2", "grade_note": null, "photo": "photos/107-447.jpg"}, {"id": 271, "page": 79, "area": "Andersens / Clicke", "boulder": "Bridesmaid Wall", "name": "RIDUNCULOUS TRAVERSE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Because you cannot have enough traversing. Start at Running Man and finish up Ridunculous. Julian Saunders", "printed_number": "31", "grade_note": null, "photo": "photos/079-1.jpg"}, {"id": 729, "page": 206, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "S.O.S.", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Stand start with a RH pocket and LH vertical slot. Move up left on pockets to jugs on the lip and top out onto the slab above.", "printed_number": null, "grade_note": null, "photo": "photos/206-3.jpg"}, {"id": 1012, "page": 266, "area": "VICTORIA RANGE", "boulder": "UNNAMED GREY FACE LEFT OF INSTAKILL (reached via high ledge)", "name": "SALAZAR", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Climbs the middle of the grey face on very small holds from a sit start. Dave Graham", "printed_number": "14", "grade_note": null, "photo": "photos/266-1.jpg"}, {"id": 568, "page": 160, "area": "Spurt & Afterglow Walls", "boulder": "Spurt Wall", "name": "SAM SNEAK", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Start on the low jug at the entrance to the tunnel. Make a long throw for a sloper over the bulge and exit up left on pockets to top out on the ledge.", "printed_number": "2", "grade_note": null, "photo": "photos/160-1.jpg"}, {"id": 765, "page": 213, "area": "The Bleachers", "boulder": "Blackbeard's Boulder", "name": "SEX PANTHER", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Big Al's eponymous addition starts on the good jug then climbs up via a long move to a sloper and right finish. Al 'Sex Panther' Robertson", "printed_number": "24", "grade_note": null, "photo": "photos/213-2.jpg"}, {"id": 473, "page": 135, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "SPARKLE MOTION", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Not the best landing but what a wonderful name. The very steep arete/roof 3m right of False Profit. Start on opposing sloper and slopey pocket. Climb along the arete to finish on the large, flat sloper.", "printed_number": "37", "grade_note": null, "photo": "photos/133-1.jpg"}, {"id": 320, "page": 90, "area": "Legoland", "boulder": null, "name": "STARSTRUCK", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Big Al can get a bit overwhelmed when visiting rock stars come Downunder. Start as for Swedish Meatballs, but head left up via pocket, thin crimps and a tricky mantle top out. Al Robertson", "printed_number": "27", "grade_note": null, "photo": "photos/090-1.jpg"}, {"id": 635, "page": 179, "area": "Mt Stapylton", "boulder": "Ammagamma Boulder", "name": "STRAMMAMAX", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Tricky lowball. Sit start on the large flat ledge and traverse right past a huge pocket to a big span to a sloper and into Endamax. Toni Lamprecht", "printed_number": "5", "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 474, "page": 136, "area": "Mt Stapylton", "boulder": "Daves' Cave", "name": "SUNSHINE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "A great line over a thought-provoking slab. Sit start near the arete. Climb rightwards through some tricky moves and then make a big span up to the pocket. Top out. Fred Nicole", "printed_number": "1", "grade_note": null, "photo": "photos/136-1.jpg"}, {"id": 940, "page": 241, "area": "VALLEY OF THE GIANTS", "boulder": "ABYSS BOULDER", "name": "THE ABYSS", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Superb highball up the right side of the eastern face of the boulder. Follow the left-curving seams to a high finish. Simon Weill", "printed_number": "102", "grade_note": null, "photo": "photos/241-1.jpg"}, {"id": 328, "page": 93, "area": "Rambla Wall", "boulder": null, "name": "THE COP COULDN'T MAKE IT", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "A short, punchy line. Start on the LH incut crimp and RH incut side-pull and make a dynamic move to a pocket. Finish on the juggy slot just above it. Toni Lamprecht", "printed_number": "1", "grade_note": null, "photo": null}, {"id": 1163, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "THE HANDSOME MENACE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "[LINK UP] Good looks forgive a lot of poor behaviour. Links Hand Solo into Manhandled. Mattias Braach Maksvytis", "printed_number": null, "grade_note": "corrected from V39 (print/OCR error)", "photo": "photos/301-1.jpg"}, {"id": 1187, "page": 311, "area": "Love Triangle", "boulder": "The Sun Deck", "name": "THE PINING", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Might be three stars were it not for the cliff factor. Start matched under the low roof on a small undercling. Drop into pocket with left, then slap out right to prow over slightly terrifying finish (you may want to tie your spotter in). Drop off. Simon Weill", "printed_number": "15", "grade_note": null, "photo": "photos/311-1.jpg"}, {"id": 799, "page": 218, "area": "The Bleachers", "boulder": "Quickening Boulder", "name": "THE QUICKENING", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Another exceedingly popular Weill classic, and not just because it's soft. From a sit start off a good edge, move up to a big jug in the steep face then follow the series of crimpy rails right to a high exit. Simon Weill", "printed_number": "58", "grade_note": null, "photo": "photos/219-4.jpg"}, {"id": 794, "page": 218, "area": "The Bleachers", "boulder": "The Walker Boulder", "name": "THE WALKER", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Mega classic. From the back of the cave climb out on good holds, jump for the lip, move back left and ascend the arete. Simon Weill", "printed_number": "53", "grade_note": null, "photo": "photos/219-2.jpg"}, {"id": 1231, "page": 320, "area": "Tower Proper", "boulder": "Time Lapse Terrace", "name": "TIME LAPSE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "From Flake of Doom's start, climb right on small incut edges to the starting jug of Man in Black, finishing as for that problem. Simon Weill", "printed_number": "37", "grade_note": null, "photo": "photos/320-3.jpg"}, {"id": 525, "page": 150, "area": "Trackside", "boulder": "Love Boulder", "name": "TO LOVE TO HATE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "More classic sloper action. Climb Ministry of Love to the lip, then traverse left on slopers to finish up To Love to Hate. Dave Jones", "printed_number": "37", "grade_note": null, "photo": "photos/150-3.jpg"}, {"id": 850, "page": 230, "area": "Valley of the Giants", "boulder": "Wall of Arses Boulder", "name": "TRAV BALL", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "All the cool kids are going sideways. Sit start in front of the green boulder towards the left end of the overhanging face. Alternate above and below the horizontal as you follow it all the way left, finishing as for Arse Face. Simon Weill", "printed_number": "12", "grade_note": null, "photo": "photos/230-3.jpg"}, {"id": 1052, "page": 275, "area": "BUANDIK / MADE IT", "boulder": "THE EYRIE (wall below Balazar)", "name": "TUNNEL VISION", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Great backdrop to some desperate climbing. Sit start on a small knobbly finger jug. Up using small, sharp crimps to biggish move right and bigger holds. Nalle Hukkataival", "printed_number": "54", "grade_note": null, "photo": "photos/275-1.jpg"}, {"id": 1186, "page": 311, "area": "Love Triangle", "boulder": "The Sun Deck", "name": "TWO TICKETS TO THE GUN SHOW", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Leftmost problem. Sit start on low arete, making a big move left with heels in. Finish at jug. Drop off. The stand is V3. Simon Weill", "printed_number": "14", "grade_note": null, "photo": "photos/311-2.jpg"}, {"id": 4, "page": 31, "area": "Andersens / Amnesty", "boulder": "GUNN BUTTRESS", "name": "VENDETTA", "grade_raw": "V9", "grade_num": 9, "pictured": 0, "description": "Looks punchy. Three metres left of the 'CF' initials on the right end of the cliff is a low chalked up jug in a black streak. From a sit start, follow the black streak on crimps to a jump to the lip. Drop off or climb to ledge? Simon Weill", "printed_number": "4", "grade_note": null, "photo": null}, {"id": 862, "page": 231, "area": "Valley of the Giants", "boulder": "Taken Boulder", "name": "WAKING LIFE", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Climb the high clean streak from the same sit start as the Taken. Oliver Miller", "printed_number": null, "grade_note": null, "photo": "photos/231-1.jpg"}, {"id": 368, "page": 103, "area": "Hollow Mountain Cave", "boulder": null, "name": "X-TREME COOL", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Probably V8 if you're not short. Sit start on the left edge of the lower mouth of the cave on a horizontal seam. Initial moves on pockets lead to a large span between slopey rails and a hard move out right to a pocket. Finishes on the good flat hold where the two obvious continuing lines diverge (just below the pockets of Sleepy Hollow). Klemm Loskot", "printed_number": "9", "grade_note": null, "photo": "photos/103-1.jpg"}, {"id": 132, "page": 53, "area": "Andersens / Right Main", "boulder": "Zinc Boulder", "name": "ZINC", "grade_raw": "V9", "grade_num": 9, "pictured": 1, "description": "Hard. Stand start matched on the good rail. Make some balancy moves up the face via slopey crimps to the top. Julian Saunders", "printed_number": null, "grade_note": null, "photo": "photos/053-1.jpg"}, {"id": 480, "page": 139, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "100 POUND CLUB", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Mainly loved by fans of jumping, this was impressively flashed by Klem Loskot during the first ascent. Sit start on the right side of the water runnel at a jug and incut slot. Make a big move to twin pockets and dyno to the finish jug.", "printed_number": null, "grade_note": null, "photo": "photos/139-1.jpg"}, {"id": 1118, "page": 289, "area": "Buandik / Got Lost", "boulder": "Unidentified cave (heading not printed)", "name": "A CLONE WITH SOME SKILLS", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Dyno skills presumably. Just past the left end of the cave is a semi-standing start off two flat holds in a break. Bust a big move out to the jugs out right then saunter up to the top. Mattias Braach-Maksvytis", "printed_number": "6", "grade_note": null, "photo": "photos/289-2.jpg"}, {"id": 398, "page": 110, "area": "Hollow Mountain Cave", "boulder": null, "name": "AMERICAN PIE", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "From the campus Start to the big span to the lip of the cave, American Pie is outrageously good. High start with a thin LH slot and RH slopey lip. Pull up to a good hold high in the roof and make a huge move to edges on the lip. Hold the swing as you top out the short headwall. Al Pryce", "printed_number": "39", "grade_note": null, "photo": "photos/105-1.jpg"}, {"id": 1184, "page": 310, "area": "Love Triangle", "boulder": "Stolen Boulder", "name": "BEGGED OR BORROWED", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Just left of arete. From a stand start, grab hanging rails, left into scoop (hard), then up through gap above. Simon Weill", "printed_number": "12", "grade_note": null, "photo": "photos/310-2.jpg"}, {"id": 959, "page": 247, "area": "VENUS BATHS", "boulder": "BLOCKHEAD BOULDER", "name": "BLOCKHEAD", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Doesn't look much, but packs in some hard, technical climbing. From a desperate sit start off side-pulls climb the boulder's nose past increasingly sloping holds. Oliver Miller", "printed_number": "9", "grade_note": null, "photo": "photos/126-553.jpg"}, {"id": 537, "page": 151, "area": "Trackside", "boulder": "Butcher's Boulder", "name": "BUTCHER'S CHOICE", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "A power-endurance classic. Sit start way back in the cave on chalked jugs. Climb the line of pockets, underclings and flakes out the roof, finishing up the bulbous arcing crack. Dave Jones", "printed_number": "49", "grade_note": null, "photo": "photos/087-357.jpg"}, {"id": 661, "page": 187, "area": "Mt Stapylton", "boulder": "Caves Club", "name": "CAVE CLUB", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "An area classic and good training for Dead Can't Dance. Start on the big curved-flake feature and head rightwards and up through big gaston moves to the slopey hold on the headwall and tricky moves. Top out on ledge. Klem Loskot", "printed_number": "5", "grade_note": null, "photo": "photos/186-1.jpg"}, {"id": 374, "page": 106, "area": "Hollow Mountain Cave", "boulder": null, "name": "CAVE HEART", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Links X-treme Cool into Easy Does It into Aphrodite. Ben Heason", "printed_number": null, "grade_note": null, "photo": null}, {"id": 402, "page": 110, "area": "Hollow Mountain Cave", "boulder": null, "name": "CAVED OUT", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Ben clearly had too much time on his hands when he was out here. Links Amniotic World into reverse Wimmel Friedhoff and exit up Gastonia. Ben Heason", "printed_number": "43", "grade_note": null, "photo": null}, {"id": 1091, "page": 283, "area": "Buandik / Got Lost", "boulder": "Hydra Boulder", "name": "CHANCE IMPRESSION", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "On the right side of the boulder, climb the beautifully patterned bulge. Sit start with left crimp and bad right sloper. Make a big move over bulge, top out easily right. Michael Tonon", "printed_number": "19", "grade_note": null, "photo": "photos/282-1.jpg"}, {"id": 1061, "page": 276, "area": "VICTORIA RANGE", "boulder": "CHERRY TREE (ledge above Cherry Picking)", "name": "CHERRY TREE", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Immaculate sandstone on the ledge at the base of the cliff above Cherry Picking. Sit start left of the bolted route, off left side-pull and right slopey pinch, up then left via small holds, finishing at high jug on left. Drop off. Enzo Nahumury", "printed_number": "63", "grade_note": null, "photo": "photos/277-4.jpg"}, {"id": 140, "page": 54, "area": "Andersens / Right Main", "boulder": "Seduction Wall", "name": "CRUISE CONTROL", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Originally a Saunders' project, it was too hard for him. Sit start just to the left of the arete with a tiny LH crimp side-pull and RH slopey side-pull. Make a powerful big throw for the higher sloper and top out over the bulge. Paul Westwood", "printed_number": null, "grade_note": null, "photo": "photos/055-3.jpg"}, {"id": 1168, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "DOS MANOS", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Sit start 2m right of Cold Hands, Cold Heart. Easy climbing leads to a couple of hard moves on slopey holds. Simon Weill", "printed_number": "13", "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 452, "page": 130, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "DROP BEAR", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Every overseas visitor knows they must watch out for them. Stand start 1m right of the Kindergarten Scoop on a small edge, up on slopey nothings until you can pop-come-dyno for the lip. Nalle Hukkataival", "printed_number": "16", "grade_note": null, "photo": "photos/129-1.jpg"}, {"id": 66, "page": 42, "area": "Andersens / Left Main", "boulder": null, "name": "ETCH-A-SKETCH", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Was very popular at V1]. From a crouch start on the right end of the good undercling feature in the back of the cave, follow the obvious line of good holds out of the cave and head right via big moves to the arete. Finish up the right side of the arete. Vincent DeLuca", "printed_number": "38", "grade_note": null, "photo": "photos/015-003.jpg"}, {"id": 453, "page": 130, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "GRIPMASTER", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Well named. Sit start at the low slopey pinch rail and climb the blunt arete via a crazy line of pinches and slopers to a tricky mantle. Finish on a jug just under the roofline. Stand Dave Jones / sit Klem Loskot", "printed_number": "17", "grade_note": null, "photo": "photos/129-1.jpg"}, {"id": 332, "page": 93, "area": "Rambla Wall", "boulder": null, "name": "HOKA-HEI", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Continues Julian's great love of climbing sideways. Start on holds near the eroded boulder to the right of the God of Small Things and traverse left to finish on the jug-slot finish hold of the Cop Couldn't Make It. Julian Saunders", "printed_number": "5", "grade_note": null, "photo": null}, {"id": 732, "page": 206, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "ICEBERG", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "A punchy skin-eater. Sit start at the base of the broken flakeline and make a hard move up left to the large side-pull flake and continue straight up on pockets to top out onto the slab. Paul Westwood", "printed_number": null, "grade_note": null, "photo": "photos/206-3.jpg"}, {"id": 731, "page": 206, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "ICEBERG LEFT", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Adds more moves to the already-punchy Iceberg. Sit start at the base of the broken flakeline and make a hard moves up left to the large side-pull flake. Climb leftward to finish as for Overboard.", "printed_number": "11", "grade_note": null, "photo": "photos/206-3.jpg"}, {"id": 414, "page": 115, "area": "Loopeys", "boulder": null, "name": "IN YOUR JESUS CHRIST POSE", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "If Jesus was the lead singer of a German metal band called Anal Steel. Starts all the way back into the cave next to Passion. Sit start matched on a sloper and slopey pocket and climb towards the light passing a bad sloper and good pocket to a grovelly exit over blocks. Finish up James. Toni Lamprecht", "printed_number": "12", "grade_note": null, "photo": "photos/115-1.jpg"}, {"id": 1055, "page": 275, "area": "BUANDIK / MADE IT", "boulder": "THE EYRIE (wall below Balazar)", "name": "ITALIAN REST", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Definitely no languid post-dinner passeggiare. The farthest line left climbs a series of barely visible, thin-as-a-'90s-supermodel crimps. Low start on small crimps gradually eases as you get higher. Add in a dodgy landing for good measure. Nalle Hukkataival", "printed_number": "57", "grade_note": null, "photo": "photos/275-1.jpg"}, {"id": 604, "page": 170, "area": "Mt Stapylton", "boulder": "Wildsides", "name": "LAZY MOONELI", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Disorienting. Positioned in a deep cave under a low capped roof. Sit start at the horn under the overhanging arete and move out left to slopers and follow them around the blocky bulge. Continue on edges in the crack then bust directly out of the roof through hard exit moves to the lip on pinches and crimps. Klem Loskot", "printed_number": "2", "grade_note": null, "photo": null}, {"id": 763, "page": 213, "area": "The Bleachers", "boulder": "Blackbeard's Boulder", "name": "LONDON GENTLEMEN", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Excellent overhang of bulging slopers. Start as for Blackbeard's Delight, but move left on slopey pinches to a difficult exit on still more slopers. Oliver Miller", "printed_number": null, "grade_note": null, "photo": "photos/213-2.jpg"}, {"id": 484, "page": 139, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "LULLABY", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Doesn't seem terribly popular. Sit start on two angled slots on the right side of the wall. Traverse left on slopers, pockets and edges to finish at the Epsilon Crack jug. Klem Loskot", "printed_number": "9", "grade_note": null, "photo": "photos/139-2.jpg"}, {"id": 122, "page": 52, "area": "Andersens / Right Main", "boulder": "Lillyput Wall (inferred)", "name": "MUNGO'S ROOF", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Popular. Sit start on good flakes at the lowest part of the roof and climb the line of flakes, pinches, and edges all the way out to cruxy moves at the lip. Finish at the big jug on the face or top out. Mungo", "printed_number": "93", "grade_note": null, "photo": null}, {"id": 409, "page": 114, "area": "Loopeys", "boulder": null, "name": "OLD HENRY'S SIT START", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Cramped. Sit start low on double pockets and climb left and up into Old Henry's Fun Climb via a hard gaston move.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1170, "page": 301, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "PATIENT ZERO", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Links the Sound of One Man-Hand Clapping, up to the hueco, then traverse left, finishing as for Manhandled. Matt Tait", "printed_number": "15", "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 567, "page": 160, "area": "Spurt & Afterglow Walls", "boulder": "Spurt Wall", "name": "SNOOKY BADLANDS", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Crimpy testpiece. Start matched on the low slopey rail 4m left of the tunnel. Move up on tiny crimps and pockets to cruxy moves over the bulge. Grab the jug pocket and eek up the slab to top out on the ledge. Garth Miller", "printed_number": "1", "grade_note": null, "photo": "photos/160-1.jpg"}, {"id": 475, "page": 136, "area": "Mt Stapylton", "boulder": "Daves' Cave", "name": "SNOW MIKE", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Probably the most popular line in the cave. Sit start matched on the incut crimp. Make a long move to slopers and finish on the higher slopey rail. Tim O'Neill", "printed_number": "2", "grade_note": null, "photo": null}, {"id": 1250, "page": 325, "area": "The Tower", "boulder": "Cave 15m right of Boxing Mike Bison", "name": "STAND & DELIVER", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Sit start on scallopy jug. Follow rib left, then through underclings in roof. Finish matched in poor diagonal grey seam over lip. Simon Weill", "printed_number": "56", "grade_note": null, "photo": "photos/325-2.jpg"}, {"id": 996, "page": 256, "area": "HALLS GAP", "boulder": "STOPLIGHT ARETE", "name": "STOPLIGHT ARETE", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Tricky amusement for passing tourists. Sit start/crouched on slopey edges then pinching up the arête with some slapping and funky footwork for good measure. Oliver Miller", "printed_number": "46", "grade_note": null, "photo": "photos/256-3.jpg"}, {"id": 859, "page": 231, "area": "Valley of the Giants", "boulder": "Taken Boulder", "name": "THE DEPARTED", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "One of the best. Sit start off a low break and climb left on slopers to a high, slopey top out through faint groove. Simon Weill", "printed_number": "21", "grade_note": null, "photo": "photos/231-1.jpg"}, {"id": 1122, "page": 289, "area": "Buandik / Got Lost", "boulder": "Bespoke Cave", "name": "THE HEIGHT OF FOLLY", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Climb the left side of the cave on slopers, through roof to high finish. Nalle Hukkataival", "printed_number": "50", "grade_note": null, "photo": "photos/289-1.jpg"}, {"id": 1117, "page": 288, "area": "Buandik / Got Lost", "boulder": "Alone on the Hill Boulder", "name": "THE HILLS HAVE EYES", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "A direct start to Alone on the Hill starting from the very back of the cave. Climb out via some cool tensiony moves. Luke Hansen", "printed_number": "45", "grade_note": null, "photo": "photos/288-2.jpg"}, {"id": 470, "page": 135, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "THE KEVIN RULE", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Contrived, but apparently fun and what a name! Bust the first move of the Nevin Rule before using the higher pod for your LH and making a tricky move to gain a slopey rail. Make a long move on crimps to gain the pod right of the Nevin Rule finish, before moving left to finish as for that problem. Simon Weill", "printed_number": "34", "grade_note": null, "photo": null}, {"id": 1169, "page": 301, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "THE SOUND OF ONE MAN-HAND CLAPPING", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "A bit like screaming in space? Good. Start as per Dos Manos. Easy climbing to a dynamic and reachy section through a blank looking roof. Cut loose and prosper. Simon Weill", "printed_number": "14", "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 638, "page": 179, "area": "Mt Stapylton", "boulder": "Ammagamma Boulder", "name": "THE VIKING", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Climb Puns & Noodles to the lip of the roof and traverse right to finish on the final jugs of Strammamax. Scott Walter", "printed_number": "8", "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 735, "page": 207, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "UMBRA", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Climb Collision Course to the rail but then traverse right to finish up Not Drowning Waving. Simon Weill", "printed_number": "15", "grade_note": null, "photo": "photos/206-3.jpg"}, {"id": 845, "page": 230, "area": "Valley of the Giants", "boulder": "Valley of Wads Boulder", "name": "VALLEY OF THE WADS", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Climbs a bulging nose of rock, with a bit of classic Weill fridge-hugging. Sit start off an undercling and side-pull in front of the low rock and slap your way up desperately Simon Weill", "printed_number": "7", "grade_note": null, "photo": "photos/230-2.jpg"}, {"id": 401, "page": 110, "area": "Hollow Mountain Cave", "boulder": null, "name": "VIVA RESISTANCE", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Nathan does have an unnatural love of getting pumped. Links Body Eater into Ogre Thumb. Nathan Hoette", "printed_number": "42", "grade_note": null, "photo": null}, {"id": 1249, "page": 325, "area": "The Tower", "boulder": "Cave 15m right of Boxing Mike Bison", "name": "VULCAN DEATH GRIP", "grade_raw": "V10", "grade_num": 10, "pictured": 1, "description": "Nice rock. Sit start on small edges in thin horizontal crack. Fight your way out to the jug on the big feature in roof. Drop off. Simon Weill", "printed_number": "55", "grade_note": null, "photo": "photos/325-2.jpg"}, {"id": 1174, "page": 309, "area": "Love Triangle", "boulder": "Love Boulder", "name": "ARNIE LUVS ARNIE", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "How could he not? Sit start on low edges just right of arete, move right to little arete feature, then straight up on more small edges. Simon 'Arnie' Weill", "printed_number": "2", "grade_note": null, "photo": "photos/309-3.jpg"}, {"id": 365, "page": 102, "area": "Hollow Mountain Cave", "boulder": null, "name": "BOULDERGOTCHI", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Has a minimum height requirement. After confusion about whether Stimulation was still a project, it was worked with new beta by towering German Peter Wuerth, who was able to climb the entire line by underclinging and keeping his feet on the cave wall. Although the two problems start and finish at the same points Bouldergotchi and Stimulation are effectively two different problems.", "printed_number": "6", "grade_note": null, "photo": "photos/102-1.jpg"}, {"id": 378, "page": 106, "area": "Hollow Mountain Cave", "boulder": null, "name": "CAVE TRANNY", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "The newest problem added to the cave is essentially a direct on Cave Man that heads along the rib using some small crimps out left, rejoining Cave Man with a throw to the slopey jug. Stephen Waring", "printed_number": "19", "grade_note": null, "photo": "photos/106-2.jpg"}, {"id": 434, "page": 122, "area": "Hollow Mountain", "boulder": "Project Wall", "name": "CIRCUIT BREAKER", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Another killer addition by Nalle that further erodes the relevance of the Project Wall's name. Climb the line up the crack on the orange streak and then head out left across the grey wall. Nalle Hukkataival", "printed_number": "6", "grade_note": null, "photo": "photos/123-1.jpg"}, {"id": 381, "page": 106, "area": "Hollow Mountain Cave", "boulder": null, "name": "DEAD CAN'T DANCE", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "The most famous gaston move in the world. Sit start matched on the juggy finishing flakes of Cave Man. Move out to the lip with a sloper and the much-fondled famous pinch, then make a shouldery move out to the gaston pocket on the higher rib feature. Finish as for Amniotic World. Klem Loskot", "printed_number": "22", "grade_note": null, "photo": "photos/101-1.jpg"}, {"id": 669, "page": 190, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "DEAD HEAT", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Slap that sloper. Sit start with the juggy feature of bizzare design and move up into the roof. Slap for the slopey rail. Traverse right to better holds and top out to the left. Klemm Loskot", "printed_number": "5", "grade_note": null, "photo": "photos/190-1.jpg"}, {"id": 1147, "page": 297, "area": "Buandik / Far Out", "boulder": "Diagonal Highway Boulder", "name": "DIAGONAL HIGHWAY", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Sit start at the bottom of the left-to-right slash and climb it on thin crimps. Dave Graham", "printed_number": "11", "grade_note": null, "photo": "photos/297-3.jpg"}, {"id": 965, "page": 249, "area": "VENUS BATHS", "boulder": "FIRST BLOOD BOULDER", "name": "FIRST BLOOD", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "As good as Brian Dennehey's performance. Sit start on small side-pull edges then up with difficulty past heinous slopers. Simon Weill", "printed_number": "15", "grade_note": null, "photo": "photos/127-559.jpg"}, {"id": 1146, "page": 296, "area": "Buandik / Far Out", "boulder": "Happy Ending Boulder", "name": "HAPPY ENDING", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "'Boulders top out. The ones that have been climbed anyway' Nalle's words may ring in your ears on this one. On the backside of this boulder a massive slab of rock has peeled off leaving a steep, overhanging face. Sit start from pockets and edges, climb steep face then follow the underside of prow, keeping left of the arete at the top in what is a terrifying finish. Nalle Hukkataival", "printed_number": "10", "grade_note": null, "photo": "photos/297-2.jpg"}, {"id": 523, "page": 149, "area": "Trackside", "boulder": "Love Boulder", "name": "HATERS GONNA HATE", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "It's hard to hate any of the problems on this boulder. Start up Hate to Love, but instead of climbing right to prow, head straight up once you are halfway across the prow. Tom Farrell", "printed_number": "35", "grade_note": null, "photo": "photos/150-3.jpg"}, {"id": 1137, "page": 295, "area": "Buandik / Far Out", "boulder": "Jackson Pollock Canvas", "name": "JACKSON POLLOCK", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "The boulder problem that names itself by being on some of the most striking rock in Buandik. Found on a gully wall about 60m off to the right (west) of the track leading to Roobiks Cube (branching off about 40m before you get to Roobiks Cube). From a sit start climb the thin seam up the middle of the quintessential abstract Impressionist face to a high finish on the left. Nalle Hukkataival", "printed_number": "1", "grade_note": "corrected from V7 (OCR read)", "photo": "photos/294-1.jpg"}, {"id": 678, "page": 191, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Middle Cave", "name": "KILLER DWARF", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "A short line of great punchy moves on perfect rock. Sit start on two edges on the lowest point of the rail. Make hard moves out left to slopey pinches and up to a pocket. Finish as for Ground Control to Major Tom. Klem Loskot", "printed_number": "14", "grade_note": null, "photo": "photos/191-1.jpg"}, {"id": 395, "page": 108, "area": "Hollow Mountain Cave", "boulder": null, "name": "LADY BOY NOODLE BOX", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "That special something for when you've done everything else. Stand/jump start on the slug pinch hold and then make some big moves to slopers in the base of the crack then exit out the groove/ramp.", "printed_number": "36", "grade_note": null, "photo": "photos/108-1.jpg"}, {"id": 420, "page": 115, "area": "Loopeys", "boulder": null, "name": "PANOPTIKUM", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Possibly the third V11 in Oz. Climb Klapusterperle to the start of Fashion and keep traversing all the way into Winterkirsch. Long, low and hard. An easier variant has also been done exiting up Bitch Slap. Klem Loskot", "printed_number": "18", "grade_note": null, "photo": "photos/115-1.jpg"}, {"id": 431, "page": 122, "area": "Hollow Mountain", "boulder": "Project Wall", "name": "PARALLEL LINES", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "No surprises that Nalle was the first to do this highball project, the top of which is guarded by a committing dyno. As the name suggests, the line between the two parallel cracks. Compression moves lead to a big jump. Nalle Hukkataival", "printed_number": "3", "grade_note": null, "photo": "photos/122-1.jpg"}, {"id": 458, "page": 130, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "POINT AND SHOOT", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Sit start on underclings below the white rail 2m left of the start of Spanking the Monkeybars. Climb to a slopey pocket and underclings to make a big move gaining the slopey pinch of Spanking, finishing as for this problem. Al Pryce", "printed_number": "22", "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 1241, "page": 322, "area": "The Tower", "boulder": "Roof opposite Shark Arete (unnamed heading)", "name": "RED VELVET", "grade_raw": "V11", "grade_num": 11, "pictured": 0, "description": "Sit start on the flake on the right side of the roof then climb the slopey rail/rib leftward to top out. James Kassay", "printed_number": "47", "grade_note": null, "photo": null}, {"id": 290, "page": 83, "area": "Sandanista", "boulder": "Malapropism Boulder", "name": "SCHNELL", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "No longer a project. Make big moves to the small pocket and LH crimp, jump to lip and mantle. Nalle Hukkataival", "printed_number": "3", "grade_note": null, "photo": "photos/082-1.jpg"}, {"id": 1069, "page": 278, "area": "VICTORIA RANGE", "boulder": "CRIDULAR BOULDER", "name": "SIMPLICITY", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Climb Cridular but top out left. Looks great but the end is apparently contrived. Axel Perschmann", "printed_number": "71", "grade_note": null, "photo": "photos/278-2.jpg"}, {"id": 155, "page": 57, "area": "Andersens / Right Main", "boulder": "Mandatory Choices Boulder", "name": "SPIDERMATE", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Slightly spoils Peter Parker by climbing it from the ground. From a stand start climb Peter Parker using a razor-sharp edge. Nalle Hukkataival", "printed_number": "40", "grade_note": null, "photo": "photos/058-2.jpg"}, {"id": 1142, "page": 296, "area": "Buandik / Far Out", "boulder": "Stranger Danger Boulder", "name": "STRANGER DANGER", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "The proud prow has been climbed by Paul Robinson, though his version finishes right (looks more sane) rather than up the prow.", "printed_number": "6", "grade_note": null, "photo": "photos/296-1.jpg"}, {"id": 359, "page": 97, "area": "Echoes Block", "boulder": null, "name": "TANTRUM", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Start on the juggy black rail at the lip of the roof. Traverse left on pockets and make big moves to gain the higher ledges. Finish on the juggy high ledge.", "printed_number": "24", "grade_note": null, "photo": "photos/097-1.jpg"}, {"id": 977, "page": 251, "area": "VENUS BATHS", "boulder": "BAKELITE CONCEPT", "name": "THE BAKELITE CONCEPT", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "The beautiful cracked face is deceptively hard. From the stand start climb the face past a very hard deadpoint. Simon Weill", "printed_number": "27", "grade_note": null, "photo": "photos/251-1.jpg"}, {"id": 863, "page": 231, "area": "Valley of the Giants", "boulder": "Taken Boulder", "name": "THE TAKEN", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Another classic. From a sit start on the jug 5m left of the arete, climb right on a low horizontal. At the end of the horizontal make hard moves right and up on small incut edges, before moving up the arete's left side to a high and committing finish. Simon Weill", "printed_number": "25", "grade_note": null, "photo": "photos/231-1.jpg"}, {"id": 465, "page": 133, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "THE WEILL OF FORTUNE", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Involves some pumpy grappling. Start at A Horse is a Horse and traverse right on slopers and pockets all the way to finish up the Nevin Rule. Simon Weill", "printed_number": "29", "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 906, "page": 238, "area": "Valley of the Giants", "boulder": "Ways of Being Boulder", "name": "WAYS OF BEING", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "On the boulder's southern face (in the corridor). From a sit start on the left arete climb right on pinches and underclings. Oliver Miller", "printed_number": "68", "grade_note": null, "photo": "photos/010-000.jpg"}, {"id": 622, "page": 176, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "WHEN WE WERE KINGS", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Pocket-pulling magic. Sit start 2m right of the shelf on edges. Climb the right-trending line of pockets leading across the roof for 8m finishing on good incut edges. Klem Loskot", "printed_number": null, "grade_note": null, "photo": "photos/176-1.jpg"}, {"id": 809, "page": 220, "area": "The Bleachers", "boulder": "Tier of boulders below Three Sisters (unnamed)", "name": "WHITE MEN CAN JUMP", "grade_raw": "V11", "grade_num": 11, "pictured": 1, "description": "Sure they can Simon. Stand start off two edges under the steep wall, jump to the rail. The sit start project - the Woody Harrelson Memorial Project - will be hard. Simon Weill", "printed_number": "68", "grade_note": null, "photo": "photos/221-2.jpg"}, {"id": 625, "page": 177, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "BIG BUCK HUNTER", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Many a climber has spent a rest day playing Big Buck Hunter in one of Horsham's many pubs. Start as for Kings Cross and move to the higher flake. Use the hidden undercling to climb straight up to the finish holds of When We Were Kings.", "printed_number": "18", "grade_note": null, "photo": "photos/176-1.jpg"}, {"id": 380, "page": 106, "area": "Hollow Mountain Cave", "boulder": null, "name": "CAVE BITCH", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Work that core. Start at the same big pocket as Annagramma and climb the righthand line of pockets and crimps to meet Cave Man 1m right of its jump to the lip. Finish as for Cave Man. Sam Edwards/Bernhard Fiedler", "printed_number": "21", "grade_note": null, "photo": "photos/106-2.jpg"}, {"id": 383, "page": 107, "area": "Hollow Mountain Cave", "boulder": null, "name": "CAVE RAVE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "The original big link. Climb Cave Man into Dead Can't Dance exiting Rave Heart. Klem Loskot", "printed_number": "24", "grade_note": null, "photo": null}, {"id": 941, "page": 241, "area": "VALLEY OF THE GIANTS", "boulder": "ABYSS BOULDER", "name": "DEVIL IN THE DETAIL", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Another excellent addition. Climbs the left side of the face, just right of arête. Nalle Hukkataival", "printed_number": "103", "grade_note": null, "photo": "photos/241-1.jpg"}, {"id": 707, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "FAIRY HOLE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "The first ascent saw some good falls into the drop-off zone. Climb Butthole Surfer to the crimp and sloper on headwall, bust right to jug. Long move to pocket out right, then up to slot and jug to top out. Tom O Halloran", "printed_number": "26", "grade_note": null, "photo": "photos/201-2.jpg"}, {"id": 467, "page": 133, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "GIADA", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "In amongst the crowded terrain. Sit start on two edges under the rooflet. Reach out to slopers and crimps and make a press out left to the pocket. Big reaches back right gain the big high flake before finishing as for the Nevin Rule. Christian Core", "printed_number": "31", "grade_note": null, "photo": "photos/132-1.jpg"}, {"id": 590, "page": 167, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "IF YOU WANT BLOOD YOU'VE GOT IT", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Still one of the hardest dynos in Australia. Sit start on the large blocky flake and climb to the big sloper and small crimp. Make a huge dyno to jugs on the lip. Klem Loskot", "printed_number": "10", "grade_note": null, "photo": "photos/167-2.jpg"}, {"id": 429, "page": 120, "area": "Project Wall & In the Cloud", "boulder": "In the Cloud Boulder", "name": "IN THE CLOUD", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Pure crimp test-piece. Crouch start on an obvious good double edge. Follow small crimps and a gaston flake to the top. Dorothea Karalus", "printed_number": "1", "grade_note": null, "photo": "photos/120-1.jpg"}, {"id": 1011, "page": 266, "area": "VICTORIA RANGE", "boulder": "INSTAKILL GULLY", "name": "INSTAKILL", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "A small corner at the bottom of a large face in gully. Stand start on tiny crimp to gaston, right to jug. Up to high jugs then easy but very high top-out, trending left. Nalle Hukkataival", "printed_number": "13", "grade_note": null, "photo": "photos/266-3.jpg"}, {"id": 624, "page": 176, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "KINGS CROSS", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Perfect for humans with ape-like spans. Sit start on the higher juggy flake. Move up to RH side-pull pocket and make a big move left to the good incut hold of When We Were Kings, finishing as for that line. Klem Loskot", "printed_number": "17", "grade_note": null, "photo": "photos/176-1.jpg"}, {"id": 1152, "page": 298, "area": "Buandik / Far Out", "boulder": "Knowing Is Half The Battle Boulder (large orange wall)", "name": "KNOWING IS HALF THE BATTLE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Climbs the middle of the very impressive face. Start off the orange boulder. Up then left via some big moves. Gulp. More hard moves to jugs and high but easy top out. Nalle Hukkataival", "printed_number": "16", "grade_note": null, "photo": "photos/298-3.jpg"}, {"id": 432, "page": 122, "area": "Hollow Mountain", "boulder": "Project Wall", "name": "LAST ACTION HIRO", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Everyone wants to be a hero, not everyone can be. Sit start with your LH just under the low rooflet and RH on an angled slopey rail. Hard and slick initial moves on bad crimps lead to easier climbing - and heroic celebrations - at the top. Hiro Hoshina", "printed_number": "4", "grade_note": null, "photo": "photos/121-1.jpg"}, {"id": 1042, "page": 271, "area": "VICTORIA RANGE", "boulder": "BLACK SABBATH WALL", "name": "LOSING GRIP", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Powerful and sharp and spitty-offy. The first problem you come to climbs through a small overhang. Sit start on the double-handed triangular hold. Up to good edge, then make the big move that gives this problem its name. Nalle Hukkataival", "printed_number": "44", "grade_note": null, "photo": "photos/271-3.jpg"}, {"id": 640, "page": 181, "area": "Mt Stapylton", "boulder": null, "name": "LOST FOR LIFE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Punchy classic. Sit start on two shallow pockets and dyno for the horizontal rail. Make another big move out right to a side-pull and a pocket to finish on the high jugs. Klemm Loskot The stand (starting from the crimps in the break) is V9.", "printed_number": "10", "grade_note": null, "photo": "photos/179-1.jpg"}, {"id": 482, "page": 139, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "MUGABE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Crimptastic and a couple of snapped might render it impossible. Sit start on the good incut, make a big move to a small incut edge then thin moves to finish on incut jug. Simon Weill", "printed_number": "7", "grade_note": null, "photo": "photos/139-1.jpg"}, {"id": 667, "page": 190, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "NUTTS TO THE BUTTS", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "The long: stan has finally been climbed. Start as for Fog and climb right across hard moves in the roof to finish up the rail of Dead Heat. Mike Feinberg", "printed_number": "3", "grade_note": null, "photo": "photos/190-1.jpg"}, {"id": 583, "page": 166, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "QUITLINE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "An amazing line on perfect rock this is the dyno Klem Loskot didn't do. The right of the two dynamic lines starts on good holds in the break. Dyno for an incut slot. Nalle Hukkataival", "printed_number": "3", "grade_note": null, "photo": "photos/166-2.jpg"}, {"id": 775, "page": 215, "area": "The Bleachers", "boulder": "Red Mist", "name": "RED MIST", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "The Weill's finest hour? Start in the cave, span between the pinch on the arete to LH and RH side-pulls, chuck in a left heel. Compress powerfully, channel the rage then unleash a dynamic karate move on the arete. Simon Weill", "printed_number": "34", "grade_note": null, "photo": "photos/114-482.jpg"}, {"id": 1138, "page": 295, "area": "Buandik / Far Out", "boulder": "Roobiks Cube Boulder", "name": "ROOBIKS CUBE", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "A latter day classic with an equally classic name from one of the 20th Century's great inventions. Sit start at the back of the cave and battle your way out to the lip. Dave Graham", "printed_number": null, "grade_note": null, "photo": "photos/295-1.jpg"}, {"id": 1150, "page": 297, "area": "Buandik / Far Out", "boulder": "Rootarded Boulder", "name": "ROOTARDED", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Immaculate marbled rock marks out this tricky line. Sit start at the right end of the cave. Good holds lead to a long, hard move to a crimp and slopes. Yes, you do have to top out right through the high conclusion. Nalle Hukkataival", "printed_number": "14", "grade_note": null, "photo": "photos/297-1.jpg"}, {"id": 708, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "SCORPION KING", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "The obvious yet terrifying line of tiny slots, pockets and crimps from a sit start up the stunning headwall. The landing could be worse, but not by much. Gerhard Bergman or Jochen Perschmann. the FA is somewhat shrouded in mystery", "printed_number": "27", "grade_note": null, "photo": "photos/201-2.jpg"}, {"id": 966, "page": 249, "area": "VENUS BATHS", "boulder": "FIRST BLOOD BOULDER", "name": "SILVER PLATTER", "grade_raw": "V12", "grade_num": 12, "pictured": 1, "description": "Another proud and pretty Hukkataival line. Just left of the right end of the boulder is a scaly purple streak. Climb dimples to the shallow pocket, from where you make a big move left, finishing up the scoop. Nalle Hukkata
