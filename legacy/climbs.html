, "area": "Andersens / Right Main", "boulder": "The Shield", "name": "THE SHIELD", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start on the juggy flake in the middle of the wall. Move up to the crimps and the vertical slot and make tough moves to better holds.", "printed_number": "57", "grade_note": null, "photo": "photos/061-2.jpg"}, {"id": 1014, "page": 267, "area": "BUANDIK / MADE IT", "boulder": "BARON BOULDER", "name": "THE WEEPING ROCK", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Wipe away your tears, this looks good. Sit start on the tight end of the orange face on a RH side-pull and LH undercling. Undercling left, then up orange streak on pockets, exiting left. Stephen Waring", "printed_number": "16", "grade_note": null, "photo": "photos/267-2.jpg"}, {"id": 582, "page": 166, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "THINKLITE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Walk right from Volume 1000 and you get to two dynos. The left line starts on a broken flake (now edges) and dynos for the break.", "printed_number": "2", "grade_note": null, "photo": "photos/166-3.jpg"}, {"id": 163, "page": 59, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "THIS WAY UP", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Popular mainly due to its location. Sit start matched on little incut edges and a side-pull. Climb straight up to top out. It has also been linked from the start of 4:45.", "printed_number": "48", "grade_note": null, "photo": "photos/035-1.jpg"}, {"id": 25, "page": 37, "area": "Andersens / Left Main", "boulder": "LEFT MAIN (unlabelled boulder)", "name": "TRANSCIENCE", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "A tricky start is followed by a scary top out. Sit start at the crack below the block feature. Make a hard move to the ledge and top out left via the leaning cracks. Dave Jones", "printed_number": "3", "grade_note": null, "photo": "photos/037-2.jpg"}, {"id": 987, "page": 254, "area": "HALLS GAP", "boulder": "TSUNAMI BOULDER", "name": "TSUNAMI", "grade_raw": "V6", "grade_num": 6, "pictured": 0, "description": "On the backside of the Tsunami boulder (left of where the two boulders rest against each other), sit start on the flat hold, up to slopers and short face. Oliver Miller", "printed_number": "37", "grade_note": null, "photo": null}, {"id": 975, "page": 251, "area": "VENUS BATHS", "boulder": null, "name": "TWIN FIN", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Climbs the right arête. Start on the faux tufa and follow the vertical seams up the blunt arête to top out. Simon Weill", "printed_number": "25", "grade_note": null, "photo": "photos/251-2.jpg"}, {"id": 947, "page": 242, "area": "FALLS GAP", "boulder": "CONVINCED BOULDER", "name": "UNCONVINCED", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start in front of the small tree. Make a big move right, then climb back left up the ironstone groove. Simon Weill", "printed_number": "109", "grade_note": null, "photo": null}, {"id": 279, "page": 80, "area": "Andersens / Clicke", "boulder": "3 Star Buttress", "name": "V6", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start on the low blocky jug. Make a big move to the horizontal break under the roof and head left where more long moves gain the flake. Drop off at the break.", "printed_number": null, "grade_note": null, "photo": "photos/080-3.jpg"}, {"id": 264, "page": 78, "area": "Andersens / Clicke", "boulder": "Apartment Block", "name": "VICIOUS DELICIOUS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Sit start matched on the flat break 1m right of Nomentum. Head straight up the face with big moves on pockets to top out. Al Robertson", "printed_number": "24", "grade_note": null, "photo": "photos/078-2.jpg"}, {"id": 299, "page": 87, "area": "Legoland", "boulder": null, "name": "WET WITH EXCITEMENT", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Climbed after a rain shower, which is where the name comes from. It's even better now the tree has burnt down. The shorter RH arete of the main face. Stand start bear-hugging crimps on the arete and climb up on edges and slopers. Julian Saunders", "printed_number": "6", "grade_note": null, "photo": "photos/087-1.jpg"}, {"id": 406, "page": 114, "area": "Loopeys", "boulder": null, "name": "WHO THE FUCK IS HENRY?", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Young people these days. Starting as for Hot Henry climb straight up the wall. Michael Tonon", "printed_number": "4", "grade_note": null, "photo": "photos/114-1.jpg"}, {"id": 294, "page": 85, "area": "Legoland", "boulder": null, "name": "WIFE BEATER", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Stand start at the flat ledge. Climb up left on big pockets and make a long move from an undercling to finish on the higher pockets. Chris Jones", "printed_number": "1", "grade_note": null, "photo": "photos/085-1.jpg"}, {"id": 306, "page": 88, "area": "Legoland", "boulder": null, "name": "WITH OPEN ARMS", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "The best kind. Sit start on good pockets 3m right of arete and make a big move left to a blocky edge. Climb to the top via pockets and horizontal breaks.", "printed_number": "13", "grade_note": null, "photo": "photos/088-1.jpg"}, {"id": 347, "page": 96, "area": "Echoes Block", "boulder": null, "name": "XXXX", "grade_raw": "V6", "grade_num": 6, "pictured": 1, "description": "Punchy, like a yobbo after too many of the world's worst beers - XXXX. Sit start under the low roof on good pockets. Climb up on pockets and smooth flakes to finish as for Fallen Cow.", "printed_number": "12", "grade_note": null, "photo": "photos/096-2.jpg"}, {"id": 904, "page": 237, "area": "Valley of the Giants", "boulder": "High face to the right of Pinch & A Punch (Barbara Cartland names)", "name": "A DUEL OF HEARTS", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Hard start. Sit start on right end of block (just left of the crack). From a crimpy horizontal seam make a hard first move, then left up zigzagging seams. Simon Weill", "printed_number": "66", "grade_note": null, "photo": "photos/237-2.jpg"}, {"id": 257, "page": 77, "area": "Andersens / Clicke", "boulder": "Shandy Boulder", "name": "ANGRY ROBOTS", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "The worst kind. The perfect line for lovers of slabs and monos. Sit start with a pocket undercling and climb the slab via a mono. Scott Walter/Joshua Thelwell", "printed_number": "17", "grade_note": null, "photo": "photos/076-1.jpg"}, {"id": 370, "page": 103, "area": "Hollow Mountain Cave", "boulder": null, "name": "APHRODITE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start matched on the bucket undercling at the end of Easy Does It and climb the line of big moves on good holds for 4m to finish on the good edges of the rest of Sleepy Hollow. Alison Wong", "printed_number": null, "grade_note": null, "photo": "photos/101-2.jpg"}, {"id": 5, "page": 32, "area": "Andersens / Amnesty", "boulder": "GUNN BUTTRESS", "name": "ARTILLERY", "grade_raw": "V7", "grade_num": 7, "pictured": 0, "description": "A little contrived. The blocky pillar of rock between the 'CF' and 'K' route markers. Stand start bear-hugging the block and slap your way up to the top using the rock either side for your feet. Drop off at the jug. Al Robertson", "printed_number": "5", "grade_note": null, "photo": null}, {"id": 95, "page": 47, "area": "Andersens / Left Main", "boulder": "Gobsmacker Corner", "name": "ASSUMING THE MANTLE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "On the little boulder opposite Faux Magnum is this surprisingly tricky number. Sit start on the low sloping rail and do a subtle (hard) mantle onto the slab. Corinne Gwyther", "printed_number": "73", "grade_note": null, "photo": "photos/035-089.jpg"}, {"id": 1030, "page": 269, "area": "BUANDIK / MADE IT", "boulder": "KOOKABURRA BOULDER", "name": "BARBED ART", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "The best kind. Sit start on the jug on the left arête, traverse right on pockets then up on massive jugs (or drop off).", "printed_number": "32", "grade_note": null, "photo": "photos/269-1.jpg"}, {"id": 565, "page": 159, "area": "Trackside", "boulder": "Unnamed (down the hill from Darjeeling Express)", "name": "BEVERLY HILLS COP", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Very nice slopers. Just down the hill from Darjeeling Express is a large, squat boulder. This problem tackles the blunt arete on slopers from a sit start. Riccardo Toto Monetta", "printed_number": "77", "grade_note": null, "photo": "photos/159-1.jpg"}, {"id": 418, "page": 115, "area": "Loopeys", "boulder": null, "name": "BITCH SLAP", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "The sloper is best on a cold day. Sit start low on the blocky jug. Move up to an edge and a sloper and throw for the pocket. Top out on good holds.", "printed_number": "16", "grade_note": null, "photo": "photos/113-1.jpg"}, {"id": 1045, "page": 274, "area": "VICTORIA RANGE", "boulder": "BLACK HOLE WALL", "name": "BLACK HOLE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Looks great apart from the landing. Starts on the undercling/head-shaped hold above the hole. Climb the black rib to top out over another hole. Nalle Hukkataival", "printed_number": "47", "grade_note": null, "photo": "photos/274-1.jpg"}, {"id": 618, "page": 175, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "BOMBSHELL", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start at To Catch a Thief and traverse right on pockets into finish Remains of the Sheep.", "printed_number": "11", "grade_note": null, "photo": "photos/175-1.jpg"}, {"id": 1248, "page": 323, "area": "The Tower", "boulder": "Backside Terraces", "name": "BOXING MIKE BISON", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Five metres right of Railroaded is a massive slopey side-pull. From a sit start, climb rightwards along the break to an undercling. From the undercling, make a big move back left to finish on the dirty black jug. Drop off. Simon Weill", "printed_number": "54", "grade_note": null, "photo": "photos/323-1.jpg"}, {"id": 1224, "page": 319, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "BURMA PLATE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Starts pushed up against Indian Plate, but climb straight out, finishing slightly left with a tricky top out. Simon Weill", "printed_number": "30", "grade_note": null, "photo": "photos/319-1.jpg"}, {"id": 691, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "BUTT GRAVITY", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Is the worst. Sit start at the back of the roof matched on a slot. Bite down on a pocket and a crimp to a cruxy throw for good-sized pocket. Finish up Silly Putty. Julian Saunders", "printed_number": "10", "grade_note": null, "photo": "photos/199-1.jpg"}, {"id": 1145, "page": 296, "area": "Buandik / Far Out", "boulder": "Happy Ending Boulder", "name": "C222", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "On the left end of the northern face is a blunt arete. Squat start just right of it on low edges, up to a high conclusion. tan Dory", "printed_number": "9", "grade_note": null, "photo": "photos/297-4.jpg"}, {"id": 679, "page": 191, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Middle Cave", "name": "CAPTAIN TONELLI", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Originally given V5, this tricky number is at least V7, possibly harder. Sit start with the two edges of Killer Dwarf and climb up the rail to a tricky last move off pinches to gain the lip. Top out to the right.", "printed_number": null, "grade_note": null, "photo": "photos/191-1.jpg"}, {"id": 499, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "CARDIGAN STREET MASSACRE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Great burly lowball climbing. Sit start under the roof on a small LH edge and good RH pocket. Make a tense move to a pocket and edge and then a big move to the top. 'Strong' Adam", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1124, "page": 291, "area": "Buandik / Got Lost", "boulder": "Small cave beyond Bespoke Cave (right side)", "name": "CHUTING STAR", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "'Cause if you fall off you will go down the chute. Sit start on a precarious ledge and climb through the roof to gain crimps. Move up and left after leaving the chute. Stephen Waring", "printed_number": "52", "grade_note": null, "photo": "photos/291-3.jpg"}, {"id": 721, "page": 205, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "CLUSTER BUSTER", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Nice highball. Stand start with holds on the hanging lip at the left side of the cave. Climb up on pockets to the arete and top out around to the left. Al Robertson", "printed_number": "1", "grade_note": null, "photo": "photos/205-1.jpg"}, {"id": 61, "page": 42, "area": "Andersens / Left Main", "boulder": null, "name": "COCAINE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Thinner than a coke fiend. Start on the undercling flake, up to tiny gaston, finishing left on small side-pulls. Julian Saunders", "printed_number": "41", "grade_note": null, "photo": "photos/042-2.jpg"}, {"id": 948, "page": 242, "area": "FALLS GAP", "boulder": "CONVINCED BOULDER", "name": "CONVINCED", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Much better than it looks. From a sit start 2m right of the tree, climb up finishing slightly left. Simon Weill", "printed_number": "110", "grade_note": null, "photo": "photos/242-1.jpg"}, {"id": 962, "page": 247, "area": "VENUS BATHS", "boulder": "CERAMICS BOULDER", "name": "COPPERHEAD", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "A classic and committing highball best tackled with a posse of people and their pads. Stand start on the high rail on the arête and work your way up to a big move crescendo, finish left easily up the ramp. Oliver Miller", "printed_number": "12", "grade_note": null, "photo": "photos/249-2.jpg"}, {"id": 462, "page": 133, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "DARK MOORS ENTICING", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Climb Spanking the Monkeybars to the large sloper above the hueco, move right to a positive incut fingerjug you can match, then bust back and right for a two-finger gaston pocket. Finish on the lip. Pete Reynolds", "printed_number": "26", "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 422, "page": 117, "area": "Loopeys", "boulder": "Overlooked Wall", "name": "DEVIL'S COUNCILLOR", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "A great lesson in slopers and body position. Start matched on edges left of the blunt bulge. Move out right to a sloper/bulge and crank all the way to a slopey divet and up to the slopey rail. An awkward move gains the sharp flakes before the mantle. Axel Perschmann", "printed_number": "20", "grade_note": null, "photo": "photos/117-2.jpg"}, {"id": 150, "page": 56, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "DIRTBAG PAYDAY", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "A bit contrived but worthy. Start on the lip of the cave on the left side of the arete and climb under the roof on some good edges [avoiding the lip of the cave for hand holds] and make a big move off an undercling to a little edge just under the lip. Gain the lip of the cave and mantle to finish.", "printed_number": "35", "grade_note": null, "photo": "photos/057-1.jpg"}, {"id": 1109, "page": 287, "area": "Buandik / Got Lost", "boulder": "Drizzle Boulder", "name": "DRIZZLE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Fine face in gully 8m left of Hurry up the Rain is Coming. From a stand start climb up with difficulty. Axel Perschmann", "printed_number": "37", "grade_note": null, "photo": "photos/287-4.jpg"}, {"id": 38, "page": 39, "area": "Andersens / Left Main", "boulder": "GAS BOULDER", "name": "EARTH SUMMIT", "grade_raw": "V7", "grade_num": 7, "pictured": 0, "description": "The blunt end of the boulder sitting right on the track. Sit start on opposing side-pulls under the arete and climb straight up to top out. Julian Saunders", "printed_number": "16", "grade_note": null, "photo": null}, {"id": 62, "page": 42, "area": "Andersens / Left Main", "boulder": null, "name": "FAIRYDUST", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start as for Cocaine, but from the first side-pull move right to finish as for Captain Pugwash. Chris Jones", "printed_number": "42", "grade_note": null, "photo": "photos/042-2.jpg"}, {"id": 670, "page": 190, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "FEEL SO HOLY", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Mega compression climbing on perfect rock. Upgraded from V6, but still hard for the grade. Start on the lowest opposing holds of the fantastic orange rib and slap up through progressively worsening slopers to a hard move gaining the lip. Top out left onto the ledge.", "printed_number": null, "grade_note": null, "photo": "photos/190-1.jpg"}, {"id": 1013, "page": 266, "area": "VICTORIA RANGE", "boulder": "UNNAMED ORANGE WALL IN GULLY BELOW INSTAKILL", "name": "FIRST ONE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Looks great. A stand start on thin seams leads to a high finish. Nalle Hukkataival", "printed_number": "15", "grade_note": null, "photo": "photos/266-2.jpg"}, {"id": 457, "page": 130, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "FLASH GORDON", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "The hardest bit is avoiding laying an arse dab on the mat. Sit start at Spanking the Monkeybars. Climb left along the rail, finishing matched on the slopey lip. Dave Jones", "printed_number": null, "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 160, "page": 58, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "FORCED ENTRY", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Impressively flashed by steel-fingered American James Litz. Sit start matched on the left facing flake. Move left and up passed an incut gaston and scaryily lockable pocket in the middle of the blank face to top out. Sharik Walker", "printed_number": "45", "grade_note": null, "photo": "photos/059-2.jpg"}, {"id": 186, "page": 64, "area": "Andersens / Lower Clicke", "boulder": "Sydney Highrise Boulder (inferred)", "name": "FRENCH TOAST", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Delicious. Sit start at a small edge and pinch. Climb the pocketed wall, tending left and up. Dave Jones", "printed_number": null, "grade_note": null, "photo": "photos/065-2.jpg"}, {"id": 187, "page": 64, "area": "Andersens / Lower Clicke", "boulder": "Sydney Highrise Boulder (inferred)", "name": "FRENCH TOAST DIRECT", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start as for French Toast, but head to small pockets and up right to top out.", "printed_number": "6", "grade_note": null, "photo": "photos/065-2.jpg"}, {"id": 701, "page": 201, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "GAY HIP FLEXOR", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Very thin crimps. Sit start as for Ross' Problem. Head straight up using the sloper and some small crimps and finish up to the right.", "printed_number": "19", "grade_note": null, "photo": "photos/201-1.jpg"}, {"id": 178, "page": 61, "area": "Andersens / Right Main (inferred)", "boulder": "Giddy Up Boulder", "name": "GET ON DOWN", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Stand start with a LH undercling flake and RH small incut crimp just above. Climb straight up the wall staying right of the arete to top out.", "printed_number": "63", "grade_note": null, "photo": "photos/062-1.jpg"}, {"id": 181, "page": 62, "area": "Andersens / Right Main (inferred)", "boulder": "Vapid Boulder", "name": "GLYCERINE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Explosive. Sit start as for Vapid and make some big moves up small crimps on the face, top out via higher rails. Al Nitroglycerine Robertson", "printed_number": "2", "grade_note": null, "photo": "photos/064-1.jpg"}, {"id": 96, "page": 47, "area": "Andersens / Left Main", "boulder": "Gobsmacker Corner", "name": "GOBSMACKER", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Gets an upgrade, but don't be stacking pads. Start on poor underclings under the bulge. Make a hard throw for edges and mantle into the scoop. Julian Saunders", "printed_number": "75", "grade_note": null, "photo": "photos/047-1.jpg"}, {"id": 240, "page": 70, "area": "Andersens / Lower Clicke", "boulder": "Discovery Boulder", "name": "GRAND DISCOVERY", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "A great line. Sit start in the horizontal weakness and climb the white streak of pockets and edges.", "printed_number": "59", "grade_note": null, "photo": "photos/070-1.jpg"}, {"id": 1164, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "GRAND MASTER JUL-Z", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Grandmaster of wine-drinking and other pleasurable pursuits. Start 1m right of Hand Solo, follow rib left across Hand Solo to underclings then finish through notch as per Hands Up. Julian Saunders", "printed_number": "9", "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 694, "page": 199, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "HAPPY CAMPER", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "A classic pumpy traverse, only marginally spoilt by the ominous Fence Post of Justice. Start as for the Happy Camper Traverse, but traverse left on good holds, then up on small crimps to gain left-trending line of pockets and edges (caution over the post). Dave Jones", "printed_number": null, "grade_note": null, "photo": "photos/199-2.jpg"}, {"id": 407, "page": 114, "area": "Loopeys", "boulder": null, "name": "HENRIETTA THE GOAT", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "One for goat lovers. Stand start I'm left of Old Henry's Fun Climb with a high diagonal sloping hold. Climb to the top on small crimps.", "printed_number": "5", "grade_note": null, "photo": "photos/114-3.jpg"}, {"id": 1110, "page": 287, "area": "Buandik / Got Lost", "boulder": "Drizzle Boulder", "name": "HURRY UP THE RAIN IS COMING", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Stand start from jug in roof, bust a move up and left and it's all but over. Jochen Perschmann", "printed_number": "38", "grade_note": null, "photo": "photos/287-1.jpg"}, {"id": 71, "page": 43, "area": "Andersens / Left Main", "boulder": "Font Boulder", "name": "INJURE THE BACK", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Would get more stars if it didn't have the back-breaking landing. Sit start on the left side of the slot (of Green Destiny). Climb straight up the face on crimps to a slopey top out. Dave Jones", "printed_number": "50", "grade_note": null, "photo": "photos/043-1.jpg"}, {"id": 685, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "INSPECTOR GADGET", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "The first move is Contact Strength 101. Sit start on the slopey pockets, make a big move to a thin rail then up through pockets to a juggy finish. Dave Jones", "printed_number": null, "grade_note": null, "photo": "photos/198-1.jpg"}, {"id": 684, "page": 198, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "INSPECTOR GADGET LEFT", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start as for Inspector Gadget, but after the big initial move climb left to finish up Ultra Deluxe.", "printed_number": null, "grade_note": null, "photo": "photos/198-1.jpg"}, {"id": 1000, "page": 258, "area": "BUANDIK / MADE IT", "boulder": "HILLARY STEP", "name": "INSTANT PORRIDGE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Given V9 in old topos, no one seems to know much about it. Stand start 3m left of Instant Classic, up on edges.", "printed_number": "2", "grade_note": null, "photo": "photos/264-3.jpg"}, {"id": 792, "page": 217, "area": "The Bleachers", "boulder": "Suspended Boulder", "name": "JAMARCUS", "grade_raw": "V7", "grade_num": 7, "pictured": 0, "description": "Sit start under the suspended boulder. Pull through from a large undercut to gain side-pulls. Slap wildly with both hands for a downward facing hold, once you've snagged it head up and left to top out. Simon Weill", "printed_number": "51", "grade_note": null, "photo": null}, {"id": 957, "page": 247, "area": "VENUS BATHS", "boulder": null, "name": "JUMPING JACK", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Flash. Just right of the tree in the middle of the face. From the edge and side-pull climb the seam above. Oliver Miller", "printed_number": "7", "grade_note": null, "photo": "photos/247-2.jpg"}, {"id": 157, "page": 58, "area": "Andersens / Right Main", "boulder": "Mandatory Choices Boulder (inferred)", "name": "LIGHTNING ARETE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Thunderingly good. Sit start hugging the prow with both hands. Slap and squeeze your way up to a good layback and throw for the lip of the right face and mantle. Chris Jones", "printed_number": "42", "grade_note": null, "photo": "photos/058-1.jpg"}, {"id": 539, "page": 151, "area": "Trackside", "boulder": "Jungle Boulder", "name": "LIZA MACHETE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Short and pouncy. Start low, RH on big high edge and LH in slopey seam. Pounce to the pocket and top out left. Al Robertson", "printed_number": "51", "grade_note": null, "photo": "photos/154-1.jpg"}, {"id": 675, "page": 191, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Middle Cave", "name": "LONELY HEARTS CLUB", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Rarely repeated in its original form. Sit start on the jug. Climb the rib to the protruding horn (it's V3 to here), then move right to a hard and committing (hence the rarely before the repeated) top out. Klem Loskot", "printed_number": "11", "grade_note": null, "photo": "photos/049-1.jpg"}, {"id": 676, "page": 191, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Middle Cave", "name": "LONELY HEARTS CLUB DIRECT", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Requires the same high heel (and commitment) at the crux as the original. Sit start on the flat ledge 1m right of the start of Lonely Hearts Club and climb straight up on flakes and edges to the scary top out.", "printed_number": "11", "grade_note": null, "photo": "photos/049-1.jpg"}, {"id": 522, "page": 149, "area": "Trackside", "boulder": "Love Boulder", "name": "LUST", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start as for To Hate to Love to the ledge. Mantle the ledge, reaching for a high LH two-finger pocket. Continue delicately up the headwall to better holds.", "printed_number": "34", "grade_note": null, "photo": "photos/150-3.jpg"}, {"id": 156, "page": 57, "area": "Andersens / Right Main", "boulder": "Mandatory Choices Boulder", "name": "MANDATORY CHOICES", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Stunning line. Originally climbed from a sit start on the right arete (as opposed to Lightning Arete's start using both aretes). Slap and squeeze your way up to top out left over the nose. Dave Jones", "printed_number": "41", "grade_note": null, "photo": "photos/058-1.jpg"}, {"id": 1208, "page": 316, "area": "Tower Proper", "boulder": "Mango Boulder", "name": "MANGO", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Everyone's favourite fruit and a sweet area classic. From the obvious chalked-up edge below the arete, slap out to the prow then finish around left at top. Julian Saunders", "printed_number": "14", "grade_note": null, "photo": "photos/316-1.jpg"}, {"id": 1089, "page": 283, "area": "Buandik / Got Lost", "boulder": "Hydra Boulder", "name": "MEDUSA", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Way more inviting than a hag who would turn you to stone. Stand start on crimps to the right of cave. Up through bad holds to gain jug on protruding stone head, top out. Stephen Waring", "printed_number": "17", "grade_note": null, "photo": "photos/282-1.jpg"}, {"id": 1230, "page": 320, "area": "Tower Proper", "boulder": "Time Lapse Terrace", "name": "MEMORY LAPSE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start as for Flake of Doom, climb Time Lapse for several moves, then bust for the lip, which is turned via a hard mantle. Simon Weill", "printed_number": "36", "grade_note": null, "photo": "photos/320-4.jpg"}, {"id": 526, "page": 150, "area": "Trackside", "boulder": "Love Boulder", "name": "MINISTRY OF LOVE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "A great name and an unassuming classic that is technical and devious. Sit start under the roof on the off-angle slopey rail. Reach out to a pinch then up on slopers. Dave Jones", "printed_number": "38", "grade_note": null, "photo": "photos/150-3.jpg"}, {"id": 1221, "page": 318, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "MOTOWN SOUND STUDIO", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "From the 9.1 starting jug, climb left through the roof, exiting on the left side of the cave opening (just right of the boulder choke, watch your back). Julian Saunders", "printed_number": "27", "grade_note": null, "photo": "photos/318-2.jpg"}, {"id": 1067, "page": 278, "area": "VICTORIA RANGE", "boulder": "CRIDULAR BOULDER", "name": "MOULD INVASION", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "A short problem that goes nowhere. Sit start in the middle of the blank overhanging face, climb right with difficulty for three or four metres and drop off. Axel Perschmann", "printed_number": "69", "grade_note": null, "photo": "photos/278-2.jpg"}, {"id": 67, "page": 42, "area": "Andersens / Left Main", "boulder": null, "name": "MR FOX", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Excellent. Sit start at Etch-a-Sketch and make hard moves out right of the roof to a slopey rail and obvious line to the top. Dave Jones", "printed_number": "39", "grade_note": null, "photo": "photos/041-2.jpg"}, {"id": 59, "page": 41, "area": "Andersens / Left Main", "boulder": "Rocks on Blocks Boulder", "name": "MR KNOX", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start as for Etch-a-Sketch and climb out left through the roof to tricky moves gaining the lip and up the arete and dihedral feature. Dave Jones", "printed_number": "37", "grade_note": null, "photo": "photos/041-2.jpg"}, {"id": 152, "page": 56, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "MUNGO'S ARETE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Sit start with RH on the arete and LH on a small side-pull in the roof. Slap up the arete until you are able to gain the face and top out. Mungo", "printed_number": "37", "grade_note": null, "photo": "photos/057-2.jpg"}, {"id": 696, "page": 199, "area": "Campground Boulders", "boulder": "Happy Camper Boulder (inferred)", "name": "NO SEX AFTER MUSHROOMS LEFT", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Hard. Start as for No Sex After Mushrooms, but head up and left to slopey crimps then a big move to the lip.", "printed_number": null, "grade_note": null, "photo": "photos/199-2.jpg"}, {"id": 1100, "page": 286, "area": "Buandik / Got Lost", "boulder": "Still Here Boulder", "name": "ONESIE PARTY", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Sounds like fun. Five metres left of the cave is a sit start on an orange rib of rock. Up, then right through the thin grey face above. Aurel Gelot", "printed_number": "28", "grade_note": null, "photo": "photos/285-2.jpg"}, {"id": 1305, "page": 108, "area": "Hollow Mountain Cave", "boulder": null, "name": "PALM BEACH", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Half bouldering/half Cirque Du Soleil. Start pressed into the bowl 2m to the right of Rave Heart with some very poor holds. Reach back to the crack and dyno out to the good hold. Grading is honesty based", "printed_number": "33", "grade_note": "printed as V4/7", "photo": "photos/107-1.jpg"}, {"id": 1258, "page": 326, "area": "Windowlicker Area", "boulder": "Crown Boulder", "name": "PODLIFE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Thin. Same start as People of a Lesser Pod, but move right into subtle corner on small gastons, trending right to high finish. Simon Weill", "printed_number": "2", "grade_note": null, "photo": "photos/327-2.jpg"}, {"id": 487, "page": 141, "area": "Mt Stapylton", "boulder": "Epsilon Wall (Upper Tier)", "name": "PUSSY POWER", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Powerful name. Sweet looking problem. Sit start at the right end of the thin, rising horizontal crack. Follow it left, finishing at the high pocket in the grey streak. Drop off. Sophie King", "printed_number": "12", "grade_note": null, "photo": "photos/078-308.jpg"}, {"id": 454, "page": 130, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "QUERULANT", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Climb Gripmaster to the vague lip and traverse right to the finish of Sesame Superhighway.", "printed_number": "18", "grade_note": null, "photo": "photos/129-1.jpg"}, {"id": 1192, "page": 312, "area": "Tower Proper", "boulder": "Archer Tower", "name": "RAVEN ARETE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "The north arete of the Archer Tower is high and impressive. Sit start on obvious jug, then climb arete above to high conclusion. Pete Reynolds", "printed_number": "20", "grade_note": null, "photo": "photos/312-1.jpg"}, {"id": 756, "page": 212, "area": "The Bleachers", "boulder": "Dovai Ray (hidden chamber)", "name": "REGAL PASSAGE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Trickier than it looks thanks to heinous slopers. Start as for Soap Box, but climb the middle of the face past a big move to break. Chook Betts", "printed_number": "15", "grade_note": null, "photo": "photos/212-1.jpg"}, {"id": 259, "page": 78, "area": "Andersens / Clicke", "boulder": "Rodeo Wall", "name": "RISE OF THE MACHINES", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Popular classic requiring some body tension. Sit start low under the right side of the roof with a LH pocket and RH jug. Climb the line of opposing holds out the roof. Finish by mantling the lip.", "printed_number": "19", "grade_note": null, "photo": "photos/077-1.jpg"}, {"id": 260, "page": 78, "area": "Andersens / Clicke", "boulder": "Rodeo Wall", "name": "RODEO GIRL", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Figure out the puzzle of heel- and toe-hooks. Start as for Rise of the Machines and head left through the roof to a juggy ledge. Traverse right to mantle.", "printed_number": "20", "grade_note": null, "photo": "photos/077-1.jpg"}, {"id": 309, "page": 89, "area": "Legoland", "boulder": null, "name": "ROUGH TRADE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Jules' favourite kind. Sit start and climb the arete to finish just under the roof. Julian Saunders", "printed_number": "16", "grade_note": null, "photo": "photos/089-1.jpg"}, {"id": 1265, "page": 327, "area": "Windowlicker Area", "boulder": "Crown Boulder", "name": "SCANDALOUS", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Succumbs to some toe-hooking trickery. Start as per Crushings but continue climbing left to exit on jugs. Simon Weill", "printed_number": "9", "grade_note": null, "photo": "photos/326-1.jpg"}, {"id": 1198, "page": 313, "area": "Tower Proper", "boulder": "Scooch Boulder", "name": "SCOOCH", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Crouch start on small edges just right of big crack. Step left over big crack to finish.", "printed_number": "4", "grade_note": null, "photo": "photos/313-2.jpg"}, {"id": 1222, "page": 318, "area": "Tower Proper", "boulder": "9.1 Boulder", "name": "SHARK FIN SOUP", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Locate a chalked side-pull (on a red rib) inside the cave (but not right at the back). Make a move back to a hanging rib, then climb rib to sharp pocket at lip of cave. From the lip of the cave, make a tricky move left to jugs (watch your back). Simon Weill", "printed_number": "28", "grade_note": null, "photo": "photos/319-1.jpg"}, {"id": 973, "page": 250, "area": "VENUS BATHS", "boulder": "BATH SHARK", "name": "SHOWER SNAKE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "From the same start as Bath Shark climb left and up to a hard mantel. Jimmy Carnobe", "printed_number": "23", "grade_note": null, "photo": "photos/251-2.jpg"}, {"id": 8, "page": 32, "area": "Andersens / Amnesty", "boulder": "UPPER GUNN BUTTRESS", "name": "SILENT OBSERVER", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Looks good. Sit start at good holds right of the arete. Make a hard move left to slopey holds and climb up to a juggier top out.", "printed_number": "8", "grade_note": null, "photo": "photos/032-2.jpg"}, {"id": 653, "page": 184, "area": "Mt Stapylton", "boulder": "Penguin Area", "name": "SKID MARK", "grade_raw": "V7", "grade_num": 7, "pictured": 0, "description": "Punchy. On the opposite side of the cave is a chalked pocket in the overhanging face. From a stand start, bust right, finishing through the window above the chockstone. Cairo Hazel", "printed_number": "23", "grade_note": null, "photo": null}, {"id": 107, "page": 51, "area": "Andersens / Right Main", "boulder": null, "name": "SNATCH", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "High and intimidating. The line 3m right of Feverish starting at the good pocket. Make tenuous moves up slopey rails to a high top out. Julian Saunders", "printed_number": "85", "grade_note": null, "photo": "photos/048-2.jpg"}, {"id": 468, "page": 135, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "SO YOU THINK YOU CAN DANCE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Very popular. Start underclinging the left side of the scoop feature (just left of the start of Nevin Rule). Move up to LH incut crimp via tricky kneebars and underclings, gaston edges to meet the Nevin Rule at the high pinch, finishing as for that line. James Kassay", "printed_number": "32", "grade_note": null, "photo": "photos/133-1.jpg"}, {"id": 849, "page": 230, "area": "Valley of the Giants", "boulder": "Wall of Arses Boulder", "name": "SOFT COCK", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Not hard enough. Sit start on the vertical seam 1m right of Arse Face and follow the seams above trending slightly rightwards. Byran Clover", "printed_number": "11", "grade_note": null, "photo": "photos/230-3.jpg"}, {"id": 280, "page": 80, "area": "Andersens / Clicke", "boulder": "3 Star Buttress", "name": "SOLID STATE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start as for Telekinetic, but at the horizontal break under the roof make a long move to the pocket/dish on the lip and continue right to finish on jugs.", "printed_number": "40", "grade_note": null, "photo": "photos/080-3.jpg"}, {"id": 1148, "page": 297, "area": "Buandik / Far Out", "boulder": "Rootarded Boulder", "name": "STUBBY", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Techy edges to slabby finish. Sit start just to the left of Il Mancino de Bristol. N Stubbs", "printed_number": "12", "grade_note": null, "photo": "photos/298-4.jpg"}, {"id": 81, "page": 44, "area": "Andersens / Left Main", "boulder": "Shotgun Boulder", "name": "SUGAR STICKS", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Sit start under the big jug with a LH side-pull and straight up into Snap Dragon. Lucky Chance", "printed_number": "59", "grade_note": null, "photo": "photos/044-1.jpg"}, {"id": 244, "page": 71, "area": "Andersens / Clicke", "boulder": null, "name": "SWAN ARETE", "grade_raw": "V7", "grade_num": 7, "pictured": 0, "description": "Located at the north end of the boulder on a short hanging arete. Sit start just under the roof on the jugay undercling. Climb the slot and slopers up the nose.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1068, "page": 278, "area": "VICTORIA RANGE", "boulder": "CRIDULAR BOULDER", "name": "THE CRIDULAR", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Classic. Dubbed Simplicity for a time. From a sit, climb long line of huecos from the right side of the cave, finishing at the last big jug. Olaf Ciolek", "printed_number": "70", "grade_note": null, "photo": "photos/278-2.jpg"}, {"id": 326, "page": 91, "area": "Legoland", "boulder": null, "name": "THE DISGRUNTLER", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Sit start under the left of the two aretes at the low pocket and slap your way up the arete to top out.", "printed_number": "33", "grade_note": null, "photo": "photos/091-2.jpg"}, {"id": 824, "page": 222, "area": "The Bleachers", "boulder": "Slapper's Boulder", "name": "THE DOGHOUSE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "We've all been there. The left arete on the boulder's backside. Sit start with LH on lowest side-pull and RH slopey crimp, then straight up watching your back. Mattias Braach-Maksvytis", "printed_number": "83", "grade_note": null, "photo": "photos/222-1.jpg"}, {"id": 330, "page": 93, "area": "Rambla Wall", "boulder": null, "name": "THE GOD OF SMALL THINGS", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "A great book and not a bad problem, particularly if you like pockets. Sit start with a LH pocket and RH side-pull. Climb up to a tricky last move off a side-pull to a finish on pockets that relents. Corinne Gwyther", "printed_number": "3", "grade_note": null, "photo": null}, {"id": 469, "page": 135, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "THE NEVIN RULE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Absolute classic. Start matched on the flat rail and move up to a side-pull and an edge. Make a hard move to the higher flakes and battle the body-unfurling, barn-door swing. A committing final move to the finishing jug adds some spice. Dave Jones", "printed_number": "33", "grade_note": null, "photo": "photos/133-1.jpg"}, {"id": 1057, "page": 276, "area": "VICTORIA RANGE", "boulder": "CHERRY PICKING BOULDER", "name": "THE RAMP", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "The beginning of prime real estate. Stand start on two small finger jugs, moving right to finish up obvious ramp. The sit start goes at V8 and starts just down and left of stand start.", "printed_number": "59", "grade_note": null, "photo": "photos/276-2.jpg"}, {"id": 477, "page": 138, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "THE SHOW MUST GO ON", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Popular. Sit start under the roof on a big flake. Climb leftwards via a hard move on a bad undercling out the roof and up through two tiers of sloper rails to the final jug.", "printed_number": "2", "grade_note": null, "photo": "photos/138-1.jpg"}, {"id": 1096, "page": 285, "area": "Buandik / Got Lost", "boulder": "Skull boulder (name not printed)", "name": "THE SKULL IS NOT A BALL", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start around the right arete at the base of a large diagonal fissure. Sit start, traverse left into the Skull Direct. Jochen Perschmann", "printed_number": "24", "grade_note": null, "photo": "photos/285-1.jpg"}, {"id": 839, "page": 226, "area": "Valley of the Giants", "boulder": "Valley of Wads Boulder", "name": "THE WORLD CUP", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Just left of the right arete is a groove. Climb it from a stand start. Pete Reynolds", "printed_number": "1", "grade_note": null, "photo": null}, {"id": 776, "page": 215, "area": "The Bleachers", "boulder": "The Bloody Face", "name": "THERE WILL BE BLOOD", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Ominous but rewarding. Stand start matched on the slopey rail then build your feet to turn it to an undercling, stretch up high to good edges. Steel your resolve then make for a high top out guarded by a tricky finish. Simon Weill", "printed_number": "35", "grade_note": null, "photo": null}, {"id": 175, "page": 61, "area": "Andersens / Right Main (inferred)", "boulder": "The Pinnacle (inferred)", "name": "THINGS ONLY GET BETTER", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Really? Sit start under the roof with a slopey side-pull [the lowest band of chossy rock is off]. Climb the overhanging prow, then out left onto the headwall, exiting over the chockstone.", "printed_number": "60", "grade_note": null, "photo": "photos/061-1.jpg"}, {"id": 53, "page": 40, "area": "Andersens / Left Main", "boulder": "TIM TAM BOULDER", "name": "TIM TAM TRAVERSE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Not much to look at, but wonderful to climb. Start matched on a jug at the end of the boulder. Traverse right on slopers along the lip until you can mantle. Dave Jones", "printed_number": "31", "grade_note": null, "photo": "photos/040-1.jpg"}, {"id": 1038, "page": 270, "area": "VICTORIA RANGE", "boulder": "MASSIVE DYNAMIC BOULDER (uncertain)", "name": "TREEBEARD", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Tricky. Sit start on low jug, then left up arête on crimps. (Can be done as a stand at V5.)", "printed_number": "40", "grade_note": null, "photo": "photos/270-1.jpg"}, {"id": 1165, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "UNDERHANDED TACTICS", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Classic Weill M.O. Sit start 1m right of Grand Master Jul-Z on left undercling and right ear. Head straight up the obvious flakes to a hard and high finish. Simon Weill", "printed_number": "10", "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 589, "page": 167, "area": "Mt Stapylton", "boulder": "Snakepit", "name": "WAITING IN THE AIR", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Classic dyno. Sit start under the roof on two crimps in the seam. Make a big move to the lip and traverse the jugs rightward along the break. Once you are above the start holds of If You Want Blood make a committing dyno to the lip. Klem Loskot", "printed_number": "9", "grade_note": null, "photo": "photos/167-2.jpg"}, {"id": 1236, "page": 321, "area": "The Tower", "boulder": "Tower Proper", "name": "WASABI EXTENSION", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "The rightmost problem starts from a double-handed jug down from terrace. From jug climb up, finishing as for Wasabi. Julian Saunders", "printed_number": "42", "grade_note": null, "photo": "photos/320-2.jpg"}, {"id": 860, "page": 231, "area": "Valley of the Giants", "boulder": "Taken Boulder", "name": "WHERE THE WILD THINGS ARE", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Climb the 'suggestion' of an arete. Oliver Miller", "printed_number": null, "grade_note": null, "photo": "photos/231-1.jpg"}, {"id": 659, "page": 187, "area": "Mt Stapylton", "boulder": "Caves Club", "name": "WHIPPED CREAM", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Good and dynamic. Sit start as Full Cream and make a big throw out right to blocky holds and up to finish at the highest hold on the face.", "printed_number": "3", "grade_note": null, "photo": "photos/186-1.jpg"}, {"id": 296, "page": 85, "area": "Legoland", "boulder": null, "name": "WOMAN AT POINT ZERO", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Start 3m right of Feminist Theory on the slopey rail and high pocket. Make big moves via a small edge to finish on the big pocket. Corinne Gwyther", "printed_number": "3", "grade_note": null, "photo": "photos/085-1.jpg"}, {"id": 644, "page": 184, "area": "Mt Stapylton", "boulder": null, "name": "YOYO", "grade_raw": "V7", "grade_num": 7, "pictured": 1, "description": "Sit start on the small hold in the middle of the wall and climb up the centre on poor slopers and shallow pockets to finish in the juggy break.", "printed_number": "14", "grade_note": null, "photo": "photos/181-2.jpg"}, {"id": 331, "page": 93, "area": "Rambla Wall", "boulder": null, "name": "A LONG WAY FROM HOME", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Climb the God of Small Things and then traverse left to finish up Ground Zero. Julian Saunders", "printed_number": "4", "grade_note": null, "photo": null}, {"id": 1041, "page": 271, "area": "VICTORIA RANGE", "boulder": "BLACK SABBATH WALL", "name": "ADVENTURE TIME", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Climb the middle of the desperate thin slab on small nothings. Paul Robinson", "printed_number": "43", "grade_note": null, "photo": "photos/271-2.jpg"}, {"id": 1116, "page": 288, "area": "Buandik / Got Lost", "boulder": "Alone on the Hill Boulder", "name": "ALONE ON THE HILL", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The roof move is definitely cool. Start as for See the Sun Going Down but climb directly through the lip of the cave via a long move (that's easier if you can unleash a little clever footwork). Jochen Perschmann", "printed_number": "44", "grade_note": null, "photo": "photos/288-2.jpg"}, {"id": 214, "page": 68, "area": "Andersens / Lower Clicke", "boulder": null, "name": "AMERICAN DREAM", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Early in his bouldering career Julian Saunders had to be rescued off the top of this by a mass of spotters (probably pre-mats). Sit start on the juggy holds under the roof. Move back to a bad undercling and make a hard move to the pocket on the arete. Finish up Golden Oldie. Dave Jones", "printed_number": "33", "grade_note": null, "photo": "photos/068-4.jpg"}, {"id": 632, "page": 179, "area": "Mt Stapylton", "boulder": "Ammagamma Boulder", "name": "AMMAGAMMA STAND", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Good in its own right. Stand start with RH on the side-pull and LH in the pocket just above it. Move to the next pocket and up to top out. Dave Jones", "printed_number": "2", "grade_note": null, "photo": "photos/178-1.jpg"}, {"id": 1050, "page": 274, "area": "VICTORIA RANGE", "boulder": "THE EYRIE", "name": "BALAZAR", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Classic. Stand start at the left end of the gorgeous orange rail. Climb right to hard, crimpy crux on arête. Ian Dory", "printed_number": "52", "grade_note": null, "photo": "photos/274-2.jpg"}, {"id": 974, "page": 250, "area": "VENUS BATHS", "boulder": "BATH SHARK", "name": "BATH SHARK", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Short and punchy, much like Simon himself. From a sit start on slopey edge and side-pull follow the prominent seam to a slabby exit. Simon Weill", "printed_number": "24", "grade_note": null, "photo": "photos/251-2.jpg"}, {"id": 782, "page": 216, "area": "The Bleachers", "boulder": "Beige is All the Rage", "name": "BEIGE IS ALL THE RAGE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Beige, a power-colour oft maligned unfairly. Stand start under roof in undercling pockets (no low boulders for feet), bust through the lip then style straight up the face. Simon Weill", "printed_number": "41", "grade_note": null, "photo": "photos/216-1.jpg"}, {"id": 861, "page": 231, "area": "Valley of the Giants", "boulder": "Taken Boulder", "name": "BFG", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The crux comes at the top of this big fucking giant, so prepare yourself. One metre right of the arete is a large jug. From it climb the face above to a bulging top out. Oliver Miller", "printed_number": null, "grade_note": null, "photo": "photos/231-1.jpg"}, {"id": 6, "page": 32, "area": "Andersens / Amnesty", "boulder": "GUNN BUTTRESS", "name": "BISMARCK", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The lowball ship's prow arete at the right end of Gunn Buttress. Sit start with LH on the low sidepull and RH on the opposite arete. Wrestle to the top. If only it was bigger. Julian Saunders", "printed_number": "6", "grade_note": null, "photo": "photos/020-009.jpg"}, {"id": 1040, "page": 271, "area": "VICTORIA RANGE", "boulder": "BLACK SABBATH WALL", "name": "BLACK SABBATH", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The technical line of blocky holds through the small roof and blunt black arête. Dave Graham", "printed_number": "42", "grade_note": null, "photo": "photos/271-2.jpg"}, {"id": 764, "page": 213, "area": "The Bleachers", "boulder": "Blackbeard's Boulder", "name": "BLACKBEARD'S DELIGHT", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "A classic. Pirates must love using their heels. Sit start matched on the low rail then up right through bulges to a tricky top-out. Simon Weill", "printed_number": "23", "grade_note": null, "photo": "photos/213-2.jpg"}, {"id": 396, "page": 110, "area": "Hollow Mountain Cave", "boulder": null, "name": "BODY EATER", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Prepare your core for a pummelling. Jump to the hanging bulge 4m left of Wimmel Friedhoff. Climb right along the rib of pinches and underclings to exit up the groove/ramp. Toni Lamprecht", "printed_number": "37", "grade_note": null, "photo": "photos/108-1.jpg"}, {"id": 614, "page": 175, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "BONSAI", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Small but perfectly formed? Sit start wedged on the shelf left of Kamikaze on a two-finger undercling (RH) and an edge in the dish (LH). Make a huge move out left to the flake and finish on jugs.", "printed_number": "7", "grade_note": null, "photo": "photos/175-1.jpg"}, {"id": 502, "page": 147, "area": "Trackside", "boulder": "Amazing Boulder (heading not visible)", "name": "BRAHMA SUTRA", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Sit start on the shallow pocket/pinch just left of the black water streak and climb up using the high seam and small edges. Julian Saunders", "printed_number": null, "grade_note": null, "photo": "photos/147-2.jpg"}, {"id": 440, "page": 128, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "CAFFEINATOR", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "A burly classic that deserves to be more popular than it is. Stand start on the back right wall of the cave (just left of the fern). Climb out left through the roof on undercling pockets to finish on the high break.", "printed_number": "4", "grade_note": null, "photo": "photos/128-2.jpg"}, {"id": 316, "page": 89, "area": "Legoland", "boulder": null, "name": "CHK CHK BOOM", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Stand start matched on the long horizontal crack under the roof. Climb the arete on small edges to mantle. Drop off or slab it out to the top.", "printed_number": "23", "grade_note": null, "photo": "photos/089-2.jpg"}, {"id": 796, "page": 218, "area": "The Bleachers", "boulder": "The Walker Boulder", "name": "CMD", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Tough to keep your derriere out of the dirt. From the Walker start use crimps and pinches to head right along a low rib to exit into Evac. Simon Weill", "printed_number": null, "grade_note": null, "photo": "photos/219-1.jpg"}, {"id": 1167, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "COLD HANDS, COLD HEART", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Tough way to describe yourself. Sit start 2m right of Manhandled hard start then revel in the fantastic moves using some really interesting holds. Simon Weill", "printed_number": "12", "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 538, "page": 151, "area": "Trackside", "boulder": "Jungle Boulder", "name": "CONGA FURY", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The left arete. Sit start with LH low on arete and RH on a rad crimpy pinch in the face. Hug and slap your way to the top. Al Robertson", "printed_number": "50", "grade_note": null, "photo": "photos/154-1.jpg"}, {"id": 575, "page": 163, "area": "Mt Stapylton", "boulder": "Afterglow Boulders", "name": "CRISCO LOVE PARTY", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "An impressive pocketed line over a spooky drop (which can be adequately protected with a few pads and a spotter in the hole). Sit start with good holds at the bottom left hand side of the overhanging face. Climb right to the hueco and continue up past a deep, round pocket to top out over the lip.", "printed_number": "9", "grade_note": null, "photo": "photos/163-1.jpg"}, {"id": 298, "page": 87, "area": "Legoland", "boulder": null, "name": "CRITICAL MASS", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Another stellar highball. Start on pockets near the middle of the wall (just right of the boulder). Make a big move to gain the good rail at 3m and finish by exiting either straight up or by traversing right and up on the obvious weakness. Jonathon Woody Woods climbed the original right finish. Dave Jones the direct", "printed_number": "5", "grade_note": null, "photo": "photos/087-2.jpg"}, {"id": 716, "page": 203, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "DALAILAHMUNG", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Definitely much easier if you are blessed with the wingspan of an Andean condor. Start as for Fat Cow, but from the good hold in the roof slap your way up and around right to the jug. Toni Lamprecht", "printed_number": "35", "grade_note": null, "photo": "photos/203-1.jpg"}, {"id": 1025, "page": 268, "area": "BUANDIK / MADE IT", "boulder": "DEAF LEOPARD BOULDER", "name": "DEAF LEOPARD", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Not Dave's finest hour. Low start just right of arête, up to what remains of broken hold, moving left to easier ground. Dave Graham", "printed_number": "27", "grade_note": null, "photo": "photos/269-2.jpg"}, {"id": 373, "page": 103, "area": "Hollow Mountain Cave", "boulder": null, "name": "DESIRE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "You have to have it? Links Easy Does It into Aphrodite, Alison Wong", "printed_number": "14", "grade_note": null, "photo": null}, {"id": 545, "page": 155, "area": "Trackside", "boulder": "Paul's Boulder", "name": "DIRECT EL WESTWOOD", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Start as for Right El Westwood and take the line of shallow pockets and pinches straight up from the crescent to better holds in the high diagonal weakness. Paul Westwood", "printed_number": "57", "grade_note": null, "photo": "photos/154-3.jpg"}, {"id": 426, "page": 117, "area": "Loopeys", "boulder": "Overlooked Wall", "name": "EAGLE'S NEST", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "An amazing, high, near vertical wall of rippled grey sandstone over a pretty good landing. Stand start on the two obvious pockets and climb up on edges to a big move to gain the stacked pockets at 5m then straight up the headwall. On the first ascent the spotters were tethered. Al Robertson", "printed_number": "24", "grade_note": null, "photo": "photos/116-1.jpg"}, {"id": 121, "page": 52, "area": "Andersens / Right Main", "boulder": "Lillyput Wall", "name": "EXPOSED", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Thin. Sit start just left of the black streak on crimps. Make a hard move to edges on the lip and top out on the juggy crack.", "printed_number": "7", "grade_note": null, "photo": "photos/051-1.jpg"}, {"id": 914, "page": 239, "area": "Valley of the Giants", "boulder": "Large southern face (unnamed boulder)", "name": "EYES WIDE SHUT", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Easier if you're short. From a sit start on small edges, make a desperate move or two up to a tough dyno then drop off. The stand - just the dyno - is a good V4 in its own right. Simon Weill", "printed_number": "76", "grade_note": null, "photo": "photos/238-1.jpg"}, {"id": 963, "page": 249, "area": "VENUS BATHS", "boulder": "MARS ATTACKS BOULDER", "name": "FIRELINE", "grade_raw": "V8", "grade_num": 8, "pictured": 0, "description": "In the cleft right of Mars Attacks is a diagonal pencil seam. Climb the seam from a stand start via several desperate moves - watch your back. For protection the first ascentionist suspended a pad down the opposing face. Oliver Miller", "printed_number": "13", "grade_note": null, "photo": null}, {"id": 1087, "page": 283, "area": "Buandik / Got Lost", "boulder": "Hydra Boulder", "name": "FROM THE BELLY OF THE BEAST", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "A classic of funk. Start in the depths of the beast on a low undercling and high left pinch. Climb out through funky moves to the nose. Make a big move across the arch and top out right. Can be done as a V6 mantling the nose and finishing there. Stephen Waring", "printed_number": "15", "grade_note": null, "photo": "photos/282-1.jpg"}, {"id": 116, "page": 52, "area": "Andersens / Right Main", "boulder": "Gasoline Prow", "name": "GASOLINE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Sit start under the roof at the obvious juggy ledge. Move up to flakes in the roof and follow the line of holds through the roof around to the mantle over the nose. Julian Saunders", "printed_number": "3", "grade_note": null, "photo": "photos/051-2.jpg"}, {"id": 397, "page": 110, "area": "Hollow Mountain Cave", "boulder": null, "name": "GASTONIA", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "For gaston enthusiasts only. Start on good holds in the hanging feature (the start of Wimmel Friedhoff) and climb leftwards on pinches and slopers (of Body Eater) to a hard move out to a LH gaston and up to the top.", "printed_number": "38", "grade_note": null, "photo": "photos/108-1.jpg"}, {"id": 177, "page": 61, "area": "Andersens / Right Main (inferred)", "boulder": "Giddy Up Boulder", "name": "GIDDY UP", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "RIP Woody. This great line should probably get more attention than it does. From a stand start climb the high arete. Jonathon 'Woody Woods", "printed_number": "62", "grade_note": null, "photo": "photos/062-1.jpg"}, {"id": 709, "page": 202, "area": "Campground Boulders", "boulder": "Campground Boulders (main cave)", "name": "GOURMET CATS", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Suits cats who can crimp. Sit start on incut rail up to very small edges then a big move to the lip. Kiem Loskot", "printed_number": "28", "grade_note": null, "photo": "photos/202-2.jpg"}, {"id": 72, "page": 43, "area": "Andersens / Left Main", "boulder": "Font Boulder", "name": "GREEN DESTINY", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Sit start on the right side of the hueco and make a big move up to slopey holds and continue up hard moves on bad holds over the bulge left of White Destiny. Mungo", "printed_number": "51", "grade_note": null, "photo": "photos/043-1.jpg"}, {"id": 677, "page": 191, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Middle Cave", "name": "GROUND CONTROL TO MAJOR TOM", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Fun, slopey climbing with a sting in the tail. Sit start 1m right of Lonely Hearts Club at the flat ledge and traverse the slopey rail of holds right to the large pocket, finishing right via a long move to top out. Klem Loskot", "printed_number": "13", "grade_note": null, "photo": "photos/191-1.jpg"}, {"id": 1162, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "HAND SOLO", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "A journey. Sit start on jug 5m right of Hand Out in the far left of the cave and work your way right before finishing up a combination of Manhandled and Cold Hands, Cold Heart. Simon Weill", "printed_number": "7", "grade_note": null, "photo": null}, {"id": 76, "page": 44, "area": "Andersens / Left Main", "boulder": "Tim Tam Boulder", "name": "HAPPY DAZE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "May be harder if you are short. Stand start with a pocket and small edge. Make a big move up and left to the lip of the boulder and top out right. Mungo", "printed_number": "54", "grade_note": null, "photo": "photos/032-070.jpg"}, {"id": 463, "page": 133, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "HARIBO BOULDER", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Not a great problem. Sit start under the right side of the long, slopey ledge with a LH pinch and RH undercling. Avoiding using foot ledge, make hard moves to shallow pockets and finish matched on the rail. Fred Nicole", "printed_number": "27", "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 405, "page": 114, "area": "Loopeys", "boulder": null, "name": "HOT HENRY", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Fun but sharp. Sit start with the furthest right pocket. Move left on pockets to good incuts in the small hueco feature and up on slopey edges.", "printed_number": "3", "grade_note": null, "photo": "photos/114-1.jpg"}, {"id": 1101, "page": 286, "area": "Buandik / Got Lost", "boulder": "Still Here Boulder", "name": "I'M STILL HERE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Around the corner from Onesie Party is a gently overhanging face. Climb the face. Manu Mast", "printed_number": "29", "grade_note": null, "photo": "photos/286-3.jpg"}, {"id": 341, "page": 95, "area": "Echoes Block", "boulder": null, "name": "LACTATION", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Climb Dirty Dancing Direct but instead of mantling left, move right to the big jug and dyno for lip. Paul Robinson", "printed_number": "6", "grade_note": null, "photo": "photos/095-2.jpg"}, {"id": 543, "page": 154, "area": "Trackside", "boulder": "Paul's Boulder", "name": "LEFT EL WESTWOOD", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Sit start on the left side of the face with a LH incut and RH flat edge. Move up to a sidepull and small seam and huck for the pocket. Top out trending left. Paul Westwood", "printed_number": "55", "grade_note": null, "photo": "photos/154-3.jpg"}, {"id": 1234, "page": 321, "area": "The Tower", "boulder": "Tower Proper", "name": "MACHISMO", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "An epic journey. Sit start at the bottom of the chasm's left side. Up past chicken heads, then through roof. Climb slightly right, then top out via high finish on clean holds. Julian Saunders", "printed_number": "40", "grade_note": null, "photo": "photos/321-2.jpg"}, {"id": 94, "page": 47, "area": "Andersens / Left Main", "boulder": "Zoolander Wall (inferred)", "name": "MAGNUM", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Whatever you do, don't fall off the crux. From the low horizontal break, make a big move up and right to the leftward-leaning arete, follow arete left until you can exit onto the slab above the horrendous landing. You have to solo out to the right and down to get off. Chris Jones", "printed_number": "72", "grade_note": null, "photo": null}, {"id": 1166, "page": 300, "area": "Cave of Man Hands", "boulder": "Cave of Man Hands", "name": "MANHANDLED", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Simon does love a tussle. Sit start 1m right of Underhanded Tactics. Hard climbing with a powerful and shouldery crux. Simon Weill", "printed_number": null, "grade_note": null, "photo": "photos/301-1.jpg"}, {"id": 964, "page": 249, "area": "VENUS BATHS", "boulder": "MARS ATTACKS BOULDER", "name": "MARS ATTACKS", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Climbs the blunt prow of the spaceship boulder from a sit start. Oliver Miller", "printed_number": "14", "grade_note": null, "photo": "photos/127-558.jpg"}, {"id": 146, "page": 55, "area": "Andersens / Right Main", "boulder": "Trust Boulder", "name": "MICRO MACHINE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Short and powerful. Start on the hanging wall", "printed_number": "31", "grade_note": null, "photo": "photos/043-138.jpg"}, {"id": 261, "page": 78, "area": "Andersens / Clicke", "boulder": "Rodeo Wall", "name": "MIDNIGHT COWBOY", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Completes a classic by adding a high and committing finish. Climb Rodeo Girl but continue left to the looming arete, which has a delicate finish. The arete from a stand goes at V3. Riccardo Toto Monetta", "printed_number": "21", "grade_note": null, "photo": "photos/077-1.jpg"}, {"id": 1233, "page": 321, "area": "The Tower", "boulder": "Tower Proper", "name": "MINI MACHISMO", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Leftmost problem at the bottom of the chasm. Climb purplish rib, then through small roof. Finish at jug in the break. Step off. Simon Weill", "printed_number": "39", "grade_note": null, "photo": "photos/321-2.jpg"}, {"id": 1113, "page": 288, "area": "Buandik / Got Lost", "boulder": "Music to My Fears Roof", "name": "MUSIC TO MY FEARS", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Lines do not come much more dramatic than this. Sit start from the lowest holds, blasting straight out the middle of the roof to a high and scary finish. Dave Kellerman", "printed_number": "41", "grade_note": null, "photo": "photos/288-1.jpg"}, {"id": 1047, "page": 274, "area": "VICTORIA RANGE", "boulder": "THE EYRIE", "name": "NORTHERN FIRE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Great. Left of the Adventure is series of small underclings, slap out of pinches and pockets to another high finish. Axel Perschmann", "printed_number": "49", "grade_note": null, "photo": "photos/274-1.jpg"}, {"id": 357, "page": 97, "area": "Echoes Block", "boulder": null, "name": "ONE WAY IN, NO WAY OUT", "grade_raw": "V8", "grade_num": 8, "pictured": 0, "description": "On the backside of the boulder. A small cave is formed by blocks leaning together. Sit start in the cave (wedging your foot between the two boulders only for the first move) on small edges. Climb left up the blunt prow on sweet rail features to tricky exit onto the slab. Pat Reynolds", "printed_number": "22", "grade_note": null, "photo": null}, {"id": 730, "page": 206, "area": "Titanic Boulders", "boulder": "Titanic main wall", "name": "OVERBOARD", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Start as for S.O.S. and climb straight up. Paul Westwood", "printed_number": null, "grade_note": null, "photo": "photos/206-3.jpg"}, {"id": 361, "page": 102, "area": "Hollow Mountain Cave", "boulder": null, "name": "PAPARAZZI", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Are often a problem in the HMC. Sit start on undercling flakes 1m left of the start of Krusty. Make a big gaston move to the thin lip of the long rail and undercling your way into the arching pinch rail of Krusty, finishing as for that problem. Klem Loskot", "printed_number": "2", "grade_note": null, "photo": "photos/102-2.jpg"}, {"id": 648, "page": 184, "area": "Mt Stapylton", "boulder": "Penguin Area", "name": "PENGUIN BICEPS", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Just before the main cave is a low cave with a chalked slot/jug inside it. Sit start in slot, climb left and out along the arete.", "printed_number": "18", "grade_note": null, "photo": null}, {"id": 896, "page": 237, "area": "Valley of the Giants", "boulder": "Pinch & A Punch Boulder", "name": "PINCH & A PUNCH", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "This may be low and cramped but it remains somehow beguiling. From a sit start on an undercling and the slopey lip of the small cave, climb the short face above deploying heels and other such trickery. Simon Weill", "printed_number": "58", "grade_note": null, "photo": "photos/237-1.jpg"}, {"id": 173, "page": 60, "area": "Andersens / Right Main", "boulder": "The Shield", "name": "POLICE BRUTALITY", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Fuck the police. Sit start as for the Shield and climb right from the vertical slot to finish up to the right. Al Robertson", "printed_number": "58", "grade_note": null, "photo": "photos/061-2.jpg"}, {"id": 390, "page": 108, "area": "Hollow Mountain Cave", "boulder": null, "name": "RAVE HEART", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Everyone loves punching for the pocket. Start as for Amniotic World to the rib and roof pocket and move straight back using the holds on the lip and the slopey undercling slug. Slap for the juggy ledge and top it out. Klem Loskot. It can be started 2m to the right as Extended Heart (V9). Tim O'Neill", "printed_number": "31", "grade_note": null, "photo": "photos/107-1.jpg"}, {"id": 1275, "page": 329, "area": "Windowlicker Area", "boulder": "Windowlicker Terraces", "name": "READ MORE, LEARN MORE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The little undercut roof. From good orange jug make a hard move right to the rail, then climb face above, finishing right. Pete Reynolds", "printed_number": "19", "grade_note": null, "photo": null}, {"id": 497, "page": 146, "area": "Trackside", "boulder": "Simon Says Boulder", "name": "REGICIDE", "grade_raw": "V8", "grade_num": 8, "pictured": 0, "description": "The short, blunt arete right of Compaction is climbed from a sit and is quite burly. Reuben Bennett-Daly/Mark Spoelstra", "printed_number": null, "grade_note": null, "photo": null}, {"id": 971, "page": 250, "area": "VENUS BATHS", "boulder": "RICK & MORTY BOULDER", "name": "RICK & MORTY", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Slabily good. The right arête doesn't look hard at first blush, but closer inspection reveals few holds. From a stand start balance up to a relenting finish. Oliver Miller", "printed_number": "21", "grade_note": null, "photo": "photos/250-1.jpg"}, {"id": 815, "page": 221, "area": "The Bleachers", "boulder": "Cirque of the Climbables", "name": "RICK STEEL", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "One of the Weill's faves. Sit start on underclings 2m left of the arete. Bust left to side-pull, right to undercling pocket, then two very slopey pinches - one of which is 'the Grampians' best sloper' - exit for Anonymous Arete. Simon Weill", "printed_number": "74", "grade_note": null, "photo": "photos/221-1.jpg"}, {"id": 1243, "page": 322, "area": "The Tower", "boulder": "Proud Highway Boulder", "name": "ROAD TO NOWHERE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "The slabby, apparently featureless face left of Proud Highway has some features and thus goes. Climb the quartz dike on fine edges. Simon Weill", "printed_number": "49", "grade_note": null, "photo": "photos/322-2.jpg"}, {"id": 674, "page": 191, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Middle Cave", "name": "ROTA-LOO", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Excellent. Start on the left side of the cave with good underclings and make hard initial moves to get onto the rail. From here, traverse right, finishing on the horn midway up Lonely Hearts Club. If you continue to top out via Lonely Hearts Club give yourself a V9 tick (and a slap on the back).", "printed_number": "10", "grade_note": null, "photo": "photos/191-1.jpg"}, {"id": 968, "page": 250, "area": "VENUS BATHS", "boulder": null, "name": "S&M ARETE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "For tourist crushing fetishists. The blunt arête on the track with a dihedral corner is climbed from a stand start off a flat top jug. Oliver Miller", "printed_number": "18", "grade_note": null, "photo": "photos/250-4.jpg"}, {"id": 342, "page": 95, "area": "Echoes Block", "boulder": null, "name": "SCHWEISSPATRICK", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Great. Start at Dra Di and climb straight up the back of the cave and bust straight out to a desperate mantle. Extra points if you make it look easy.", "printed_number": "7", "grade_note": null, "photo": "photos/095-2.jpg"}, {"id": 267, "page": 79, "area": "Andersens / Clicke", "boulder": "Bridesmaid Wall", "name": "SEAM GRIP", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Excellent if you are into climbing sideways like a crab. Start as for Running Man and traverse the horizontal weakness 6m right via hard crimpy moves to big pockets and top out to the right on good holds. Julian Saunders", "printed_number": "27", "grade_note": null, "photo": "photos/079-1.jpg"}, {"id": 159, "page": 58, "area": "Andersens / Right Main", "boulder": "Andersens Consulting Boulder", "name": "SHANGHAI", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Keeping your arse out of the grass is difficult. Sit start matched on right-facing edges. Move to a gaston then up right to gain a jug. Top out. Andrew Bognar", "printed_number": "44", "grade_note": null, "photo": "photos/059-2.jpg"}, {"id": 1029, "page": 269, "area": "BUANDIK / MADE IT", "boulder": "KOOKABURRA BOULDER", "name": "SHARIK'S MISTAKE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "We'd love to know what it was. Sit start in middle of wall on slopey crimps to massive jugs. Sharik Walker", "printed_number": "31", "grade_note": null, "photo": "photos/269-1.jpg"}, {"id": 494, "page": 146, "area": "Trackside", "boulder": "Simon Says Boulder", "name": "SHATTERED ARETE", "grade_raw": "V8", "grade_num": 8, "pictured": 1, "description": "Harder. Sit start under the arete and punch straight up the nose on difficult moves.", "printed_number": "
