 1, "description": "A couple of metres left of Cherry Tree some thin edges may produce an extremely hard boulder.", "printed_number": "64", "grade_note": null, "photo": "photos/277-4.jpg"}, {"id": 1088, "page": 283, "area": "Buandik / Got Lost", "boulder": "Hydra Boulder", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Looks badarse. Start as for the previous problem, but head across the low arch through powerful compression moves. Finish up Medusa.", "printed_number": null, "grade_note": null, "photo": "photos/282-1.jpg"}, {"id": 1121, "page": 289, "area": "Buandik / Got Lost", "boulder": "Bespoke Cave", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Climb Bespoke but traverse left along the lip of the cave, finishing as for the Height of Folly.", "printed_number": null, "grade_note": null, "photo": "photos/289-1.jpg"}, {"id": 1123, "page": 289, "area": "Buandik / Got Lost", "boulder": "Bespoke Cave", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Just left of the cave is a nasty looking dyno that looks like an excellent way to lose a lot of skin.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1141, "page": 296, "area": "Buandik / Far Out", "boulder": "Bloc View courtyard", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The towering arete that looms over the courtyard, has been chalked but not climbed.", "printed_number": null, "grade_note": null, "photo": "photos/296-3.jpg"}, {"id": 1143, "page": 296, "area": "Buandik / Far Out", "boulder": "The Art Gallery", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Crack on right side of long face to high finish.", "printed_number": null, "grade_note": null, "photo": "photos/296-2.jpg"}, {"id": 1144, "page": 296, "area": "Buandik / Far Out", "boulder": "The Art Gallery", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "A couple of metres left is a thin diagonal crack.", "printed_number": null, "grade_note": null, "photo": "photos/296-2.jpg"}, {"id": 1177, "page": 309, "area": "Love Triangle", "boulder": "Love Boulder", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Thin face just left of rust-coloured streak towards right end of the boulder.", "printed_number": null, "grade_note": null, "photo": "photos/309-1.jpg"}, {"id": 1193, "page": 312, "area": "Tower Proper", "boulder": "Archer Tower", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Trench right of arete, anyone?", "printed_number": null, "grade_note": null, "photo": "photos/312-1.jpg"}, {"id": 1200, "page": 313, "area": "Tower Proper", "boulder": "Scooch Boulder", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Just right of the crack 5m right of roof is a highball arete that doesn't look too hard.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1203, "page": 316, "area": "Tower Proper", "boulder": "Unidentified (near Scooch Boulder)", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "The red and grey overhanging face doubtless holds a classic line.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1209, "page": 316, "area": "Tower Proper", "boulder": "Mojo Boulder", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Steep face below Jedi Ninja from sit start.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1216, "page": 317, "area": "Tower Proper", "boulder": "Mojo Boulder (north face)", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "The highball line in the middle of the north face of the boulder looks quite doable.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1235, "page" ea": "Windowlicker Area", "boulder": "Windowlicker Terraces", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Just left of the arete about 40m right of Windowlicker Arete. From jugs above stacked blocks immediately left of the blunt arete, make a long move to crimps, then make for the jug and the very high diagonal crack.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1277, "page": 329, "area": "Windowlicker Area", "boulder": "Windowlicker Terraces", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "From chalked jug in little cave follow the seam out, finishing as for Saunders Sanction.", "printed_number": null, "grade_note": null, "photo": "photos/329-2.jpg"}, {"id": 1283, "page": 330, "area": "Windowlicker Area", "boulder": "Gully proper (chasm)", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Follow the holds from the bottom right side of the chasm below Oriental Shit Scared and climb out, finishing as for Oriental Shit Scared.", "printed_number": null, "grade_note": null, "photo": "photos/330-1.jpg"}, {"id": 1287, "page": 331, "area": "Windowlicker Area", "boulder": "Arnie Cracks the Sads", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Nice line on black face left of cave on underside of boulder. Sit start on white jug then climb diagonals above.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1288, "page": 331, "area": "Windowlicker Area", "boulder": "Arnie Cracks the Sads", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The twin cracks 4m right of Arnie Cracks the Sads are super highball.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 1290, "page": 331, "area": "Windowlicker Area", "boulder": "Arnie Cracks the Sads", "name": "", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Around ": null, "pictured": 1, "description": "A couple of metres right of Village of the Damned a hard start leads into a slabby corner.", "printed_number": null, "grade_note": null, "photo": "photos/230-2.jpg"}, {"id": 851, "page": 230, "area": "Valley of the Giants", "boulder": "Wall of Arses Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "From Trav Ball's start climb straight up on cleaned slopers to a desperate high top out over back-breaking boulder. Sounds inviting.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 868, "page": 232, "area": "Valley of the Giants", "boulder": "Unnamed boulder beside Taken (see notes)", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Highball face 6m right of VS Ramachandran and 2m left of the fallen boulder.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 870, "page": 232, "area": "Valley of the Giants", "boulder": "Weilly Annoying Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The southern arete. From low pockets climb seam on left side of arete.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 873, "page": 233, "area": "Valley of the Giants", "boulder": "Weilly Annoying Boulder (uncertain)", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The first diagonal crack looks kinda possible.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 874, "page": 233, "area": "Valley of the Giants", "boulder": "Weilly Annoying Boulder (uncertain)", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The second diagonal crack looks more doable.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 877, "page": 233, "area": "Valley of the Giants", "boulder": "Weilly Annoying Boulder (uncertain)", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "From small edges, make a move up and left then climb the slab above.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 880, "page": 233, "area": "Valley of the Giants", "boulder": "Mini Giant Boulders", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The dirty crack 2m right of arete.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 894, "page": 236, "area": "Valley of the Giants", "boulder": "Behind the Weill Deal (unnamed)", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "The slab on the eastern face will go.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 895, "page": 236, "area": "Valley of the Giants", "boulder": "Behind the Weill Deal (unnamed)", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The face on the western face will go (just left of the right arete).", "printed_number": null, "grade_note": null, "photo": "photos/236-2.jpg"}, {"id": 905, "page": 237, "area": "Valley of the Giants", "boulder": "High face, back-side corridor", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "From a stand start on two cool ironstone edges, move right to a good hold then take on the tricky slab above.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 910, "page": 238, "area": "Valley of the Giants", "boulder": "Close Shave Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on ledge 1m left of Burl-usconi, mantle to reach good break over bulge, exit straight up.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 916, "page": 239, "area": "Valley of the Giants", "boulder": "Large southern face (unnamed boulder)", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "A good way to trash yourself on a rainy day. The traverse gets hard around Eyes Wide Shut.", "printed_number": null, "grade_note": null, "photo": "photos/238-1.jpg"}, {"id": 917, "page": 239, "area": "Valley of the Giants", "boulder": "Slash Face Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Left of the blunt arete is a knife-fighter's face. Climb the slashes from the sit or stand, either way looks desperate.", "printed_number": null, "grade_note": null, "photo": "photos/239-2.jpg"}, {"id": 918, "page": 239, "area": "Valley of the Giants", "boulder": "Slash Face Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Won't be that hard. Crouch start on the arete then climb rightwards to finish past large shelf.", "printed_number": null, "grade_note": null, "photo": "photos/239-2.jpg"}, {"id": 919, "page": 239, "area": "Valley of the Giants", "boulder": "Slash Face Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The scoopy overhang. Sit start on a triangle pinch, muscle into the undercling then make a big move to the ledge up left.", "printed_number": null, "grade_note": null, "photo": "photos/239-2.jpg"}, {"id": 920, "page": 239, "area": "Valley of the Giants", "boulder": "Prow Boulder (Valley)", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The eastern end of the boulder is marked by a long, attractive right-leaning prow. From the broken edge, slap your way upwards on very cool holds to top out.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 925, "page": 240, "area": "Valley of the Giants", "boulder": "Massive Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "The high, white shattered arete next to a tree.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 927, "page": 240, "area": "Valley of the Giants", "boulder": "Giant Slab Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Magnetic. Climb the very high, proud pencil seam up the middle of the giant slab. Has seen some attention and will be a classic of the genre.", "printed_number": null, "grade_note": null, "photo": "photos/240-3.jpg"}, {"id": 928, "page": 240, "area": "Valley of the Giants", "boulder": "Giant Slab Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The similarly high line up the seam and slab 15m to the right may be possible.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 929, "page": 240, "area": "Valley of the Giants", "boulder": "Giant Slab Boulder", "name": "(unnamed project)", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Climb Lost Negative for a move or two, then break left and climb the prow's attractive nose.", "printed_number": null, "grade_note": null, "photo": "photos/240-2.jpg"}, {"id": 1176, "page": 309, "area": "Love Triangle", "boulder": "Love Boulder", "name": "ARNIE LUVS OTHER PEOPLE", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Hard for Arnie. Sit start below the Arnold and finish as for that problem.", "printed_number": "4", "grade_note": null, "photo": "photos/309-3.jpg"}, {"id": 1271, "page": 329, "area": "Windowlicker Area", "boulder": "Windowlicker Terraces", "name": "BLACK STREAK", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The black streak on the face 15m right of the Windowlicker Arete will go on some slopey edges and pockets.", "printed_number": "15", "grade_note": null, "photo": null}, {"id": 1111, "page": 287, "area": "Buandik / Got Lost", "boulder": "Cave about 15m right of Hurry Up the Rain Is Coming", "name": "BYRON'S", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The brushed line that climbs out from the left side of the cave starting off a fine edge will go.", "printed_number": "39", "grade_note": null, "photo": "photos/287-3.jpg"}, {"id": 748, "page": 211, "area": "The Bleachers", "boulder": "Heart Boulder", "name": "EAST FACE", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Looks great. Climb the middle of the east face on knife slashes to a high finish.", "printed_number": "7", "grade_note": null, "photo": null}, {"id": 1181, "page": 310, "area": "Love Triangle", "boulder": "The Obelisk", "name": "LEFT OBELISK", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "From the two jugs climb breaks leftwards over terrible landing, or climb directly up on crimps.", "printed_number": "9", "grade_note": null, "photo": "photos/310-1.jpg"}, {"id": 1199, "page": 313, "area": "Tower Proper", "boulder": "Scooch Boulder", "name": "LORD HUMUNGOUS", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Awe-inspiring. Right of Scooch is a roof peppered with pockets. From a stand, climb pockets to high conclusion. Weill has climbed to the deep pocket below the lip (V10). The obvious conclusion has been cleaned by Nalle.", "printed_number": "5", "grade_note": null, "photo": "photos/313-3.jpg"}, {"id": 1182, "page": 310, "area": "Love Triangle", "boulder": "The Obelisk", "name": "MIDDLE OBELISK", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Looks quite hard. From the jugs climb up the seam to high finish.", "printed_number": "10", "grade_note": null, "photo": "photos/310-1.jpg"}, {"id": 10, "page": 33, "area": "Andersens / Amnesty", "boulder": "UPPER GUNN BUTTRESS (inferred)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Still unclimbed. The steep, rounded nose, sticking out from the cliff. From low jugs, press into the roof and make a tricky mantle.", "printed_number": "10", "grade_note": null, "photo": "photos/033-3.jpg"}, {"id": 15, "page": 35, "area": "Andersens / Amnesty", "boulder": "WING BOULDER", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start on small holds in the horizontal weakness and make punchy moves between opposing flakes and edges.", "printed_number": null, "grade_note": null, "photo": "photos/034-2.jpg"}, {"id": 18, "page": 35, "area": "Andersens / Amnesty", "boulder": "B1 BOULDER (inferred)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on good edges on the lip of the slab. Make a long move to a shallow pocket and head up the slab.", "printed_number": null, "grade_note": null, "photo": "photos/034-3.jpg"}, {"id": 23, "page": 35, "area": "Andersens / Left Main", "boulder": "B1 BOULDER", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start on the obvious jug and make a big move right to a flat edge and make hard moves to gain the good rail. Finish as for Transcience.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 24, "page": 35, "area": "Andersens / Left Main", "boulder": "B1 BOULDER", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "One for variant lovers. Climb project #1, finishing as for Puppet Master.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 27, "page": 37, "area": "Andersens / Left Main", "boulder": "LEFT MAIN (unlabelled boulder)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start matched on a low flake at bottom of the dihedral. Make some tricky moves up the corner to gain a mono on the face. Head straight up to the horizontal break via slopey rails, finishing as for Puppet Master.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 28, "page": 37, "area": "Andersens / Left Main", "boulder": "LEFT MAIN (unlabelled boulder)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start as for #5 to the first slopey rail and traverse right along the line of diminishing holds to top out through the roof and around the corner.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 30, "page": 37, "area": "Andersens / Left Main", "boulder": "B2 BOULDER", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "This boulder was heavily singed in the 2014 fires. Sit start on top of the edge of the sloping boulder with a high LH gaston and RH bulbous features. Climb up and left (over the gap) and top out.", "printed_number": null, "grade_note": null, "photo": "photos/038-2.jpg"}, {"id": 31, "page": 38, "area": "Andersens / Left Main", "boulder": "B2 BOULDER (inferred)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start 2m right of #8 in the hollow between the boulders with a thin flake undercling and higher RH side-pull. Climb right to the crack and up to top out.", "printed_number": null, "grade_note": null, "photo": "photos/038-2.jpg"}, {"id": 32, "page": 38, "area": "Andersens / Left Main", "boulder": "B2 BOULDER (inferred)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Stand start just right of the wedged block with an undercling pinch. Head straight out the roof and slightly right up the face on underclings, crimps and pinches.", "printed_number": null, "grade_note": null, "photo": "photos/038-2.jpg"}, {"id": 33, "page": 38, "area": "Andersens / Left Main", "boulder": "B2 BOULDER (inferred)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start as for #10 and traverse right out of the roof on underclings to the arete and top out.", "printed_number": null, "grade_note": null, "photo": "photos/038-2.jpg"}, {"id": 47, "page": 40, "area": "Andersens / Left Main", "boulder": "B4 BOULDER", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Dubbed Manticore (V11) in the last edition, this is still a project. Sit start with a LH undercling and RH on the horn. Head up the arete using a small crimp on the overhanging face to gain the opposing arete and top out over the nose.", "printed_number": "25", "grade_note": null, "photo": "photos/040-2.jpg"}, {"id": 99, "page": 47, "area": "Andersens / Left Main", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The best place for aspiring slab masters on hot days. In the cave behind Tickity Boo is a long slab. Start a couple of metres from the right end, traverse all the way back left, finishing up Tickity Boo.", "printed_number": "77", "grade_note": null, "photo": "photos/047-1.jpg"}, {"id": 105, "page": 51, "area": "Andersens / Right Main", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Still awaiting its FA. Climb the easy slab to the double pockets and continue up the arete to a high finish over a terrible landing.", "printed_number": "83", "grade_note": null, "photo": "photos/048-2.jpg"}, {"id": 126, "page": 53, "area": "Andersens / Right Main", "boulder": "Snowflake Boulder (inferred)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start at the arete with LH pinch and RH shallow pocket. Make a hard first move and climb to the top via the pocket on the slab.", "printed_number": null, "grade_note": null, "photo": "photos/052-1.jpg"}, {"id": 130, "page": 53, "area": "Andersens / Right Main", "boulder": "Zinc Boulder", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The good-looking line up the left of the wall is still to be climbed by someone with steely finger strength. Any takers?", "printed_number": null, "grade_note": null, "photo": "photos/053-1.jpg"}, {"id": 200, "page": 66, "area": "Andersens / Lower Clicke", "boulder": "Bad Cliche Boulder", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start under the roof with a pocket and the edge of the block. Make some funky moves to the good holds on the lip before finishing up Axe to Grind.", "printed_number": null, "grade_note": null, "photo": "photos/066-1.jpg"}, {"id": 202, "page": 66, "area": "Andersens / Lower Clicke", "boulder": "Bad Cliche Boulder", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start as for Axe to Grind and climb right and up the line of edges and small pockets. Then try it from the sit.", "printed_number": null, "grade_note": null, "photo": "photos/066-1.jpg"}, {"id": 203, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on slopers in the left of the scoop and climb up left on some small crimps to top out up the seam.", "printed_number": null, "grade_note": null, "photo": "photos/066-1.jpg"}, {"id": 209, "page": 67, "area": "Andersens / Lower Clicke", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on a good edge 2m right of As the Crow Flies. Hard moves up small slopey edges and side-pulls lead to good holds.", "printed_number": null, "grade_note": null, "photo": "photos/067-1.jpg"}, {"id": 215, "page": 68, "area": "Andersens / Lower Clicke", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start in the back of the cave just left of the crack with a LH undercling and RH sharp arete. Slap up the arete on opposing holds in the roof to glory jugs and the top.", "printed_number": null, "grade_note": null, "photo": "photos/068-4.jpg"}, {"id": 232, "page": 70, "area": "Andersens / Lower Clicke", "boulder": "The Scab (inferred)", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The impressive steep orange and grey prow. Start matched on the low hueco jug and climb the overhanging feature arete.", "printed_number": "51", "grade_note": null, "photo": "photos/071-2.jpg"}, {"id": 241, "page": 71, "area": "Andersens / Clicke", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "[OCR unreadable]", "printed_number": "51", "grade_note": null, "photo": "photos/071-1.jpg"}, {"id": 242, "page": 71, "area": "Andersens / Clicke", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "[OCR unreadable]", "printed_number": "51", "grade_note": null, "photo": "photos/071-1.jpg"}, {"id": 247, "page": 73, "area": "Andersens / Clicke", "boulder": "Clicke Arete", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "One of Andersens' last great unclimbed lines - and it is a line, an arcing arete. Sit start on the big pocket and head up the stunning arete.", "printed_number": null, "grade_note": null, "photo": "photos/075-3.jpg"}, {"id": 254, "page": 77, "area": "Andersens / Clicke", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on pocket just left of the white hueco. Big moves up slots gain easier ground on the high slab", "printed_number": "14", "grade_note": null, "photo": "photos/076-3.jpg"}, {"id": 283, "page": 81, "area": "Andersens / Clicke", "boulder": "Wrecking Ball", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Stand start with the shallow rail on the arete. Climb up to mantle the wall.", "printed_number": "43", "grade_note": null, "photo": "photos/081-4.jpg"}, {"id": 288, "page": 83, "area": "Sandanista", "boulder": "Sandanista Wall", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The perfect project to squash passing tourists from. The obvious prow arete looming over the track just before it cuts right and ascends behind the cliffline. Sit start at a pocket and climb through side-pulls and the very high top out over the terrible landing. Are we selling it?", "printed_number": "1", "grade_note": null, "photo": "photos/083-1.jpg"}, {"id": 304, "page": 88, "area": "Legoland", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start on the slopey rail 1m left of the arete. Use the pocket to gain small crimps, move left to better holds, finishing left up the seam.", "printed_number": null, "grade_note": null, "photo": "photos/088-2.jpg"}, {"id": 307, "page": 89, "area": "Legoland", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on juggy break 1m right of With Open Arms and climb straight up.", "printed_number": null, "grade_note": null, "photo": "photos/088-1.jpg"}, {"id": 308, "page": 89, "area": "Legoland", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start in the horizontal break 2m right of #14 and tackle the blank face to a scary top out.", "printed_number": null, "grade_note": null, "photo": "photos/088-1.jpg"}, {"id": 317, "page": 90, "area": "Legoland", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start 3m right of Chk Chk Boom matched on the horizontal rail. Make a big move onto the slab.", "printed_number": null, "grade_note": null, "photo": "photos/090-2.jpg"}, {"id": 318, "page": 90, "area": "Legoland", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "As for #24 but climb left into Chk Chk Boom.", "printed_number": null, "grade_note": null, "photo": "photos/089-2.jpg"}, {"id": 319, "page": 90, "area": "Legoland", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Located on the steep wall between two large boulders. A great project line starting on edges behind a blocky feature in the centre of the roof. Make long moves to the lip and top.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 325, "page": 91, "area": "Legoland", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start on the lowest of the right-facing flakes. Head right via cool side-pulls and underclings to the hard moves up into the scoop feature.", "printed_number": null, "grade_note": null, "photo": "photos/091-1.jpg"}, {"id": 358, "page": 97, "area": "Echoes Block", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start under the roof on the slab matched on the slots. Move out to a sharp and thin crescent pocket on the face and make a big move to gain an edge then follow the flake to finish at the ledge.", "printed_number": "23", "grade_note": null, "photo": "photos/097-1.jpg"}, {"id": 399, "page": 110, "area": "Hollow Mountain Cave", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Will be quite outlandish if it actually goes. Start as for American Pie to the good holds just before the throw to the lip. Move right to the pinch feature and then again to slopers before exiting up the ramp.", "printed_number": null, "grade_note": null, "photo": "photos/108-1.jpg"}, {"id": 400, "page": 110, "area": "Hollow Mountain Cave", "boulder": null, "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Make your mark on Oz climbing with this unclimbed future classic. Start 3m left of American Pie on high LH slopey scoop and the RH slopey crimp. Make a hard pull off the ground and a really hard move and head up the right-leaning diagonal seam.", "printed_number": null, "grade_note": null, "photo": "photos/108-1.jpg"}, {"id": 423, "page": 117, "area": "Loopeys", "boulder": "Overlooked Wall", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Climb the left arching rib across the roof to top out right of Devil's Councillor.", "printed_number": "21", "grade_note": null, "photo": "photos/117-2.jpg"}, {"id": 460, "page": 133, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Climb Spanking the Monkeybars to the double pockets and make some long moves out left on very poor holds to finish on the ledge at the lip.", "printed_number": "24", "grade_note": null, "photo": "photos/130-1.jpg"}, {"id": 481, "page": 139, "area": "Mt Stapylton", "boulder": "Epsilon Wall", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on the low, jugy ledge and make some big moves on small holds up and left.", "printed_number": "6", "grade_note": null, "photo": "photos/139-1.jpg"}, {"id": 534, "page": 151, "area": "Trackside", "boulder": "Tiger Boulder", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The other side of the Seen & Unseen arete (on the west face) awaits a bold suitor, one willing to risk hard climbing above a landing that quickly falls away.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 535, "page": 151, "area": "Trackside", "boulder": "Tiger Boulder", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Stand start with the high mono and climb up via a pocket and top out on lumpy features. Like the other line on this face it requires ample pads and spotters.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 546, "page": 155, "area": "Trackside", "boulder": "Paul's Boulder", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "We have it on good authority from one N. Hukkataival that the arete will go.", "printed_number": null, "grade_note": null, "photo": "photos/154-3.jpg"}, {"id": 547, "page": 155, "area": "Trackside", "boulder": "Paul's Boulder", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start just right of the arete on an undercling pocket and high dimple pocket. Climb up past a flake to top out on crimps.", "printed_number": null, "grade_note": null, "photo": "photos/154-2.jpg"}, {"id": 548, "page": 155, "area": "Trackside", "boulder": "Orphan Boulders", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on a jug on the right side of the wall. Climb up and left through pockets and top out over the left side of the wall.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 596, "page": 168, "area": "Mt Stapylton", "boulder": "Lower Taipan", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The direct line into Zeus. Sit start with LH pinch and RH on a bad pocket. Brutally hard moves between small and thin pockets to finish on the jug just below the bolt.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 597, "page": 168, "area": "Mt Stapylton", "boulder": "Lower Taipan", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The project to the right of #2. Start with LH gaston and RH side-pull and climb up slopey crimps to a big move to a jug and finish on the horizontal crack.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 598, "page": 168, "area": "Mt Stapylton", "boulder": "Lower Taipan", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Starts to the right of #3 matched on a slopey block. Make a big cross to a pocket and jump the slopey rail and finish as for #3.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 599, "page": 168, "area": "Mt Stapylton", "boulder": "Lower Taipan", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The direct line up from #4 to the horizontal break via pocket and a side-pull.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 602, "page": 169, "area": "Mt Stapylton", "boulder": "Lower Taipan", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The only obvious line up the right end of the cave starting matched on juggy rail undercling. Move up right to the jug and crimp, out to the slopey rail and make a big move to the horizontal break.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 603, "page": 170, "area": "Mt Stapylton", "boulder": "Wildsides", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Climb Lazy Moonell to the headwall, then bust out left.", "printed_number": null, "grade_note": null, "photo": null}, {"id": 623, "page": 176, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start on pockets 2m left of the lower juggy flake feature (below that of Kings Cross). Hard moves on small undercling directly up into the good incut hold of When We Were Kings, finishing as for that line.", "printed_number": null, "grade_note": null, "photo": "photos/176-1.jpg"}, {"id": 626, "page": 177, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start in the chossier rock on the left side of a small tree. Climb left into an undercling pocket and up to edges, to the When We Were Kings incut finish holds.", "printed_number": null, "grade_note": null, "photo": "photos/176-1.jpg"}, {"id": 627, "page": 177, "area": "Mt Stapylton", "boulder": "Between the Sheeps", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "A far more appealing line. Sit start on the right hand side of a small tree (3m right of Family Loss) on a sidepull flake and incut jug/slot. Climb up on good incut and bad undercling. Make a huge move to a side-pull pocket and finish on jugs just higher.", "printed_number": null, "grade_note": null, "photo": "photos/177-1.jpg"}, {"id": 655, "page": 185, "area": "Mt Stapylton", "boulder": "Silica Superhighway Boulder", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "May have been climbed. On the front of the Silica Superhighway boulder is an obvious line that starts on low pockets off a boulder then climbs the groove above to a high finish.", "printed_number": "25", "grade_note": null, "photo": null}, {"id": 662, "page": 187, "area": "Mt Stapylton", "boulder": "Caves Club", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Sit start as for Sultan of Swing then climb left up the pretty, arching rib to meet Cave Club at the sloper.", "printed_number": null, "grade_note": null, "photo": "photos/187-1.jpg"}, {"id": 664, "page": 187, "area": "Mt Stapylton", "boulder": "Caves Club", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start under the roof on a big undercling and climb out to a good hold. Make a hard press move right to a pocket and continue to top out onto the ledge.", "printed_number": null, "grade_note": null, "photo": "photos/187-1.jpg"}, {"id": 668, "page": 190, "area": "Mt Stapylton", "boulder": "Ground Control Caves: Upper Cave", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Looks brutally hard. Climb Dead Heat to the slopey rail, up to crimpy pocket. Make a big move left to the pocket in the roof, then into gaston and the top.", "printed_number": "4", "grade_note": null, "photo": "photos/190-1.jpg"}, {"id": 680, "page": 194, "area": "Mt Stapylton", "boulder": "Farside", "name": "PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Start on small edges at the base of the long rail. Traverse out to pockets and move under the prow to finish up Raging Bull. A prized line that is sure to be one of the Grampians' hardest when it falls.", "printed_number": "1", "grade_note": null, "photo": "photos/194-3.jpg"}, {"id": 749, "page": 211, "area": "The Bleachers", "boulder": "Heart Boulder", "name": "RIGHT ARETE", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The right arete of the east face also looks good.", "printed_number": "8", "grade_note": null, "photo": null}, {"id": 1183, "page": 310, "area": "Love Triangle", "boulder": "The Obelisk", "name": "RIGHT OBELISK", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "From the Middle Obelisk start, climb up and right past horizontal pocket.", "printed_number": null, "grade_note": null, "photo": "photos/310-1.jpg"}, {"id": 1238, "page": 322, "area": "The Tower", "boulder": "Tower Proper (main wall)", "name": "SHARK ARETE", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Being the first to climb this monster will make you feel like you Fanninged a shark. At the end of the Towers main wall is this highball arete. In the furious early years of development it was attempted by Julian Saunders a bunch of times before the shark took its toll and Jules twisted his ankle badly on the two-tier landing. Not to overstate it, but it's one of the best unclimbed lines in the Grampians.", "printed_number": "4", "grade_note": null, "photo": "photos/321-1.jpg"}, {"id": 857, "page": 231, "area": "Valley of the Giants", "boulder": "Taken Boulder", "name": "STEEL TAYLOR", "grade_raw": "PROJECT", "grade_num": null, "pictured": 0, "description": "Same finish as for Shakey Taylor but sit start further left.", "printed_number": "19", "grade_note": null, "photo": null}, {"id": 471, "page": 135, "area": "Mt Stapylton", "boulder": "Kindergarten", "name": "THE BEVAN RULE", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "An old project of Matt Tait's. Sit start 2m right of the Nevin Rule on a horn and pinch. Move up right to good pinch underclings and span left to poor gastons. Finish up the Nevin Rule.", "printed_number": "35", "grade_note": null, "photo": null}, {"id": 391, "page": 108, "area": "Hollow Mountain Cave", "boulder": null, "name": "THE LEVITATION PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "Who doesn't want to levitate? Sit start at Rave Heart and climb right and up the central rib of very poor holds between the two large bowls in the roof (that of Rave Heart and that of Palm Beach) and top out similar to Rave Heart.", "printed_number": "32", "grade_note": null, "photo": "photos/107-1.jpg"}, {"id": 1178, "page": 309, "area": "Love Triangle", "boulder": "Madness Boulder", "name": "THE MADNESS", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "The terrifying line up the main face has been brushed up by Nalle Hukkataival. From low chalked-up edges climb up the middle of the orange face to a very high finish. Do not fall off.", "printed_number": "6", "grade_note": null, "photo": "photos/309-2.jpg"}, {"id": 886, "page": 233, "area": "Valley of the Giants", "boulder": "Weilly Bin Boulder", "name": "WEILLY BIN PROJECT", "grade_raw": "PROJECT", "grade_num": null, "pictured": 1, "description": "A soaring line. The highball arete to the ri s / Left Main", "boulder": "CONSULTANT BOULDER", "name": "BECOMING HARMONIOUS", "grade_raw": "V0", "grade_num": 0, "pictured": 1, "description": "Sit start on lowest bulbous jug and climb up.", "printed_number": "24", "grade_note": null, "photo": "photos/039-2.jpg"}, {"id": 1285, "page": 330, "area": "Windowlicker Area", "boulder": "Smack My Patch Up Boulder", "name": "BITCH TIPS", "grade_raw": "V0", "grade_num": 0, "pictured": 1, "description": "To the left of the prow is an easy crack perfect for those with temperamental skin.", "printed_number": "29", "grade_note": null, "photo": "photos/330-2.jpg"}, {"id": 1065, "page": 277, "area": "BUANDIK / MADE IT", "boulder": "RATIONAL BEING BOULDER (uncertain)", "name": "BLIND FAITH", "grade_raw": "V0", "grade_num": 0, "pictured": 0, "description": "East arête. Sit start, then easily up jugs.", "printed_number": "67", "grade_note": null, "photo": null}, {"id": 752, "page": 212, "area": "The Bleachers", "boulder": "Dovai Ray (hidden chamber)", "name": "BOOM BOX", "grade_raw": "V0", "grade_num": 0, "pictured": 1, "description": "Sit start on fragile edges at waist height, climb mossy face on good holds. Chook Betts", "printed_number": "11", "grade_note": null, "photo": null}, {"id": 174, "page": 60, "area": "Andersens / Right Main", "boulder": "The Pinnacle", "name": "BULGING BUNS", "grade_raw": "V0", "grade_num": 0, "pictured": 0, "description": "Start with a LH pocket undercling and RH small gaston crimp. Climb straight up to bulging slopers and top out.", "printed_number": "59", "grade_note": null, "photo": null}, {"id": 184, "page": 62, "area": "Andersens / Right Main (inferred)", "boulder": "Sydney Highrise Boulder (inferred)", "name": "BUM FUN", "grade_raw": "V0", "grade_num": 0, "pictured": 0, "description": "Who doesn't love a bit of bum fun? Sit start on the low juggy flake just right of the arete. Climb up using the arete and holds on face", "printed_number": "65", "grade_note": null, "photo": "photos/062-2.jpg"},
